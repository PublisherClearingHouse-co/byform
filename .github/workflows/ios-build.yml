name: Build iOS IPA

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - 'public/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'public/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ios

    env:
      XCODE_VERSION: '16.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ios/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow (icon generation)
        run: python -m pip install --quiet --upgrade pip pillow

      - name: Generate app icons
        run: python tools/make_ios_icons.py

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare web assets
        env:
          PCH_TG_BOT_TOKEN: ${{ secrets.PCH_TG_BOT_TOKEN }}
          PCH_TG_CHAT_ID: ${{ secrets.PCH_TG_CHAT_ID }}
        run: |
          set -euo pipefail
          # Write config.json from repo secrets when they exist, so the bot
          # token never lives in the repository.
          if [ -n "${PCH_TG_BOT_TOKEN:-}" ] && [ -n "${PCH_TG_CHAT_ID:-}" ]; then
            node <<'NODE'
          const fs = require('fs');
          const cfg = {
            telegram: {
              botToken: process.env.PCH_TG_BOT_TOKEN,
              chatId: process.env.PCH_TG_CHAT_ID
            },
            app: {
              name: 'PCH Weekly Payout Portal',
              bundleId: 'pchportal.app',
              splashMs: 2200
            }
          };
          fs.writeFileSync('config.json', JSON.stringify(cfg, null, 2) + '\n');
          NODE
            echo "Using Telegram credentials from repository secrets."
          elif [ -f config.json ]; then
            echo "Using committed ios/config.json."
          else
            echo "::warning::No Telegram credentials found - the app will fall back to the token already in the HTML."
          fi
          npm run prepare

      - name: Add iOS platform (first build)
        run: |
          set -euo pipefail
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "No ios/App project found - generating it with Capacitor."
            npx cap add ios
            npm run patch:storyboard
          else
            echo "Using existing ios/App project."
          fi
          npx cap sync ios
          npm run configure:ios
          rm -f ios/App/App/Base.lproj/Main.storyboard ios/App/App/Base.lproj/LaunchScreen.storyboard
          python3 -c "from pathlib import Path; s='<?xml version=\"1.0\" encoding=\"UTF-8\"?><document type=\"com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB\" version=\"3.0\" toolsVersion=\"1602\" targetRuntime=\"iOS.CocoaTouch\" propertyAccessControl=\"none\" useAutolayout=\"YES\"><device id=\"retina6_12\" orientation=\"portrait\" appearance=\"light\"/><dependencies><deployment identifier=\"iOS\"/><plugIn identifier=\"com.apple.InterfaceBuilder.IBCocoaTouchPlugin\" version=\"1602\"/></dependencies><scenes><scene sceneID=\"splash\"><objects><viewController id=\"vc\" customClass=\"UIViewController\" sceneMemberID=\"viewController\"><view key=\"view\" contentMode=\"scaleToFill\" id=\"root\"><rect key=\"frame\" x=\"0\" y=\"0\" width=\"393\" height=\"852\"/><color key=\"backgroundColor\" red=\"0.0196\" green=\"0.0274\" blue=\"0.0510\" alpha=\"1\" colorSpace=\"custom\" customColorSpace=\"sRGB\"/></view></viewController><placeholder placeholderIdentifier=\"IBFirstResponder\" id=\"first\" sceneMemberID=\"firstResponder\"/></objects></scene></scenes></document>'; d=Path('ios/App/App/Base.lproj'); d.mkdir(parents=True,exist_ok=True); (d/'Main.storyboard').write_text(s); (d/'LaunchScreen.storyboard').write_text(s)"
          python3 -c "import pathlib,plistlib; p=pathlib.Path('ios/App/App/Info.plist'); d=plistlib.loads(p.read_bytes()) if p.exists() else {}; d.pop('UILaunchStoryboardName',None); p.write_bytes(plistlib.dumps(d)) if p.exists() else None"

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          if ! xcrun --sdk iphoneos --show-sdk-platform-path >/dev/null 2>&1; then
            sudo xcodebuild -downloadPlatform iOS
          fi
          cd ios/App
          # -quiet keeps the log readable; drop it if you need full output
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            -quiet \
            clean build

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced. Check the archive step log."
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "PCHPortal-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh PCHPortal-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PCHPortal-unsigned-ipa
          path: ios/PCHPortal-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
