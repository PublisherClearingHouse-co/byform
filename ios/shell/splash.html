<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>PCH Weekly Payout Portal</title>
    <style>
      :root {
        --gold: #d9b25c;
        --gold-2: #f3dc9a;
        --ink: #05070d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
      }
      body {
        font-family: -apple-system, "SF Pro Display", "Segoe UI", sans-serif;
        color: #f4efe2;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        animation:
          fadeIn 0.5s ease-out forwards,
          fadeOut 0.45s ease-in 2.15s forwards;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
      @keyframes fadeOut {
        to {
          opacity: 0;
        }
      }
      .stage {
        width: 100%;
        height: 100%;
        position: relative;
        display: grid;
        place-items: center;
        background: radial-gradient(
          120% 90% at 50% 42%,
          #141a28 0%,
          #05070d 62%,
          #000 100%
        );
        overflow: hidden;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      .grid {
        position: absolute;
        inset: -30%;
        background-image:
          linear-gradient(rgba(217, 178, 92, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(217, 178, 92, 0.07) 1px, transparent 1px);
        background-size: 46px 46px;
        transform: perspective(520px) rotateX(62deg) translateY(-12%);
        animation: gridFlow 9s linear infinite;
        opacity: 0.55;
      }
      @keyframes gridFlow {
        to {
          background-position:
            0 46px,
            46px 0;
        }
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 50%,
          transparent 35%,
          rgba(0, 0, 0, 0.72) 100%
        );
      }

      .content {
        position: relative;
        text-align: center;
        width: 100%;
        max-width: 340px;
      }
      .crest {
        width: 104px;
        height: 104px;
        margin: 0 auto 20px;
        border-radius: 26px;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at 35% 28%, #2a3346, #0a0e18 72%);
        border: 2px solid rgba(217, 178, 92, 0.65);
        box-shadow:
          0 0 0 6px rgba(217, 178, 92, 0.06),
          0 18px 40px rgba(0, 0, 0, 0.65);
        animation:
          crestIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both,
          crestGlow 2.8s ease-in-out 0.9s infinite;
      }
      .crest img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 24px;
      }
      @keyframes crestIn {
        from {
          opacity: 0;
          transform: scale(0.55);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes crestGlow {
        0%,
        100% {
          box-shadow:
            0 0 0 6px rgba(217, 178, 92, 0.06),
            0 18px 40px rgba(0, 0, 0, 0.65);
        }
        50% {
          box-shadow:
            0 0 0 12px rgba(217, 178, 92, 0.1),
            0 18px 52px rgba(217, 178, 92, 0.18);
        }
      }

      h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        line-height: 1.35;
        background: linear-gradient(
          180deg,
          #fffaf0 5%,
          #f3dc9a 45%,
          #c19a4a 95%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: rise 0.8s ease-out 0.35s both;
      }
      .sub {
        margin-top: 12px;
        font-size: 10px;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: rgba(226, 232, 240, 0.62);
        animation: rise 0.8s ease-out 0.8s both;
      }
      .rule {
        height: 2px;
        margin: 20px auto 0;
        transform: scaleX(0);
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
        animation: rule 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
      }
      @keyframes rule {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .bar {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: calc(46px + env(safe-area-inset-bottom));
        max-width: 300px;
        margin: 0 auto;
        opacity: 0;
        animation: rise 0.6s ease-out 1s forwards;
      }
      .track {
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 99px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: linear-gradient(90deg, #9b7530, var(--gold-2), var(--gold));
        box-shadow: 0 0 14px rgba(243, 220, 154, 0.55);
        animation: load 1.2s cubic-bezier(0.4, 0, 0.2, 1) 1.05s forwards;
      }
      @keyframes load {
        to {
          width: 100%;
        }
      }
      .foot {
        position: absolute;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        text-align: center;
        font-size: 9px;
        letter-spacing: 0.3em;
        color: rgba(148, 163, 184, 0.5);
        text-transform: uppercase;
        opacity: 0;
        animation: rise 0.6s ease-out 1.2s forwards;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid"></div>
      <div class="vignette"></div>
      <div class="content">
        <div class="crest"><img src="app-icon.png" alt="PCH" /></div>
        <h1>PCH Weekly<br />Payout Portal</h1>
        <div class="sub">Verified Weekly Disbursements</div>
        <div class="rule"></div>
      </div>
      <div class="bar">
        <div class="track"><div class="fill"></div></div>
      </div>
      <div class="foot">Connecting to secure services</div>
    </div>
    <script>
      /* Hand over to the app once the intro has played. */
      (function () {
        var ms = 2300;
        setTimeout(function () {
          try {
            location.replace("index.html");
          } catch (e) {}
        }, ms);
      })();
    </script>
  </body>
</html>
